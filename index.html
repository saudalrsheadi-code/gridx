<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GRIDX | جريد اكس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="نموذج أولي لمنصة إدارة العمليات والمالية لمؤسسة GRID X">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Montserrat:wght@800&display=swap">
<style>
/* Layout: right-side collapsible rail + top bar + content canvas.
   Identity: GRID X logo — navy-blue + sky-cyan, four rotated tiles. The tile (rotated rounded square) is the system's mark:
   brand, active nav marker, status dots, loaders, empty states. Navy = interactive accent; cyan = data/brand only. */
:root {
  --bg: #F3F6FA; --surface: #FFFFFF; --surface-2: #F7F9FC; --surface-3: #EBF0F6;
  --fg: #142033; --fg-2: #5B6B80; --fg-3: #627389;
  --on-err: #FFFFFF;
  --line: #E1E7EF; --line-2: #C9D3DF;
  --primary: #0B5CAD; --primary-50: #EAF2FB; --primary-100: #D3E4F6; --primary-700: #084A8C; --on-primary: #FFFFFF;
  --cyan: #1CAAE8; --cyan-ink: #0274AE; --cyan-50: #E7F6FD; --cyan-100: #C9ECFB;
  --teal: var(--cyan-ink); --teal-50: var(--cyan-50); --teal-100: var(--cyan-100);
  --ok: #157A3E; --ok-50: #EDF8F1; --warn: #A65A06; --warn-50: #FFF6E8; --err: #B42318; --err-50: #FDF0EE; --info-50: #EEF4FC;
  --ok-line: #BFE3CC; --warn-line: #F1D7AE; --err-line: #F2C4BE; --info-line: #CADBF2;
  --chart-a: #0B5CAD; --chart-b: #1CAAE8; --chart-muted: #B7C3D2; --chart-grid: #E4EAF1; --chart-axis: #8A99AD; --chart-ink: #142033;
  --ring-track: #E7EDF4;
  --cat-1: #0B5CAD; --cat-2: #1CAAE8; --cat-3: #5B84C4; --cat-4: #86D3F2; --cat-5: #1E3F6E; --cat-6: #A9BCD6; --cat-7: #0C86BA;
  --overlay: rgba(10, 22, 40, .44);
  --topbar: rgba(255, 255, 255, .94);
  --f-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif;
  --f-num: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
  --f-brand: 'Montserrat', 'Segoe UI', Arial, sans-serif;
  --fs-meta: 12px; --fs-sec: 13px; --fs-body: 14px;
  --r: 8px; --r-lg: 12px;
  --sh: none;
  --sh-pop: 0 10px 28px rgba(20, 32, 51, .08), 0 2px 6px rgba(20, 32, 51, .05);
  --edge: inset 0 0 0 0 transparent;
  --d-fast: 150ms; --d-base: 200ms; --d-slow: 300ms; --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-in: cubic-bezier(.4, 0, 1, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-gx-theme="auto"]:not([data-theme="light"]) {
    --bg: #0F1012; --surface: #17181B; --surface-2: #131417; --surface-3: #232529;
    --fg: #EDEEF0; --fg-2: #AEB3BA; --fg-3: #9096A0;
    --on-err: #2A0A06; --line: #2A2C31; --line-2: #3B3E45;
    --primary: #5AA2F0; --primary-50: rgba(90, 162, 240, .12); --primary-100: rgba(90, 162, 240, .26); --primary-700: #7DB6F4; --on-primary: #06111F;
    --cyan: #3BC0F5; --cyan-ink: #5CCBF7; --cyan-50: rgba(59, 192, 245, .12); --cyan-100: rgba(59, 192, 245, .24);
    --ok: #4CC27A; --ok-50: rgba(76, 194, 122, .12); --warn: #F0A54A; --warn-50: rgba(240, 165, 74, .12); --err: #F27466; --err-50: rgba(242, 116, 102, .12); --info-50: rgba(90, 162, 240, .1);
    --ok-line: rgba(76, 194, 122, .3); --warn-line: rgba(240, 165, 74, .3); --err-line: rgba(242, 116, 102, .32); --info-line: rgba(90, 162, 240, .3);
    --chart-a: #5AA2F0; --chart-b: #3BC0F5; --chart-muted: #4A4E56; --chart-grid: #2A2C31; --chart-axis: #9096A0; --chart-ink: #EDEEF0; --ring-track: #26282D;
    --cat-1: #5AA2F0; --cat-2: #3BC0F5; --cat-3: #8DB4E6; --cat-4: #9EE1FA; --cat-5: #2F64A8; --cat-6: #6B7280; --cat-7: #1D93C7;
    --overlay: rgba(0, 0, 0, .6); --topbar: rgba(23, 24, 27, .96);
    --sh: none; --sh-pop: 0 0 0 1px rgba(255, 255, 255, .06), 0 16px 40px rgba(0, 0, 0, .45); --edge: inset 0 1px 0 rgba(255, 255, 255, .04);
    color-scheme: dark;
  }
}
:root[data-gx-theme="dark"], :root[data-gx-theme="auto"][data-theme="dark"] {
  --bg: #0F1012; --surface: #17181B; --surface-2: #131417; --surface-3: #232529;
  --fg: #EDEEF0; --fg-2: #AEB3BA; --fg-3: #9096A0;
    --on-err: #2A0A06; --line: #2A2C31; --line-2: #3B3E45;
  --primary: #5AA2F0; --primary-50: rgba(90, 162, 240, .12); --primary-100: rgba(90, 162, 240, .26); --primary-700: #7DB6F4; --on-primary: #06111F;
  --cyan: #3BC0F5; --cyan-ink: #5CCBF7; --cyan-50: rgba(59, 192, 245, .12); --cyan-100: rgba(59, 192, 245, .24);
  --ok: #4CC27A; --ok-50: rgba(76, 194, 122, .12); --warn: #F0A54A; --warn-50: rgba(240, 165, 74, .12); --err: #F27466; --err-50: rgba(242, 116, 102, .12); --info-50: rgba(90, 162, 240, .1);
  --ok-line: rgba(76, 194, 122, .3); --warn-line: rgba(240, 165, 74, .3); --err-line: rgba(242, 116, 102, .32); --info-line: rgba(90, 162, 240, .3);
  --chart-a: #5AA2F0; --chart-b: #3BC0F5; --chart-muted: #4A4E56; --chart-grid: #2A2C31; --chart-axis: #9096A0; --chart-ink: #EDEEF0; --ring-track: #26282D;
    --cat-1: #5AA2F0; --cat-2: #3BC0F5; --cat-3: #8DB4E6; --cat-4: #9EE1FA; --cat-5: #2F64A8; --cat-6: #6B7280; --cat-7: #1D93C7;
  --overlay: rgba(0, 0, 0, .6); --topbar: rgba(23, 24, 27, .96);
  --sh: none; --sh-pop: 0 0 0 1px rgba(255, 255, 255, .06), 0 16px 40px rgba(0, 0, 0, .45); --edge: inset 0 1px 0 rgba(255, 255, 255, .04);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: var(--fs-body); line-height: 1.55; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { background: var(--surface); }
.num, td.n, .tnum { font-variant-numeric: tabular-nums; font-family: var(--f-num); }
span.num, .kpi-v .num, .big .num { direction: ltr; unicode-bidi: isolate; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--primary-100); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- identity: the tile ---------- */
.tile { display: inline-block; width: 7px; height: 7px; border-radius: 1.5px; transform: rotate(45deg); background: currentColor; flex: 0 0 auto; }
.brand-svg { display: block; }
.wordmark { font-family: var(--f-brand); font-weight: 800; letter-spacing: .01em; color: var(--primary); direction: ltr; line-height: 1; }
.watermark { position: absolute; inset-inline-start: -40px; top: -50px; width: 260px; height: 260px; opacity: .05; pointer-events: none; }

/* ---------- shell ---------- */
.app { display: flex; min-height: 100%; }
.side { width: 252px; flex: 0 0 252px; background: var(--surface); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); z-index: 30; box-shadow: var(--edge); }
.side.collapsed { width: 72px; flex-basis: 72px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); min-height: 64px; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; gap: 3px; }
.brand-txt .wordmark { font-size: 20px; text-align: right; }
.brand-txt span { font-size: var(--fs-meta); color: var(--fg-2); }
.side.collapsed .brand { justify-content: center; padding-inline: 8px; }
.side.collapsed .brand-txt, .side.collapsed .nav-l, .side.collapsed .nav-badge, .side.collapsed .side-foot-txt { display: none; }
.nav { padding: 10px 8px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nav-sec { font-size: var(--fs-meta); color: var(--fg-3); padding: 12px 10px 4px; }
.side.collapsed .nav-sec { visibility: hidden; height: 8px; padding: 0; }
.nav button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 38px; border-radius: 8px; color: var(--fg-2); cursor: pointer; font-size: var(--fs-body); position: relative; transition: background-color var(--d-fast) var(--ease-out); }
.nav button:hover { background: var(--surface-2); color: var(--fg); }
.nav button.on { background: var(--primary-50); color: var(--primary); font-weight: 600; }
.nav button.on::after { content: ""; position: absolute; inset-inline-start: 2px; top: 50%; width: 6px; height: 6px; border-radius: 1.5px; background: var(--cyan); transform: translateY(-50%) rotate(45deg); }
.side.collapsed .nav button { justify-content: center; }
.nav button:focus-visible { outline: 2px solid var(--primary); }
.nav-l { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-badge { font-size: var(--fs-meta); background: var(--err-50); color: var(--err); border-radius: 10px; padding: 0 7px; font-weight: 600; }
.side-foot { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.side-foot-txt { font-size: var(--fs-meta); color: var(--fg-2); line-height: 1.5; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--topbar); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; min-height: 64px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
.top-title { min-width: 0; flex: 1; }
.crumb { font-size: var(--fs-meta); color: var(--fg-2); display: flex; gap: 6px; align-items: center; }
.top-title h1 { font-size: 18px; margin: 0; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.qs { position: relative; width: 300px; }
.qs label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.qs input { width: 100%; padding: 8px 34px 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: var(--fs-sec); }
.qs input:focus { background: var(--surface); border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-100); }
.qs .ico { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-3); pointer-events: none; }
.qs-res { position: absolute; top: calc(100% + 6px); inset-inline: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--sh-pop); max-height: 360px; overflow: auto; z-index: 50; padding: 4px; }
.qs-res button { all: unset; display: flex; gap: 8px; width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: var(--fs-sec); align-items: center; }
.qs-res button:hover, .qs-res button:focus-visible { background: var(--surface-2); }
.qs-res small { color: var(--fg-2); font-size: var(--fs-meta); }
.icon-btn { all: unset; box-sizing: border-box; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--fg-2); position: relative; flex: 0 0 auto; transition: background-color var(--d-fast) var(--ease-out); }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn:focus-visible { outline: 2px solid var(--primary); }
.icon-btn[data-tip]::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--surface); font-size: var(--fs-meta); padding: 5px 9px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--d-fast) var(--ease-out); z-index: 70; font-weight: 500; }
.icon-btn[data-tip]:hover::after, .icon-btn[data-tip]:focus-visible::after { opacity: 1; }
.side .icon-btn[data-tip]::after { top: auto; bottom: calc(100% + 8px); }
.dot { position: absolute; top: -5px; inset-inline-end: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--err); color: var(--on-err); font-size: var(--fs-meta); font-weight: 600; display: grid; place-items: center; padding: 0 4px; line-height: 1; }
.role-sel { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px 10px; background: var(--surface); min-height: 38px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--cyan-50); color: var(--cyan-ink); display: grid; place-items: center; font-weight: 600; font-size: var(--fs-meta); flex: 0 0 28px; }
.role-sel select { border: 0; background: transparent; padding: 4px 2px; font-weight: 600; font-size: var(--fs-sec); cursor: pointer; }
.role-sel select:focus { outline: none; }
.role-sel select option { background: var(--surface); color: var(--fg); }
.demo-bar { background: var(--warn-50); border-bottom: 1px solid var(--warn-line); color: var(--warn); font-size: var(--fs-sec); padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo-bar b { font-weight: 600; }
.save-state { font-size: var(--fs-meta); color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.save-state .tile { width: 6px; height: 6px; color: var(--ok); }
.save-state.off .tile { color: var(--warn); }
.content { padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; max-width: 1480px; width: 100%; }
.mob-only { display: none; }

/* ---------- surfaces ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh), var(--edge); min-width: 0; position: relative; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h2, .panel-h h3 { font-size: 15px; margin: 0; font-weight: 600; line-height: 1.25; }
.panel-h .sub { color: var(--fg-2); font-size: var(--fs-sec); }
.panel-b { padding: 16px; }
.panel-b.tight { padding: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--fg-2); }
.small { font-size: var(--fs-sec); }
.xs { font-size: var(--fs-meta); }
.strong { font-weight: 600; }
.sp { flex: 1; }
.hr { height: 1px; background: var(--line); margin: 4px 0; }
.note { font-size: var(--fs-sec); color: var(--fg-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; line-height: 1.7; }
.note b { color: var(--fg); font-weight: 600; }
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; font-size: var(--fs-sec); line-height: 1.65; border: 1px solid; }
.callout.err { background: var(--err-50); border-color: var(--err-line); color: var(--err); }
.callout.warn { background: var(--warn-50); border-color: var(--warn-line); color: var(--warn); }
.callout.info { background: var(--info-50); border-color: var(--info-line); color: var(--primary); }
.callout.ok { background: var(--ok-50); border-color: var(--ok-line); color: var(--ok); }
.callout svg { flex: 0 0 auto; margin-top: 3px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--edge); }
.kpi { padding: 14px 16px; border-inline-start: 1px solid var(--line); margin-inline-start: -1px; border-top: 1px solid var(--line); margin-top: -1px; min-width: 0; }
.kpi-l { font-size: var(--fs-sec); color: var(--fg-2); display: flex; gap: 6px; align-items: center; }
.kpi-v { font-size: 20px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.25; }
.kpi-v small { font-size: var(--fs-meta); font-weight: 500; color: var(--fg-2); margin-inline-start: 4px; }
.kpi-s { font-size: var(--fs-meta); color: var(--fg-2); margin-top: 2px; }
.kpi-link { display: block; background: none; border: 0; padding: 0; margin-top: 2px; font: inherit; font-size: 20px; font-weight: 600; color: inherit; cursor: pointer; text-align: start; border-radius: 4px; }
.kpi-link .num { text-decoration: underline dotted transparent; text-underline-offset: 4px; transition: text-decoration-color var(--dur-1, .15s); }
.kpi-link:hover .num, .kpi-link:focus-visible .num { text-decoration-color: currentColor; }
.kpi-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.big-link { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: start; border-radius: 4px; }
.big-link:hover .num, .big-link:focus-visible .num { text-decoration: underline dotted; text-underline-offset: 6px; }
.big-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.kpi.t-teal .kpi-v { color: var(--cyan-ink); }
.kpi.t-err .kpi-v { color: var(--err); }
.kpi.t-warn .kpi-v { color: var(--warn); }
.kpi.t-ok .kpi-v { color: var(--ok); }
.tip { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line-2); color: var(--fg-3); font-size: var(--fs-meta); cursor: help; position: relative; flex: 0 0 16px; line-height: 1; }
.tip:hover::after, .tip:focus::after { content: attr(data-t); position: absolute; bottom: calc(100% + 6px); inset-inline-start: -10px; width: 250px; background: var(--fg); color: var(--surface); font-size: var(--fs-meta); line-height: 1.6; padding: 8px 10px; border-radius: 7px; z-index: 60; white-space: normal; font-weight: 400; }

/* cash hero */
.cash-hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); overflow: hidden; }
.cash-hero > div { padding: 18px; min-width: 0; position: relative; }
.cash-hero > div + div { border-inline-start: 1px solid var(--line); }
.big { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.big small { font-size: var(--fs-sec); font-weight: 500; color: var(--fg-2); margin-inline-start: 4px; }
.lbl { font-size: var(--fs-sec); color: var(--fg-2); }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: var(--fs-sec); padding: 4px 0; }
.kv > span:first-child { color: var(--fg-2); }
.kv .num { font-weight: 500; }
.kv.tot { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; font-weight: 600; }
.kv.tot > span:first-child { color: var(--fg); }
.formula { font-size: var(--fs-meta); color: var(--fg-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; margin-top: 8px; line-height: 1.7; }

/* ---------- rings (dashboard ratios) ---------- */
.rings { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.ring-card { all: unset; box-sizing: border-box; cursor: pointer; padding: 16px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; border-inline-start: 1px solid var(--line); position: relative; transition: background-color var(--d-fast) var(--ease-out); min-width: 0; }
.ring-card:first-child { border-inline-start: 0; }
.ring-card:hover { background: var(--surface-2); }
.ring-card:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.ring-card.on { background: var(--primary-50); }
.ring-card.on::after { content: ""; position: absolute; bottom: -5px; left: 50%; width: 9px; height: 9px; background: var(--primary); border-radius: 2px; transform: translateX(-50%) rotate(45deg); }
.ring-card .rl { font-size: var(--fs-sec); font-weight: 600; line-height: 1.35; }
.ring-card .rs { font-size: var(--fs-meta); color: var(--fg-2); line-height: 1.45; }
.ring svg { display: block; direction: ltr; }
.ring .pv { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.ring-detail { border-top: 1px solid var(--line); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 18px; align-items: start; }
.fade-in { animation: fade var(--d-slow) var(--ease-out); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* donut */
.donut-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; justify-items: center; }
.donut-wrap .legend-list { width: 100%; }
.donut-seg { cursor: pointer; transition: opacity var(--d-fast) var(--ease-out); }
.legend-list { display: flex; flex-direction: column; gap: 2px; }
.legend-list button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: var(--fs-sec); }
.legend-list button:hover, .legend-list button.on { background: var(--surface-2); }
.legend-list button:focus-visible { outline: 2px solid var(--primary); }
.legend-list .sw { width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); }
.legend-list .pc { color: var(--fg-2); font-size: var(--fs-meta); min-width: 42px; text-align: left; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: var(--fs-sec); font-weight: 500; white-space: nowrap; line-height: 1.3; min-height: 36px; transition: background-color var(--d-fast) var(--ease-out); }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-700); border-color: var(--primary-700); }
.btn.teal { background: var(--cyan-ink); border-color: var(--cyan-ink); color: var(--on-primary); }
.btn.danger { color: var(--err); border-color: var(--err-line); }
.btn.danger:hover { background: var(--err-50); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--primary); padding-inline: 8px; }
.btn.ghost:hover { background: var(--primary-50); }
.btn.sm { padding: 5px 10px; min-height: 32px; }
.link { all: unset; color: var(--primary); cursor: pointer; font-weight: 500; }
.link:hover { text-decoration: underline; }
.link:focus-visible { outline: 2px solid var(--primary); }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { all: unset; padding: 6px 11px; font-size: var(--fs-sec); border-radius: 6px; cursor: pointer; color: var(--fg-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--sh); }
.seg button:focus-visible { outline: 2px solid var(--primary); }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tabs button { all: unset; padding: 12px 14px; font-size: var(--fs-body); color: var(--fg-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.tabs button.on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tabs button:focus-visible { outline: 2px solid var(--primary); }
.cnt { font-size: var(--fs-meta); background: var(--surface-3); border-radius: 9px; padding: 0 7px; color: var(--fg-2); font-weight: 600; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-meta); font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.badge::before { content: ""; width: 5px; height: 5px; border-radius: 1px; background: currentColor; transform: rotate(45deg); }
.badge.plain::before { display: none; }
.b-gray { background: var(--surface-3); color: var(--fg-2); }
.b-blue { background: var(--primary-50); color: var(--primary); }
.b-teal { background: var(--cyan-50); color: var(--cyan-ink); }
.b-ok { background: var(--ok-50); color: var(--ok); }
.b-warn { background: var(--warn-50); color: var(--warn); }
.b-err { background: var(--err-50); color: var(--err); }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-body); }
.tbl th { text-align: start; font-weight: 600; color: var(--fg-2); font-size: var(--fs-meta); padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--fg); }
.tbl th .arr { font-size: var(--fs-meta); margin-inline-start: 3px; color: var(--primary); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tr.click { cursor: pointer; }
.tbl tr.click td:first-child { box-shadow: inset -2px 0 0 transparent; }
.tbl tr.click:hover td:first-child { box-shadow: inset -2px 0 0 var(--primary); }
.tbl td.n, .tbl th.n { text-align: end; white-space: nowrap; }
.tbl td.c, .tbl th.c { text-align: center; }
.tbl tfoot td { font-weight: 600; background: var(--surface-2); border-top: 1px solid var(--line-2); }
.tbl .sub { color: var(--fg-2); font-size: var(--fs-meta); }
.tbl .neg { color: var(--err); }
.tbl .pos { color: var(--ok); }
.empty { padding: 36px 20px; text-align: center; color: var(--fg-2); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty b { color: var(--fg); font-weight: 600; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.filters input, .filters select { padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 7px; font-size: var(--fs-sec); min-width: 0; min-height: 34px; }
.search-wrap { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; max-width: 400px; }
.search-name { font-size: var(--fs-sec); font-weight: 600; color: var(--fg-2); white-space: nowrap; }
.filters .search { position: relative; flex: 1 1 200px; display: block; }
.filters .search input { width: 100%; padding-inline-start: 30px; }
.filters .search svg { position: absolute; inset-inline-start: 9px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }
.bar-in { display: flex; height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar-in i { display: block; height: 100%; background: var(--cyan); border-radius: 3px; }
.bar-in.warn i { background: var(--warn); }
.bar-in.err i { background: var(--err); }

/* ---------- forms ---------- */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .flabel { font-size: var(--fs-sec); font-weight: 600; color: var(--fg); }
.field .req { color: var(--err); margin-inline-start: 2px; }
.field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; font-size: var(--fs-body); min-height: 40px; }
.field textarea { min-height: 72px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-100); }
.field input[readonly] { background: var(--surface-2); color: var(--fg-2); }
.field .hint { font-size: var(--fs-meta); color: var(--fg-2); line-height: 1.55; }
.field.bad input, .field.bad select { border-color: var(--err); }
.field .ferr { font-size: var(--fs-meta); color: var(--err); }
.inp-money { position: relative; }
.inp-money input { padding-inline-end: 44px; text-align: left; direction: ltr; }
.inp-money span { position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); font-size: var(--fs-meta); color: var(--fg-3); }
.radio-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.radio-cards label { border: 1px solid var(--line-2); border-radius: 9px; padding: 10px 11px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; font-size: var(--fs-sec); line-height: 1.5; }
.radio-cards label.on { border-color: var(--primary); background: var(--primary-50); box-shadow: 0 0 0 1px var(--primary); }
.radio-cards input { margin-top: 3px; accent-color: var(--primary); }
.radio-cards small { display: block; color: var(--fg-2); font-size: var(--fs-meta); margin-top: 2px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: var(--fs-sec); cursor: pointer; line-height: 1.55; }
.check input { margin-top: 3px; accent-color: var(--primary); width: 16px; height: 16px; flex: 0 0 16px; }
.upload { border: 1px dashed var(--line-2); border-radius: 9px; padding: 10px; display: flex; gap: 10px; align-items: center; background: var(--surface-2); color: var(--fg-2); }
.upload img { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.upload input[type=file] { font-size: var(--fs-meta); min-height: 0; border: 0; padding: 0; background: transparent; color: var(--fg-2); }
.calc-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font-size: var(--fs-sec); }

/* ---------- modal ---------- */
.ov { position: fixed; inset: 0; background: var(--overlay); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px; overflow-y: auto; animation: fade var(--d-base) var(--ease-out); }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--sh-pop); width: 100%; max-width: 640px; display: flex; flex-direction: column; margin: auto 0; animation: pop var(--d-base) var(--ease-out); }
.modal.wide { max-width: 920px; }
.modal.xl { max-width: 1100px; }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0; font-size: 16px; flex: 1; font-weight: 600; line-height: 1.3; }
.modal-b { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-f { display: flex; gap: 8px; justify-content: flex-start; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 14px 14px; flex-wrap: wrap; }
@keyframes pop { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }

/* ---------- toasts ---------- */
.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--ok); border-radius: 9px; padding: 10px 12px; box-shadow: var(--sh-pop); font-size: var(--fs-sec); display: flex; gap: 8px; align-items: flex-start; line-height: 1.55; animation: pop var(--d-base) var(--ease-out); }
.toast.err { border-inline-start-color: var(--err); }
.toast.warn { border-inline-start-color: var(--warn); }
.toast > svg { flex: 0 0 auto; margin-top: 3px; }
.toast button { all: unset; cursor: pointer; color: var(--fg-3); margin-inline-start: auto; }

/* ---------- charts ---------- */
.chart { width: 100%; display: block; direction: ltr; overflow: visible; }
.chart text { font-family: var(--f-num); fill: var(--chart-axis); font-size: 12px; }
.chart .ink { fill: var(--chart-ink); font-weight: 600; }
.chart .grid { stroke: var(--chart-grid); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit.on { fill: var(--primary-50); }
.chart-tip { position: absolute; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-pop); border-radius: 8px; padding: 8px 10px; font-size: var(--fs-meta); pointer-events: none; min-width: 150px; z-index: 5; }
.chart-tip b { display: block; font-size: var(--fs-sec); margin-bottom: 4px; }
.chart-tip .kv { padding: 2px 0; font-size: var(--fs-meta); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--fs-meta); color: var(--fg-2); align-items: center; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-inline-end: 6px; transform: rotate(45deg); vertical-align: 0; }
.hbar { display: grid; grid-template-columns: minmax(90px, 140px) 1fr auto; gap: 8px 10px; align-items: center; font-size: var(--fs-sec); }
.hbar .trk { display: flex; height: 9px; background: var(--surface-3); border-radius: 5px; overflow: hidden; }
.hbar .trk i { display: block; height: 100%; background: var(--primary); border-radius: 5px; }
.wf-stage { cursor: pointer; }
.wf-stage:focus { outline: none; }
.wf-stage:focus-visible rect.b, .wf-stage.on rect.b { stroke: var(--chart-ink); stroke-width: 1.5; }

/* ---------- alerts list ---------- */
.alist { display: flex; flex-direction: column; }
.aitem { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.aitem:last-child { border-bottom: 0; }
.sev { width: 4px; align-self: stretch; border-radius: 2px; flex: 0 0 4px; }
.sev.danger { background: var(--err); } .sev.warning { background: var(--warn); } .sev.info { background: var(--primary); } .sev.success { background: var(--ok); }
.aitem .t { font-weight: 600; font-size: var(--fs-body); }
.aitem .d { font-size: var(--fs-sec); color: var(--fg-2); }
.days { font-size: var(--fs-meta); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- documents (always paper-white) ---------- */
.doc { background: #fff; color: #111827; border: 1px solid #E5E7EB; border-radius: 6px; padding: 28px 30px; max-width: 760px; margin: 0 auto; font-size: 13px; }
.doc-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 2px solid #0B5CAD; padding-bottom: 12px; }
.doc-title { text-align: center; font-size: 18px; font-weight: 600; margin: 18px 0 4px; color: #0B5CAD; }
.doc table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.doc td, .doc th { border: 1px solid #D1D5DB; padding: 7px 10px; text-align: start; color: #111827; }
.doc th { background: #F3F6FA; font-weight: 600; width: 34%; }
.doc .amt { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.doc-sign { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 34px; text-align: center; font-size: 12px; }
.doc-sign div { border-top: 1px solid #9CA3AF; padding-top: 6px; }
.doc-foot { margin-top: 22px; font-size: 12px; color: #6B7280; border-top: 1px dashed #D1D5DB; padding-top: 8px; }
.doc-wrap { background: var(--surface-3); padding: 14px; border-radius: 10px; overflow-x: auto; }

/* ---------- technician portal ---------- */
.tech-wrap { min-height: 100%; background: var(--surface-3); display: flex; justify-content: center; padding-block: 0 32px; }
.phone { width: 100%; max-width: 440px; background: var(--bg); min-height: 100%; display: flex; flex-direction: column; }
.tech-top { background: #0B5CAD; color: #fff; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); position: relative; overflow: hidden; }
.tech-top .watermark { opacity: .12; inset-inline-start: -60px; top: -40px; }
.tech-top .wordmark { color: #fff; font-size: 18px; }
.tech-top select { background: rgba(255, 255, 255, .14); color: #fff; border: 1px solid rgba(255, 255, 255, .3); border-radius: 7px; padding: 6px 8px; font-size: var(--fs-sec); min-height: 34px; }
.tech-top select option { color: #142033; background: #fff; }
.tech-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; margin-top: -12px; position: relative; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--edge); }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tbtn { all: unset; box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; cursor: pointer; min-height: 104px; font-weight: 600; font-size: 15px; }
.tbtn:hover { border-color: var(--primary); }
.tbtn:focus-visible { outline: 2px solid var(--primary); }
.tbtn .ti { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--primary-50); color: var(--primary); }
.tbtn.teal .ti { background: var(--cyan-50); color: var(--cyan-ink); }
.tbtn.err .ti { background: var(--err-50); color: var(--err); }
.tbtn small { font-weight: 400; color: var(--fg-2); font-size: var(--fs-meta); }
.req-item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sec); }
.req-item:last-child { border-bottom: 0; }
.tech-form .field input, .tech-form .field select, .tech-form .field textarea { min-height: 48px; font-size: 16px; }
.tech-form .btn { min-height: 48px; font-size: 15px; justify-content: center; }

/* ---------- loader (brand tiles) ---------- */
.boot { min-height: 100vh; display: grid; place-items: center; gap: 12px; color: var(--fg-2); }

/* ---------- reports layout ---------- */
.rep-grid { grid-template-columns: minmax(0, 250px) minmax(0, 1fr); }
.rep-nav { align-self: start; }

/* ---------- responsive ---------- */
@media (max-width: 1280px) { .rings { grid-template-columns: repeat(3, minmax(0, 1fr)); } .ring-card:nth-child(4) { border-inline-start: 0; } .ring-card:nth-child(n+4) { border-top: 1px solid var(--line); } }
@media (max-width: 1180px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-main { grid-template-columns: minmax(0, 1fr); } .qs { width: 220px; } .ring-detail { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) {
  .side { position: fixed; inset-block: 0; right: 0; transform: translateX(110%); transition: transform var(--d-slow) var(--ease-out); box-shadow: var(--sh-pop); width: 272px; height: 100%; padding-top: env(safe-area-inset-top, 0px); }
  .side.open { transform: none; }
  .side.collapsed { width: 272px; }
  .side.collapsed .brand-txt, .side.collapsed .nav-l, .side.collapsed .nav-badge, .side.collapsed .side-foot-txt { display: revert; }
  .side.collapsed .nav button { justify-content: flex-start; }
  .scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 25; }
  .mob-only { display: grid; }
  .desk-only { display: none !important; }
  .g2, .g3, .cash-hero { grid-template-columns: minmax(0, 1fr); }
  .cash-hero > div + div { border-inline-start: 0; border-top: 1px solid var(--line); }
  .qs { display: none; }
  .donut-wrap { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .rep-grid { grid-template-columns: minmax(0, 1fr); }
  .rep-nav .nav { flex-direction: row; overflow-x: auto; }
  .rep-nav .nav button { flex: 0 0 auto; }
  .donut-wrap .legend-list { width: 100%; }
}
@media (max-width: 620px) {
  .btn, .btn.sm { min-height: 44px; }
  .icon-btn { width: 44px; height: 44px; }
  .nav button { min-height: 44px; }
  .field input, .field select, .field textarea, .filters input, .filters select { min-height: 44px; font-size: 16px; }
  .seg button { padding: 12px 12px; }
  .role-sel { min-height: 44px; }
  .role-sel select { min-height: 40px; }
  .content select, .content input:not([type=checkbox]):not([type=radio]):not([type=file]) { min-height: 44px; }
  .search-name { display: none; }
  .search-wrap { max-width: none; flex-basis: 100%; }
  .g4 { grid-template-columns: minmax(0, 1fr); }
  .form { grid-template-columns: minmax(0, 1fr); }
  .top-title h1 { font-size: 16px; }
  .crumb { display: none; }
  .role-sel .avatar { display: none; }
  .save-state span { display: none; }
  .big { font-size: 24px; }
  .modal-b { padding: 14px; }
  .doc { padding: 18px 14px; }
  .doc-sign { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-v { font-size: 17px; }
  .rings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ring-card { border-inline-start: 0 !important; border-top: 1px solid var(--line); }
  .ring-card:nth-child(-n+2) { border-top: 0; }
  .ring-card:nth-child(even) { border-inline-start: 1px solid var(--line) !important; }
}

/* ---------- phone: tables become labelled record cards (sorting stays available on tablet/desktop) ---------- */
@media (max-width: 620px) {
  .tbl-wrap table.tbl, .tbl-wrap .tbl tbody, .tbl-wrap .tbl tfoot, .tbl-wrap .tbl tr, .tbl-wrap .tbl td { display: block; width: 100%; }
  .tbl-wrap .tbl thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .tbl-wrap .tbl tbody tr { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .tbl-wrap .tbl tbody tr:last-child { border-bottom: 0; }
  .tbl-wrap .tbl td { border: 0; padding: 4px 0; display: grid; grid-template-columns: minmax(84px, 38%) minmax(0, 1fr); column-gap: 12px; align-items: baseline; text-align: end !important; white-space: normal; min-height: 0; }

  .tbl-wrap .tbl td:not([data-label]) { grid-template-columns: minmax(0, 1fr); }
  .tbl-wrap .tbl td:empty { display: none; }
  .tbl-wrap .tbl td > div { min-width: 0; text-align: end; }

/* ---------- daily work queue (dashboard) ---------- */
.queue { display: grid; grid-template-columns: repeat(var(--qn, 6), minmax(0, 1fr)); gap: 0; }
@media (max-width: 1180px) { .queue { grid-template-columns: repeat(4, minmax(0, 1fr)); } .q-item:nth-child(5) { border-inline-start: 0; } .q-item:nth-child(n+5) { border-top: 1px solid var(--line); } }
.q-item { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-inline-start: 1px solid var(--line); min-width: 0; transition: background-color var(--d-fast) var(--ease-out); }
.q-item:first-child { border-inline-start: 0; }
.q-item:hover { background: var(--surface-2); }
.q-item:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

.q-item .qa { font-size: var(--fs-meta); color: var(--fg-2); }
.q-item .qv { font-size: var(--fs-meta); color: var(--primary); font-weight: 600; margin-top: 2px; }
.q-item.zero .qn { color: var(--fg-3); }
.q-item.zero .qv { color: var(--fg-3); }
@media (max-width: 620px) { .queue { grid-template-columns: repeat(2, minmax(0, 1fr)); } .q-item { border-inline-start: 0; border-top: 1px solid var(--line); } .q-item:nth-child(even) { border-inline-start: 1px solid var(--line); } .q-item:nth-child(-n+2) { border-top: 0; } .q-item:last-child:nth-child(odd) { grid-column: span 2; } }

/* ---------- القائمة الجانبية: 6 مجموعات وصفحاتها ---------- */
.nav-grp { display: flex; flex-direction: column; }
.nav-grp + .nav-grp { margin-top: 2px; }
.nav button.grp.on { font-weight: 600; color: var(--primary); }
.nav-grp.open .grp.on { background: transparent; }

.nav-grp.open:has(.nav-sub) .grp.on { background: transparent; }
.nav-sub { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 6px; padding-inline-start: 30px; position: relative; }
.nav-sub::before { content: ""; position: absolute; inset-inline-start: 18px; top: 4px; bottom: 4px; width: 1px; background: var(--line); }
.nav .nav-sub button { min-height: 34px; padding: 6px 10px; font-size: var(--fs-sec); }
.nav-grp:not(:has(.nav-sub)) .grp.on { background: var(--primary-50); }
/* شريط صفحات المجموعة أعلى المحتوى (للجوال والشاشات الضيقة) */

.subnav button.on { background: var(--primary-50); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.subnav button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (max-width: 900px) { .subnav { display: flex; } }

/* ---------- الرئيسية: الإجراءات السريعة ورسالة ما بعد الحفظ ---------- */
.quick-actions { padding: 12px; }
.qa-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.qa-btn { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 12px 14px; min-height: 52px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); font-weight: 600; cursor: pointer; transition: border-color var(--d-fast) var(--ease-out), background-color var(--d-fast) var(--ease-out); }
.qa-btn:hover { border-color: var(--primary); background: var(--primary-50); }
.qa-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* شريط اختيار الفترة وأشرطة الاختيار على الجوال: صف واحد يُمرَّر أفقياً داخل الشريط فقط */

/* ---------- صفحات التشغيل: سطر الهدف، الأرقام القابلة للتصفية ---------- */
.page-intro { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 14px; }

/* جداول المال اليومي ذات الأعمدة الكثيرة: هامش أصغر حتى تتسع على الكمبيوتر دون تمرير */

/* بطاقات الشركاء */

/* التقارير: تصنيفات ← بطاقات تقارير ← التقرير */
.rep-cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.rep-cat { flex: 1 1 auto; white-space: nowrap; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg-2); font: inherit; font-size: var(--fs-sec); cursor: pointer; text-align: start; min-width: 0; }
.rep-cat span:nth-child(2) { flex: 1; min-width: 0; }
.rep-cat:hover { border-color: var(--line-2); color: var(--fg); }
.rep-cat.on { border-color: var(--primary); color: var(--primary); background: var(--primary-50); font-weight: 600; }
.rep-cat:focus-visible, .rep-card:focus-visible, .num-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.rep-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin-bottom: 14px; }
.rep-card { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font: inherit; text-align: start; cursor: pointer; color: var(--fg); min-width: 0; }
.rep-card:hover { border-color: var(--line-2); }
.rep-card.on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.rep-card b { font-weight: 600; font-size: var(--fs-sec); }
.rep-tools, .rep-actions { border-bottom: 1px solid var(--line); }
.rep-totals { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.num-link { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; border-bottom: 1px dashed var(--line-2); }
.num-link:hover { color: var(--primary); border-bottom-color: var(--primary); }
.rep-tools-sec { margin: 14px 0; }
.rep-tools-sec .rep-cards { margin-top: 8px; }
.rep-adv { margin-top: 8px; }
/* الطباعة: يُطبع المستند المعروض فقط */
@media print {
  body:has(#doc-print) .app, body:has(#doc-print) .toasts, body:has(#doc-print) .ov:not(:has(#doc-print)) { display: none !important; }
  body:has(#doc-print) .ov:has(#doc-print) { position: static !important; inset: auto; padding: 0 !important; background: #fff !important; overflow: visible !important; display: block !important; animation: none !important; }
  body:has(#doc-print) .ov:has(#doc-print) .modal { max-width: none !important; width: auto !important; border: 0 !important; box-shadow: none !important; animation: none !important; display: block !important; }
  body:has(#doc-print) .ov:has(#doc-print) .modal-h, body:has(#doc-print) .ov:has(#doc-print) .modal-f { display: none !important; }
  body:has(#doc-print) .ov:has(#doc-print) .modal-b, body:has(#doc-print) .doc-wrap { padding: 0 !important; background: #fff !important; overflow: visible !important; max-height: none !important; }

}

.doc td.num { white-space: nowrap; }
.rep-view .tbl td:first-child { white-space: nowrap; }
/* الانتقال إلى التشغيل الفعلي */
.gl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.gl-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.gl-list li.gl-done { background: var(--surface-2); }
.gl-n { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); font-size: var(--fs-meta); flex: none; }

/* =====================================================================
   v17 — تحديث بصري (CSS فقط). المرجع: ux-profile (معيار Stripe).
   حركة جريئة واحدة: القائمة الجانبية كحلية من هوية الشعار. الباقي هادئ.

.kpis { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); }

/* =====================================================================
   v18 — تطبيق design-taste-frontend (وضع التطبيقات) و ui-ux-pro-max
   ===================================================================== */
/* الحد أو الظل، لا الاثنان: العناصر الثابتة بلا ظل */

/* =====================================================================
   v19 — تطبيق ui-ux-pro-max (§1 الوصول، §2 اللمس) — دون تغيير الوظائف
   ===================================================================== */

.kpi-link, .num-link, .link, .big-link { position: relative; }

/* بوابة الفني: عناصر ميدانية بارتفاع 44px على الأقل */

/* =====================================================================

<script>
document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','ar');
/* ============================================================
   GRID X — محرك الحسابات المالية (دوال مستقلة عن الواجهة)
   كل الأرصدة مشتقة من السجلات؛ لا يُخزَّن أي رصيد محسوب.
   ============================================================ */
(function (root) {
  'use strict';

  /* ---------- أدوات رقمية وتواريخ ---------- */
  const C = (x) => Math.round((Number(x) || 0) * 100);      // إلى هللات
  const F = (c) => c / 100;
  const r2 = (x) => F(C(x));
  const sum = (arr, f) => F(arr.reduce((s, x) => s + C(f ? f(x) : x), 0));
  const max0 = (x) => (x > 0 ? x : 0);
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const todayISO = () => iso(new Date());
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
  const inRange = (d, from, to) => !!d && (!from || d >= from) && (!to || d <= to);
  let _seq = 0;
  const uid = (p) => p + '-' + Date.now().toString(36) + (++_seq).toString(36) + Math.random().toString(36).slice(2, 5);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const monthKey = (d) => d.slice(0, 7);
  /* الإلغاء بقيد عكسي (تطوير 2026-10-27، باعتماد المالك): السجل الأصلي يبقى بتاريخه، ويُسجَّل عكسه بتاريخ الإلغاء.
     liveAt: هل العملية قائمة في تاريخ معيّن؟ دون تاريخ = الوضع الحالي (الملغاة غير قائمة). */
  const liveAt = (r, asOf) => !r.cancelledDate || (asOf ? r.cancelledDate > asOf : false);
  const live = (r) => !r.cancelledDate;
  // المساهمة المرحَّلة: معتمدة، أو أُلغيت بعد اعتمادها (لها تاريخ إلغاء) — الأصل يبقى والعكس يُسجَّل
  const postedContrib = (k) => k.status === 'approved' || (k.status === 'cancelled' && !!k.cancelledDate);

  /* ---------- قواميس ---------- */
  const EXTRACT_STATUS = {
    draft: 'مسودة', review: 'قيد المراجعة الداخلية', submitted: 'مرفوع للعميل',
    approved: 'معتمد', partial: 'معتمد جزئياً', collecting: 'قيد التحصيل',
    coll_partial: 'تم التحصيل جزئياً', coll_full: 'تم التحصيل بالكامل',
    rejected: 'مرفوض', cancelled: 'ملغى'
  };
  const APPROVED_SET = ['approved', 'partial', 'collecting'];
  const CONTRIB_TYPES = {
    capital: 'زيادة رأس المال', loan: 'قرض من الشريك', advance: 'سلفة مؤقتة من الشريك',
    expense_paid: 'سداد مصروف نيابة عن المؤسسة', in_kind: 'مساهمة غير نقدية'
  };
  const SETTLE_KINDS = {
    loan_repay: 'سداد قرض شريك', advance_refund: 'استرداد سلفة',
    expense_reimburse: 'رد مصروف دفعه الشريك', capital_return: 'إعادة رأس المال',
    dividend_pay: 'صرف أرباح معتمدة'
  };
  const SETTLE_SOURCE = { loan_repay: 'loan', advance_refund: 'advance', expense_reimburse: 'expense_paid' };
  const RESERVES = {
    emergency: 'مخصص الطوارئ', expansion: 'مخصص التوسع',
    renewals: 'مخصص الصيانة والتجديدات', other: 'مخصص الالتزامات الأخرى'
  };
  const ACCOUNT_TYPES = { bank: 'حساب بنكي', cash: 'صندوق نقدي', custody: 'عهدة ميدانية' };
  // إعدادات قابلة للتعديل (قيم افتراضية إن لم تُحدد في بيانات قديمة)
  const cashSafety = (st) => (st && st.cashSafetyAmount != null && st.cashSafetyAmount !== '' ? r2(st.cashSafetyAmount) : 10000);
  // E1/E2 (إصلاح 2026-10-27): التسجيل الضريبي بتاريخ سريان.
  // settings.vatHistory = [{ from, registered, ... }] بترتيب زمني؛ معالجة ضريبة كل عملية تتبع حالة التسجيل في تاريخها،
  // فلا يعيد تغيير الإعداد الحالي احتساب الفترات السابقة. الحقل settings.vatRegistered للعرض والتوافق فقط حين يوجد السجل.
  // دون سجل (بيانات قديمة لم تُرحَّل) يُقرأ الحقل كما كان.
  function vatRegAt(s, date) {
    const st = (s && s.settings) || {}; const H = st.vatHistory || [];
    if (!H.length) return !!st.vatRegistered;
    let v = !!H[0].registered; const dt = date || todayISO();
    H.forEach((h) => { if (h.from <= dt) v = !!h.registered; });
    return v;
  }
  const vatRegNow = (s) => vatRegAt(s, todayISO());
  const vatEverReg = (s) => { const H = ((s && s.settings) || {}).vatHistory || []; return H.length ? H.some((h) => h.registered) : !!((s && s.settings) || {}).vatRegistered; };
  const docLimit = (st) => (st && st.docRequiredAbove != null && st.docRequiredAbove !== '' ? r2(st.docRequiredAbove) : 1000);

  /* ---------- المستخلصات ---------- */
  function extractCalc(s, x, asOf) {
    const today = asOf || todayISO();
    const rate = x.vatRate == null ? 15 : x.vatRate;
    const taxable = r2(C(x.workValue) / 100 - (Number(x.discounts) || 0));
    const vat = r2(taxable * rate / 100);
    const total = r2(taxable + vat);
    const isApproved = APPROVED_SET.includes(x.status);
    const approvedTaxable = isApproved ? r2(x.approvedTaxable) : 0;
    const approvedVat = r2(approvedTaxable * rate / 100);
    const approvedTotal = r2(approvedTaxable + approvedVat);
    const retention = isApproved && taxable > 0
      ? r2((Number(x.retentions) || 0) * approvedTaxable / taxable)
      : r2(x.retentions || 0);
    // الاستقطاعات: مبالغ يقتطعها العميل نهائياً (غرامات أو خصومات خارج وعاء الضريبة) — تخفض إجمالي المستحق
    const deductions = isApproved ? r2(x.deductions || 0) : 0;
    const totalDue = r2(approvedTotal - deductions);              // إجمالي المستحق لنا (يشمل الاستبقاء)
    const cols = (s.collections || []).filter((c) => c.extractId === x.id && (!asOf || c.date <= asOf) && liveAt(c, asOf));
    const collected = sum(cols, (c) => c.applied);
    const remaining = r2(totalDue - collected);
    const retentionHeld = isApproved ? Math.min(retention, max0(remaining)) : 0;
    // المستحق القابل للتحصيل الآن = إجمالي المستحق − الاستبقاء ؛ المتبقي للتحصيل الآن = القابل للتحصيل − المحصّل
    const collectibleNow = isApproved ? r2(totalDue - retention) : 0;
    const dueNow = r2(max0(remaining - retentionHeld));
    const retentionReleased = !!(x.retentionRelease && x.retentionRelease <= today);
    const collectLimit = retentionReleased ? r2(max0(remaining)) : dueNow;
    let display = x.status;
    if (isApproved && collected > 0) display = remaining <= 0 ? 'coll_full' : 'coll_partial';
    const overdue = isApproved && dueNow > 0 && x.dueDate && x.dueDate < today;
    return { taxable, vat, total, rate, isApproved, approvedTaxable, approvedVat, approvedTotal, deductions, totalDue,
      retention, collected, remaining, retentionHeld, collectibleNow, dueNow, retentionReleased, retentionRelease: x.retentionRelease || null, collectLimit, display, overdue, collections: cols };
  }

  /* ---------- المصروفات ---------- */
  function expenseCalc(s, e) {
    const total = r2((Number(e.amount) || 0) + (Number(e.vat) || 0));
    const pays = (s.payments || []).filter((p) => p.expenseId === e.id && live(p));
    const paid = sum(pays, (p) => p.amount);
    const byPartner = e.funding === 'partner';
    const remaining = byPartner ? 0 : r2(total - paid);
    const active = e.status === 'approved';
    const vatReg = vatRegAt(s, e.date);
    const cost = active ? (vatReg ? r2(e.amount) : total) : 0;
    const inputVat = active && vatReg ? r2(e.vat) : 0;
    let pay;
    if (e.status === 'pending') pay = 'pending';
    else if (e.status === 'rejected') pay = 'rejected';
    else if (e.status === 'cancelled') pay = 'cancelled';
    else if (byPartner) pay = 'partner';
    else pay = paid <= 0 ? 'unpaid' : remaining <= 0 ? 'paid' : 'partial';
    const due = e.dueDate || e.date;
    return { total, paid, remaining, cost, inputVat, pay, payments: pays, due, byPartner };
  }
  const PAY_STATUS = {
    pending: 'بانتظار الاعتماد', rejected: 'مرفوض', cancelled: 'ملغى', partner: 'مدفوع من شريك',
    unpaid: 'غير مدفوع', paid: 'مدفوع بالكامل', partial: 'مدفوع جزئياً'
  };

  /* ---------- الحركات النقدية ---------- */
  function cashMovements(s, asOf) {
    const out = [];
    const push = (m) => { if (!asOf || m.date <= asOf) out.push(m); };
    // العملية الملغاة: حركتها الأصلية بتاريخها + حركة عكسية بتاريخ الإلغاء
    const both = (rec, m) => { if (rec.cancelledDate) m.cancelled = true; push(m); if (rec.cancelledDate) push(Object.assign({}, m, { id: m.id + ':r', date: rec.cancelledDate, amount: -m.amount, reversal: true, cancelled: true, desc: 'عكس: ' + m.desc + (rec.cancelReason ? ' — ' + rec.cancelReason : '') })); };
    (s.collections || []).forEach((c) => {
      const x = s.extracts.find((e) => e.id === c.extractId);
      both(c, { id: c.id, date: c.date, accountId: c.accountId, amount: r2(c.amount), kind: 'collection',
        flow: 'operating', desc: 'تحصيل مستخلص ' + (x ? x.no : ''), ref: c.ref });
    });
    (s.payments || []).forEach((p) => {
      const e = s.expenses.find((x) => x.id === p.expenseId);
      both(p, { id: p.id, date: p.date, accountId: p.accountId, amount: -r2(p.amount), kind: 'payment',
        flow: e && e.capex ? 'investing' : 'operating', desc: 'سداد ' + (e ? e.no + ' — ' + e.desc : 'فاتورة'), ref: p.ref,
        category: e ? e.category : null });
    });
    (s.contributions || []).forEach((k) => {
      if (!postedContrib(k) || !k.accountId) return;
      if (!['capital', 'loan', 'advance'].includes(k.type)) return;
      const p = s.partners.find((x) => x.id === k.partnerId);
      both(k, { id: k.id, date: k.date, accountId: k.accountId, amount: r2(k.amount), kind: 'contribution',
        flow: 'financing', desc: CONTRIB_TYPES[k.type] + ' — ' + (p ? p.name : ''), ref: k.ref });
    });
    (s.settlements || []).forEach((t) => {
      const p = s.partners.find((x) => x.id === t.partnerId);
      both(t, { id: t.id, date: t.date, accountId: t.accountId, amount: -r2(t.amount), kind: 'settlement',
        flow: 'financing', desc: SETTLE_KINDS[t.kind] + ' — ' + (p ? p.name : ''), ref: t.ref });
    });
    (s.transfers || []).forEach((t) => {
      both(t, { id: t.id + ':o', date: t.date, accountId: t.from, amount: -r2(t.amount), kind: 'transfer', flow: 'internal', desc: 'تحويل داخلي صادر', ref: t.note });
      both(t, { id: t.id + ':i', date: t.date, accountId: t.to, amount: r2(t.amount), kind: 'transfer', flow: 'internal', desc: 'تحويل داخلي وارد', ref: t.note });
    });
    (s.adjustments || []).forEach((a) => {
      both(a, { id: a.id, date: a.date, accountId: a.accountId, amount: r2(a.amount), kind: 'adjustment', flow: 'operating', desc: 'تسوية: ' + a.reason, ref: '' });
    });
    out.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    return out;
  }

  function accountBalances(s, asOf) {
    const mv = cashMovements(s, asOf);
    return s.accounts.map((a) => {
      const m = mv.filter((x) => x.accountId === a.id);
      const inflow = sum(m.filter((x) => x.amount > 0), (x) => x.amount);
      const outflow = sum(m.filter((x) => x.amount < 0), (x) => -x.amount);
      return Object.assign({}, a, { inflow, outflow, balance: r2(a.opening + inflow - outflow), count: m.length });
    });
  }
  const totalCash = (s, asOf) => sum(accountBalances(s, asOf), (a) => a.balance);

  /* ---------- قائمة الدخل (أساس الاستحقاق) ---------- */
  // تُحسب من القيود الداخلية حتى تتطابق لوحة التحكم والتقارير والتوزيعات (مصدر واحد)
  function pnl(s, from, to) {
    const J = journal(s).filter((j) => inRange(j.date, from, to));
    let rev = 0, ded = 0, oth = 0, op = 0, shortC = 0, cap = 0, ovat = 0, ivat = 0;
    const byCat = {};
    J.forEach((j) => j.lines.forEach((l) => {
      const net = C(l.dr) - C(l.cr);
      if (l.acc === '4100') rev -= net;
      else if (l.acc === '4190') ded += net;
      else if (l.acc === '4900') oth -= net;
      else if (l.acc === '5100') { op += net; byCat[l.cat] = (byCat[l.cat] || 0) + net; }
      else if (l.acc === '5900') { shortC += net; byCat['عجز وفروقات نقدية'] = (byCat['عجز وفروقات نقدية'] || 0) + net; }
      else if (l.acc === '1510') cap += net;
      else if (l.acc === '2210' && l.vatSrc === 'sale') ovat -= net;
      else if (l.acc === '1310') ivat += net;
    }));
    Object.keys(byCat).forEach((k) => { byCat[k] = F(byCat[k]); if (!byCat[k]) delete byCat[k]; });
    const revenue = F(rev - ded), opex = F(op + shortC), otherIncome = F(oth);
    return { revenue, grossRevenue: F(rev), deductions: F(ded), otherIncome, opex, capex: F(cap), opProfit: r2(revenue + otherIncome - opex), outputVat: F(ovat), inputVat: F(ivat),
      vatNet: F(ovat - ivat), byCat, extractsCount: J.filter((j) => j.kind === 'extract').length, expensesCount: J.filter((j) => j.kind === 'expense').length };
  }

  /* ---------- ضريبة القيمة المضافة (رصيد تراكمي) ---------- */
  function vatPosition(s, asOf) {
    if (!vatEverReg(s)) return { output: 0, input: 0, net: 0, settled: 0, payable: 0 };
    const p = pnl(s, null, asOf);
    const settled = sum((s.vatSettlements || []).filter((v) => (!asOf || v.date <= asOf) && liveAt(v, asOf)), (v) => v.amount);
    return { output: p.outputVat, input: p.inputVat, net: p.vatNet, settled, payable: r2(p.vatNet - settled) };
  }

  /* ---------- الشركاء ---------- */
  function partnerEntries(s, pid) {
    const E = [];
    (s.contributions || []).filter((k) => k.partnerId === pid && postedContrib(k)).forEach((k) => {
      const cat = { capital: 'capital', in_kind: 'capital', loan: 'loan', advance: 'advance', expense_paid: 'expense' }[k.type];
      E.push({ id: k.id, date: k.date, cat, amount: r2(k.amount), desc: (k.original ? 'المساهمة الأصلية في رأس المال' : CONTRIB_TYPES[k.type]) + (k.purpose ? ' — ' + k.purpose : ''), src: 'contribution', ref: k.ref, original: !!k.original });
      if (k.status === 'cancelled') E.push({ id: k.id + ':r', date: k.cancelledDate, cat, amount: -r2(k.amount), desc: k.type === 'expense_paid' ? 'عكس — إلغاء المصروف المرتبط' : 'عكس — إلغاء ' + k.no + (k.cancelReason ? ': ' + k.cancelReason : ''), src: 'contribution', ref: k.ref, reversal: true });
    });
    (s.settlements || []).filter((t) => t.partnerId === pid).forEach((t) => {
      const cat = { loan_repay: 'loan', advance_refund: 'advance', expense_reimburse: 'expense', capital_return: 'capital', dividend_pay: 'dividend' }[t.kind];
      E.push({ id: t.id, date: t.date, cat, amount: -r2(t.applied != null ? t.applied : t.amount), desc: SETTLE_KINDS[t.kind], src: 'settlement', ref: t.ref });
      if (t.excess > 0) E.push({ id: t.id + ':x', date: t.date, cat: 'receivable', amount: r2(t.excess), desc: 'دفعة زائدة مسجلة كمبلغ مدين على الشريك' + (t.excessReason ? ' — السبب: ' + t.excessReason : ''), src: 'excess', ref: t.ref });
      if (t.cancelledDate) {
        E.push({ id: t.id + ':r', date: t.cancelledDate, cat, amount: r2(t.applied != null ? t.applied : t.amount), desc: 'عكس — إلغاء ' + t.no + (t.cancelReason ? ': ' + t.cancelReason : ''), src: 'settlement', ref: t.ref, reversal: true });
        if (t.excess > 0) E.push({ id: t.id + ':xr', date: t.cancelledDate, cat: 'receivable', amount: -r2(t.excess), desc: 'عكس الدفعة الزائدة — إلغاء ' + t.no, src: 'excess', ref: t.ref, reversal: true });
      }
    });
    (s.distributions || []).forEach((d) => {
      const sh = d.snapshot.shares.find((x) => x.partnerId === pid);
      if (sh && sh.amount > 0) E.push({ id: d.id + ':' + pid, date: d.approvedDate, cat: 'dividend', amount: r2(sh.amount), desc: 'أرباح معتمدة — ' + d.label, src: 'distribution', ref: d.no });
    });
    E.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    return E;
  }
  const PARTNER_CATS = {
    capital: 'رأس المال (حقوق ملكية)', loan: 'قروض الشريك (التزام)', advance: 'سلف الشريك (التزام)',
    expense: 'مصروفات دفعها الشريك (التزام)', dividend: 'أرباح مستحقة غير مصروفة', receivable: 'مبالغ مدينة على الشريك'
  };

  function partnerStatement(s, pid, from, to) {
    const E = partnerEntries(s, pid);
    const cats = Object.keys(PARTNER_CATS).map((cat) => {
      const all = E.filter((e) => e.cat === cat);
      const opening = sum(all.filter((e) => from && e.date < from), (e) => e.amount);
      const moves = all.filter((e) => inRange(e.date, from, to));
      const inc = sum(moves.filter((e) => e.amount > 0), (e) => e.amount);
      const dec = sum(moves.filter((e) => e.amount < 0), (e) => -e.amount);
      return { cat, label: PARTNER_CATS[cat], opening, inc, dec, closing: r2(opening + inc - dec), moves };
    });
    return { entries: E.filter((e) => inRange(e.date, from, to)), cats };
  }

  function partnerSummary(s, pid) {
    const ks = (s.contributions || []).filter((k) => k.partnerId === pid);
    const ap = ks.filter((k) => k.status === 'approved');
    const st = (s.settlements || []).filter((t) => t.partnerId === pid && live(t));
    const stm = partnerStatement(s, pid, null, null).cats;
    const bal = {}; stm.forEach((c) => { bal[c.cat] = c.closing; });
    const divAccrued = sum((s.distributions || []), (d) => { const sh = d.snapshot.shares.find((x) => x.partnerId === pid); return sh ? sh.amount : 0; });
    const divPaid = sum(st.filter((t) => t.kind === 'dividend_pay'), (t) => t.applied != null ? t.applied : t.amount);
    return {
      original: sum(ap.filter((k) => k.original), (k) => k.amount),
      additional: sum(ap.filter((k) => !k.original && (k.type === 'capital' || k.type === 'in_kind')), (k) => k.amount),
      loans: sum(ap.filter((k) => k.type === 'loan'), (k) => k.amount),
      advances: sum(ap.filter((k) => k.type === 'advance'), (k) => k.amount),
      expensesPaid: sum(ap.filter((k) => k.type === 'expense_paid'), (k) => k.amount),
      repaid: sum(st.filter((t) => t.kind !== 'dividend_pay'), (t) => t.applied != null ? t.applied : t.amount),
      divAccrued, divPaid, divRemaining: r2(divAccrued - divPaid),
      liabilities: r2((bal.loan || 0) + (bal.advance || 0) + (bal.expense || 0)),
      bal, pendingCount: ks.filter((k) => k.status === 'draft').length
    };
  }

  // الالتزامات تجاه الشركاء (قروض، سلف، مصروفات، أرباح)
  function partnerObligations(s) {
    const rows = [];
    (s.contributions || []).filter((k) => k.status === 'approved' && SETTLE_SOURCE_REV[k.type]).forEach((k) => {
      const kind = SETTLE_SOURCE_REV[k.type];
      const paid = sum((s.settlements || []).filter((t) => t.sourceId === k.id && live(t)), (t) => t.applied != null ? t.applied : t.amount);
      const remaining = r2(k.amount - paid);
