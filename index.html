    else if (reservesSum > afterLoss) errors.push('إجمالي المخصصات يتجاوز الربح المتاح لتكوينها. خفّض النسب أو غيّر أساس الاحتساب.');
    const profitAfterReserves = r2(max0(afterLoss - reservesSum));

    // السيولة
    const cash = totalCash(s, asOf);
    const horizon = Number(st.liabilityHorizon || 30);
    // الالتزامات الواجب تسويتها قبل التوزيع: فواتير الموردين غير المسددة، الضريبة المستحقة، الأرباح المعتمدة غير المصروفة،
    // سلف الشركاء والمصروفات التي دفعوها، والالتزامات المجدولة وقروض الشركاء المستحقة خلال الأفق الزمني المحدد.
    const obl = obligations(s, asOf).filter((o) => {
      if (o.src === 'bill' || o.src === 'vat' || o.src === 'dividend') return true;
      if (o.src === 'partner' && o.type !== 'loan') return true;
      return o.due ? o.days <= horizon : true;
    });
    const oblTotal = sum(obl, (o) => o.amount);
    const resCash = st.reservesBackedByCash ? r2(reservesTotal(s, asOf) + reservesSum) : 0;
    const safety = cashSafety(st);                                     // حد الأمان النقدي: يبقى في الحسابات ولا يُوزّع
    const liquidityCap = r2(max0(cash - oblTotal - resCash - safety));
    const maxDist = r2(Math.max(0, Math.min(profitAfterReserves, liquidityCap)));
    const binding = profitAfterReserves <= liquidityCap ? 'profit' : 'liquidity';
    if (binding === 'liquidity' && afterLoss > 0) warnings.push('السيولة هي القيد الحاكم: المبلغ القابل للتوزيع محدود بالنقد المتاح بعد الالتزامات والمخصصات.');
    if (carriedLoss > 0) warnings.push('تم إطفاء خسائر مرحلة بقيمة ' + carriedLoss.toFixed(2) + ' ر.س قبل احتساب المخصصات.');

    let amount = opts.amount == null || opts.amount === '' ? maxDist : r2(opts.amount);
    if (amount < 0) errors.push('مبلغ التوزيع لا يمكن أن يكون سالباً.');
    if (amount > maxDist) errors.push('مبلغ التوزيع (' + amount.toFixed(2) + ') يتجاوز الحد الأعلى المؤهل للتوزيع (' + maxDist.toFixed(2) + ').');
    if (amount === 0 && !errors.length) errors.push('مبلغ التوزيع صفر؛ لا يوجد ما يُعتمد.');

    // الحصص
    const opPct = Number(st.operatingPct);
    if (!(opPct >= 0 && opPct <= 100)) errors.push('حصة الشريك التشغيلي يجب أن تكون بين 0 و100.');
    const capPartners = s.partners.filter((x) => x.role === 'capital');
    const opPartner = s.partners.find((x) => x.role === 'operating');
    const splitTotal = sum(capPartners, (x) => Number(st.capitalSplit[x.id] || 0));
    if (Math.abs(splitTotal - 100) > 0.001) errors.push('نسب الشركاء الرأسماليين داخل حصتهم الجماعية مجموعها ' + splitTotal + '% ويجب أن يساوي 100%.');
    const distAmt = amount > 0 && amount <= maxDist ? amount : 0;
    const opShare = r2(distAmt * opPct / 100);
    const capPool = r2(distAmt - opShare);
    const shares = [];
    if (opPartner) shares.push({ partnerId: opPartner.id, role: 'operating', pct: opPct, ofPool: null, effective: opPct, amount: opShare });
    let allocated = 0;
    capPartners.forEach((x, i) => {
      const pc = Number(st.capitalSplit[x.id] || 0);
      let a = i === capPartners.length - 1 ? r2(capPool - allocated) : r2(capPool * pc / 100);
      allocated = r2(allocated + a);
      shares.push({ partnerId: x.id, role: 'capital', pct: pc, ofPool: true, effective: r2((100 - opPct) * pc / 100), amount: a });
    });

    const stages = [
      { key: 'revenue', label: 'الإيرادات المعتمدة (الأساس)', value: p.revenue, kind: 'total', detail: 'مجموع صافي المستخلصات المعتمدة (قبل الضريبة) التي اعتُمدت بين ' + from + ' و' + to + ' — عدد ' + (p.extractsCount || 0) + ' مستخلص. لا تشمل المستخلصات المرفوعة غير المعتمدة.' },
      { key: 'opex', label: 'المصروفات التشغيلية', value: -p.opex, kind: 'delta', detail: 'المصروفات المعتمدة غير الرأسمالية خلال الفترة' + (vatRegNow(s) ? ' (بدون ضريبة المدخلات القابلة للاسترداد)' : '') + '. المصروفات الرأسمالية (' + (p.capex || 0).toFixed(2) + ' ر.س) لا تُخصم هنا لأن النموذج لا يحتسب الإهلاك بعد.' },
      { key: 'op', label: 'الربح التشغيلي للفترة', value: p.opProfit, kind: 'total', detail: 'الإيرادات المعتمدة − المصروفات التشغيلية.' },
      { key: 'loss', label: 'خسائر مرحلة', value: -carriedLoss, kind: 'delta', detail: 'نتيجة الفترة السابقة غير المغطاة بتوزيع (منذ ' + (lossStart || 'بداية التشغيل') + ' حتى ما قبل ' + from + '): ' + priorResult.toFixed(2) + ' ر.س. تُطفأ الخسارة فقط.' },
      { key: 'res', label: 'المخصصات', value: -reservesSum, kind: 'delta', detail: resv.map((r) => r.label + ': ' + r.pct + '% من ' + r.baseLabel + ' (' + r.baseVal.toFixed(2) + ') = ' + r.amount.toFixed(2)).join(' | ') },
      { key: 'afterRes', label: 'الربح بعد المخصصات', value: profitAfterReserves, kind: 'total', detail: 'الربح بعد الخسائر − المخصصات.' },
      { key: 'liq', label: 'قيد السيولة', value: -(r2(profitAfterReserves - maxDist)), kind: 'delta', detail: 'النقد في ' + asOf + ': ' + cash.toFixed(2) + ' − الالتزامات الواجب تسويتها: ' + oblTotal.toFixed(2) + (st.reservesBackedByCash ? ' − المخصصات المغطاة نقداً: ' + resCash.toFixed(2) : '') + ' − حد الأمان النقدي: ' + safety.toFixed(2) + ' = ' + liquidityCap.toFixed(2) + ' ر.س' },
      { key: 'max', label: 'الحد الأعلى القابل للتوزيع', value: maxDist, kind: 'total', detail: 'الأقل بين الربح بعد المخصصات والسيولة المتاحة للتوزيع.' },
      { key: 'chosen', label: 'المبلغ المقترح للاعتماد', value: distAmt, kind: 'total', detail: 'يمكن اعتماد مبلغ أقل من الحد الأعلى ليبقى الفرق أرباحاً محتجزة.' }
    ];
    return { from, to, asOf, revenue: p.revenue, otherIncome: p.otherIncome || 0, opex: p.opex, capex: p.capex || 0, opProfit: p.opProfit, byCat: p.byCat,
      carriedLoss, priorResult, reserves: resv, reservesSum, profitAfterReserves, cash, obligations: obl, oblTotal,
      reservesCash: resCash, safety, liquidityCap, maxDist, binding, amount: distAmt, retained: r2(profitAfterReserves - distAmt),
      opPct, shares, stages, errors, warnings, ok: errors.length === 0 };
  }

  /* ---------- المشاريع ---------- */
  function projectStats(s, pr, asOf) {
    const today = asOf || todayISO();
    const xs = s.extracts.filter((x) => x.projectId === pr.id && !['cancelled', 'rejected'].includes(x.status));
    const calcs = xs.map((x) => extractCalc(s, x));
    const exps = s.expenses.filter((e) => e.projectId === pr.id && e.status === 'approved');
    const tasks = (s.tasks || []).filter((t) => t.projectId === pr.id);
    const done = tasks.filter((t) => t.status === 'done').length;
    const late = tasks.filter((t) => t.status !== 'done' && t.due && t.due < today).length;
    // E3 (إصلاح 2026-10-27): الإيراد والتكلفة بالأساس نفسه لقائمة الدخل —
    // الإيراد = المعتمد قبل الضريبة − استقطاعات العميل (حساب 4190)، والتكلفة = المصروفات التشغيلية فقط.
    // المصروفات الرأسمالية تُعرض منفصلة (لا إهلاك في النموذج بعد)، واستهلاك الميزانية يبقى على الإنفاق الكلي (تشغيلي + رأسمالي) كما كان.
    const appr = calcs.filter((c) => c.isApproved);
    const grossRevenue = sum(appr, (c) => c.approvedTaxable);
    const deductions = sum(appr, (c) => c.deductions);
    const revenue = r2(grossRevenue - deductions);
    const cost = sum(exps.filter((e) => !e.capex), (e) => expenseCalc(s, e).cost);
    const capex = sum(exps.filter((e) => e.capex), (e) => expenseCalc(s, e).cost);
    const spend = r2(cost + capex);
    return { extractsTotal: sum(calcs, (c) => c.total), approvedTotal: sum(calcs, (c) => c.approvedTotal), collected: sum(calcs, (c) => c.collected),
      grossRevenue, deductions, revenue, cost, capex, spend, margin: grossRevenue > 0 ? r2(revenue - cost) : null, tasks: tasks.length, done, late, open: tasks.length - done,
      budgetUse: pr.budget ? spend / pr.budget : null };
  }

  /* ---------- المركبة والوقود ---------- */
  function fuelLog(s) {
    const rows = s.expenses.filter((e) => e.category === 'الوقود' && e.odometer && !['rejected', 'cancelled'].includes(e.status))
      .slice().sort((a, b) => (a.odometer - b.odometer));
    return rows.map((e, i) => {
      const prev = i > 0 ? rows[i - 1] : null;
      const total = r2((Number(e.amount) || 0) + (Number(e.vat) || 0));
      const dist = prev ? e.odometer - prev.odometer : null;
      return { id: e.id, date: e.date, odometer: e.odometer, liters: e.liters, total, status: e.status, by: e.submittedBy,
        distance: dist, kmPerL: dist && e.liters ? dist / e.liters : null, costPerKm: dist ? total / dist : null };
    });
  }
  function fuelCalc(prevOdo, curOdo, liters, total) {
    const a = Number(prevOdo), b = Number(curOdo), l = Number(liters), t = Number(total);
    if ([a, b, l, t].some((v) => !isFinite(v)) || prevOdo === '' || curOdo === '' || liters === '' || total === '') return { ok: false, msg: 'أدخل جميع القيم للحساب.' };
    if (b < a) return { ok: false, msg: 'قراءة العداد الحالية أقل من السابقة.' };
    if (b === a) return { ok: false, msg: 'لا توجد مسافة مقطوعة؛ الاستهلاك غير متاح.' };
    if (l <= 0 || t <= 0) return { ok: false, msg: 'الكمية والقيمة يجب أن تكونا أكبر من صفر.' };
    const d = b - a;
    return { ok: true, distance: d, kmPerL: d / l, lPer100: l / d * 100, costPerKm: t / d };
  }
  function vehicleState(s) {
    const v = s.vehicle;
    const odos = [v.baseOdo || 0].concat(s.expenses.filter((e) => e.odometer && !['rejected', 'cancelled'].includes(e.status)).map((e) => e.odometer)).concat((s.maintenance || []).map((m) => m.odometer || 0));
    const odometer = Math.max.apply(null, odos);
    const nextOil = (v.lastOilOdo || 0) + (v.oilInterval || 5000);
    const fuel = fuelLog(s);
    const valid = fuel.filter((f) => f.kmPerL);
    const totDist = valid.reduce((a, f) => a + f.distance, 0);
    const totL = valid.reduce((a, f) => a + Number(f.liters || 0), 0);
    const totCost = valid.reduce((a, f) => a + f.total, 0);
    return { odometer, nextOil, kmToOil: nextOil - odometer, avgKmPerL: totL ? totDist / totL : null, avgCostPerKm: totDist ? totCost / totDist : null, fuel };
  }

  /* ---------- لوحة التحكم ---------- */
  function avgDailyCashOut(s, asOf, windowDays) {
    const from = addDays(asOf, -windowDays + 1);
    const mv = cashMovements(s, asOf).filter((m) => m.date >= from && m.kind === 'payment');
    const first = (s.meta && s.meta.opsStart) || from;
    const effFrom = first > from ? first : from;
    const days = daysBetween(effFrom, asOf) + 1;
    const total = sum(mv, (m) => -m.amount);
    if (days < 14 || total <= 0) return { ok: false, total, days, from: effFrom };
    return { ok: true, total, days, from: effFrom, daily: total / days };
  }

  // الحد المقترح للأمان النقدي = متوسط المصروفات النقدية الشهرية ÷ 2 (قيمة إرشادية)
  function suggestedSafety(s, asOf) {
    const today = asOf || todayISO();
    const b = avgDailyCashOut(s, today, s.settings.runwayWindow || 90);
    if (!b.ok) return { ok: false, reason: 'البيانات غير كافية: يلزم 14 يوماً على الأقل من مدفوعات الفواتير.' };
    const monthly = r2(b.daily * 30);
    return { ok: true, monthly, value: r2(monthly / 2), days: b.days, total: b.total, from: b.from };
  }
  function dashboard(s, from, to, asOf) {
    const today = asOf || todayISO();
    const accts = accountBalances(s, today);
    const cash = sum(accts, (a) => a.balance);
    const resBal = reserveBalances(s, today);
    const resTotal = sum(resBal, (r) => r.balance);
    const available = r2(cash - (s.settings.reservesBackedByCash ? resTotal : 0));
    const calcs = s.extracts.map((x) => ({ x, c: extractCalc(s, x, null) }));
    const approvedUncollected = sum(calcs.filter((o) => o.c.isApproved), (o) => o.c.remaining);
    const submitted = sum(calcs.filter((o) => o.x.status === 'submitted'), (o) => o.c.total);
    const mv = cashMovements(s, today).filter((m) => inRange(m.date, from, to));
    const paidExpenses = sum(mv.filter((m) => m.kind === 'payment'), (m) => -m.amount);
    const ext = mv.filter((m) => m.kind !== 'transfer');
    const cin = sum(ext.filter((m) => m.amount > 0), (m) => m.amount);
    const cout = sum(ext.filter((m) => m.amount < 0), (m) => -m.amount);
    const flows = {};
    ['operating', 'investing', 'financing'].forEach((f) => { flows[f] = sum(ext.filter((m) => m.flow === f), (m) => m.amount); });
    const p = pnl(s, from, to);
    const obl = obligations(s, today);
    const due30 = obl.filter((o) => o.due && o.days <= 30);
    const due30Total = sum(due30, (o) => o.amount);
    const partnerLiab = sum(obl.filter((o) => o.src === 'partner'), (o) => o.amount);
    const divUnpaid = sum(obl.filter((o) => o.src === 'dividend'), (o) => o.amount);
    const expectedIn = sum(calcs.filter((o) => o.c.isApproved && o.c.dueNow > 0 && (!o.x.dueDate || daysBetween(today, o.x.dueDate) <= 30)), (o) => o.c.dueNow);
    const expectedLiquidity = r2(available + expectedIn - due30Total);
    const win = s.settings.runwayWindow || 90;
    const burn = avgDailyCashOut(s, today, win);
    const runway = burn.ok ? available / burn.daily : null;
    const runwayNet = burn.ok ? (available - due30Total) / burn.daily : null;
    return { cash, available, accts, resBal, resTotal, approvedUncollected, submitted, paidExpenses, cin, cout, netFlow: r2(cin - cout), flows,
      pnl: p, due30, due30Total, partnerLiab, divUnpaid, expectedIn, expectedLiquidity, burn, runway, runwayNet, win,
      pendingExpenses: s.expenses.filter((e) => e.status === 'pending') };
  }

  /* الالتزامات القريبة: ما يجب سداده قريباً (خلال الأفق أو بلا تاريخ استحقاق مثل الضريبة والأرباح المعتمدة ومستحقات الشركاء غير القروض) */
  function nearObligations(s, asOf, horizon) {
    const h = Number(horizon || s.settings.liabilityHorizon || 30);
    return obligations(s, asOf).filter((o) => {
      if (o.src === 'bill' || o.src === 'vat' || o.src === 'dividend') return o.due ? o.days <= h : true;
      if (o.src === 'partner' && o.type !== 'loan') return true;
      return o.due ? o.days <= h : true;
    });
  }
  // الأرباح المتاحة للتوزيع الآن: من اليوم التالي لآخر توزيع حتى اليوم، بالنسب الحالية
  function distributableNow(s, asOf) {
    const today = asOf || todayISO();
    const last = (s.distributions || []).slice().sort((a, b) => (a.to < b.to ? -1 : 1)).pop();
    const from = last ? addDays(last.to, 1) : ((s.meta && s.meta.opsStart) || s.settings.fiscalYearStart);
    if (from > today) return { ok: false, reason: 'لا توجد فترة جديدة منذ آخر توزيع.', from, to: today, pv: null };
    const pv = distributionPreview(s, { from, to: today, asOf: today });
    const blocking = pv.errors.filter((e) => !/مبلغ التوزيع صفر/.test(e));
    if (blocking.length) return { ok: false, reason: blocking[0], from, to: today, pv };
    return { ok: true, value: pv.maxDist, from, to: today, pv };
  }

  /* مصدر كل رقم في لوحة التحكم: التعريف وطريقة الحساب والعمليات التي كوّنته.
     يتحقق أن مجموع العمليات يساوي الرقم المعروض (reconciled). */
  function explain(s, key, from, to, asOf) {
    const today = asOf || todayISO();
    const d = dashboard(s, from, to, today);
    const P = (page, focus) => ({ page, focus: focus || null });
    const accRows = () => d.accts.map((a) => Object.assign({ ref: ACCOUNT_TYPES[a.type], date: today, desc: a.name, amount: a.balance }, P('accounts')));
    const R = { rows: [], total: 0, def: '', formula: '', title: '', unavailable: null };
    const exAll = s.extracts.map((x) => ({ x, c: extractCalc(s, x) }));
    const oblRows = (list) => list.map((o) => Object.assign({ ref: o.ref || ({ bill: 'فاتورة', scheduled: 'التزام مجدول', partner: 'شريك', dividend: 'أرباح', vat: 'ضريبة' })[o.src], date: o.due || '—', desc: o.label + (o.party ? ' — ' + o.party : ''), amount: o.amount }, P(o.src === 'bill' ? 'expenses' : o.src === 'partner' || o.src === 'dividend' ? 'partners' : 'liabilities', o.src === 'bill' ? o.id : null)));
    const pnlRows = () => {
      const rows = [];
      journal(s).filter((j) => inRange(j.date, from, to)).forEach((j) => {
        let v = 0;
        j.lines.forEach((l) => { const n = C(l.cr) - C(l.dr); if (['4100', '4190', '4900'].includes(l.acc)) v += n; else if (['5100', '5900'].includes(l.acc)) v += n; });
        if (v !== 0) rows.push(Object.assign({ ref: j.src.no || j.no, date: j.date, desc: j.desc, amount: F(v) }, P(j.kind === 'extract' ? 'extracts' : j.kind === 'adjustment' ? 'accounts' : 'expenses', j.kind === 'extract' || j.kind === 'expense' || j.kind === 'reversal' ? j.src.id : null)));
      });
      return rows;
    };
    switch (key) {
      case 'cash': Object.assign(R, { title: 'النقد المتاح الآن', def: 'المبالغ الموجودة فعلياً في البنك والصندوق والعهد الآن.', formula: 'رصيد كل حساب = الرصيد الافتتاحي + المقبوضات − المدفوعات', total: d.cash, rows: accRows() }); break;
      case 'available': Object.assign(R, { title: 'الرصيد النقدي المتاح', def: 'إجمالي النقد مطروحاً منه المخصصات المحجوزة نقداً (إن كان الإعداد مفعّلاً).', formula: 'إجمالي النقد − المخصصات المغطاة نقداً', total: d.available,
        rows: accRows().concat(s.settings.reservesBackedByCash ? d.resBal.filter((r) => r.balance).map((r) => Object.assign({ ref: 'مخصص', date: today, desc: 'ناقص: ' + r.label, amount: -r.balance }, P('distributions'))) : []) }); break;
      case 'receivable': case 'approvedUncollected': Object.assign(R, { title: 'المستحق لنا من العميل', def: 'مستخلصات معتمدة لم تُحصّل بعد (شاملة الضريبة والاستبقاء المحتجز). ليست نقداً متاحاً.', formula: 'إجمالي المستحق لكل مستخلص معتمد − ما حُصّل منه', total: d.approvedUncollected,
        rows: exAll.filter((o) => o.c.isApproved && o.c.remaining !== 0).map((o) => Object.assign({ ref: o.x.no, date: o.x.approvalDate, desc: 'القابل للتحصيل الآن ' + o.c.dueNow.toFixed(2) + (o.c.retentionHeld ? ' + استبقاء محتجز ' + o.c.retentionHeld.toFixed(2) : ''), amount: o.c.remaining }, P('extracts', o.x.id))) }); break;
      case 'submitted': Object.assign(R, { title: 'مستخلصات مرفوعة قيد الاعتماد', def: 'مرفوعة للعميل ولم تُعتمد. لا تُعد إيراداً ولا نقداً.', formula: 'مجموع إجمالي المستخلصات بحالة «مرفوع للعميل»', total: d.submitted,
        rows: exAll.filter((o) => o.x.status === 'submitted').map((o) => Object.assign({ ref: o.x.no, date: o.x.submitDate, desc: 'مرفوع منذ ' + daysBetween(o.x.submitDate, today) + ' يوماً', amount: o.c.total }, P('extracts', o.x.id))) }); break;
      case 'opProfit': Object.assign(R, { title: 'الربح التقديري للفترة', def: 'الإيرادات المعتمدة − المصروفات التشغيلية للفترة (أساس الاستحقاق). ليس نقداً.', formula: 'إيرادات المستخلصات المعتمدة − الاستقطاعات + إيرادات أخرى − المصروفات التشغيلية', total: d.pnl.opProfit, rows: pnlRows() }); break;
      case 'revenue': Object.assign(R, { title: 'إيرادات الفترة المعتمدة', def: 'صافي المستخلصات المعتمدة خلال الفترة قبل الضريبة (بعد الاستقطاعات).', formula: 'المبلغ المعتمد قبل الضريبة − الاستقطاعات', total: d.pnl.revenue,
        rows: pnlRows().filter((r) => r.page === 'extracts') }); break;
      case 'opex': {
        const rows = [];
        journal(s).filter((j) => inRange(j.date, from, to)).forEach((j) => {

  /* ============================================================

  function nextNo(s, prefix, list) {
    const n = (list || []).length + 1;

    if (s.log.length > 600) s.log.length = 600;
  }
  const fail = (msg, field) => ({ ok: false, error: msg, field: field || null });
  /* قفل الفترات الموزعة: العمليات التي تغيّر ربح فترة اعتُمد توزيع أرباحها مقفلة،
     إلا إذا كانت تسوية أو تصحيحاً يعتمده المدير العام بذكر السبب (تُوسم وتظهر في السجل). */
  function lockedBy(s, date) { return date ? (s.distributions || []).find((d) => date >= d.from && date <= d.to) || null : null; }
  function lockGate(s, date, d, ctx, rec) {
    const L = lockedBy(s, date);
    if (!L) return null;
    const o = d.lockOverride;
    if (!o) return { ok: false, locked: true, field: 'date', lockNo: L.no,
      error: 'التاريخ ' + date + ' يقع ضمن فترة وُزّعت أرباحها (' + L.no + ': من ' + L.from + ' إلى ' + L.to + '). العمليات التي تغيّر ربح هذه الفترة مقفلة. إن كانت تسوية أو تصحيحاً لخطأ حقيقي فيعتمدها المدير العام مع ذكر السبب.' };
    if (!ctx || ctx.role !== 'manager') return fail('اعتماد تسوية على فترة موزعة (' + L.no + ') من صلاحية المدير العام فقط.');
    if (String(o.reason || '').trim().length < 10) return fail('اكتب سبب التسوية على الفترة الموزعة (10 أحرف على الأقل).', 'lockReason');
    if (rec) rec.lateAdj = { reason: String(o.reason).trim(), dist: L.no, by: ctx.role, ts: new Date().toISOString() };
    return { pass: true, L };
  }
  const isLockFail = (g) => g && g.pass !== true;
  // المساهمة العينية لا تُعتمد (ولا ترفع رأس المال) قبل اكتمال بياناتها
  const IN_KIND_MSG = 'المساهمة العينية تحتاج إلى تحديد وصف الأصل، طريقة التقييم، المستند المؤيد، والقيمة قبل الاعتماد النهائي.';
  function inKindMissing(k) {
    const m = [];
    if (!String(k.assetDesc || '').trim()) m.push('وصف الأصل');

    if (!realRef(k.ref) && !k.attachment) m.push('المستند المؤيد');

  }
  // منع التكرار: رقم المرجع (حوالة/شيك/فاتورة) لا يُستخدم مرتين. المراجع العامة مثل «نقدي» مستثناة.
  const GENERIC_REF = ['', 'نقدي', 'نقدا', 'نقداً', 'صورةمرفقة', '-', '—', '0', 'لايوجد'];
  const normRef = (x) => String(x == null ? '' : x).replace(/\s+/g, '').toLowerCase();
  const realRef = (x) => { const n = normRef(x); return n.length >= 1 && !GENERIC_REF.includes(n); };
  function dupRef(list, ref, label, skip) {
    if (!realRef(ref)) return null;
    const hit = (list || []).find((r) => normRef(r.ref) === normRef(ref) && (!skip || !skip(r)));
    return hit ? fail('رقم المرجع «' + String(ref).trim() + '» مسجل مسبقاً في ' + label + ' ' + (hit.no || '') + '. تحقّق من أن العملية لم تُسجَّل من قبل.', 'ref') : null;

      log(s, ctx, 'التزام', 'إضافة التزام مجدول ' + o.no + ' — ' + o.name, o.amount, 'مفتوح');
      return { ok: true, msg: 'أُضيف الالتزام ' + o.no + '.', id: o.id };
    },
    cancelScheduled(s, d, ctx) {
      const o = s.scheduled.find((x) => x.id === d.id);
      if (!o || o.status !== 'open') return fail('الالتزام غير مفتوح.');
      o.status = 'cancelled'; log(s, ctx, 'التزام', 'إلغاء ' + o.no, o.amount, 'ملغى');
      return { ok: true, msg: 'أُلغي الالتزام ' + o.no + '.' };
    },

    /* --- الحسابات النقدية --- */
    saveAccount(s, d, ctx) {
      if (!d.name) return fail('أدخل اسم الحساب.');
      if (!nonneg(d.opening)) return fail('الرصيد الافتتاحي لا يكون سالباً.');
      if (d.id) { const a = s.accounts.find((x) => x.id === d.id); if (!a) return fail('غير موجود'); a.name = d.name; a.active = d.active !== false; log(s, ctx, 'حساب', 'تعديل ' + a.name); return { ok: true, msg: 'حُفظ الحساب.' }; }
      const a = { id: uid('AC'), name: d.name, type: d.type || 'bank', opening: r2(d.opening || 0), active: true };
      s.accounts.push(a); log(s, ctx, 'حساب', 'إنشاء حساب ' + a.name, a.opening);
      return { ok: true, msg: 'أُنشئ الحساب ' + a.name + '.' };
    },
    addTransfer(s, d, ctx) {
      if (!d.from || !d.to) return fail('اختر الحسابين.', 'from');
      if (d.from === d.to) return fail('لا يمكن التحويل إلى الحساب نفسه.');
      if (!pos(d.amount)) return fail('أدخل مبلغ التحويل.', 'amount');
      if (!d.date) return fail('أدخل التاريخ.', 'date');
      { const fe = futureErr(d.date); if (fe) return fe; }
      const err = checkCash(s, d.from, d.amount, d.date); if (err) return fail(err);
      const t = { id: uid('TR'), no: nextNo(s, 'TR', s.transfers), date: d.date, from: d.from, to: d.to, amount: r2(d.amount), note: d.note || '' };
      s.transfers.push(t); log(s, ctx, 'تحويل', 'تحويل داخلي ' + t.no, t.amount);
      return { ok: true, msg: 'سُجّل التحويل ' + t.no + '. إجمالي النقد لم يتغير.' };
    },
    addAdjustment(s, d, ctx) {
      if (!d.accountId) return fail('اختر الحساب.', 'accountId');
      if (!d.reason || d.reason.trim().length < 5) return fail('اكتب مبرر التسوية (5 أحرف على الأقل).', 'reason');
      if (!d.date) return fail('أدخل تاريخ التسوية.', 'date');
      { const fe = futureErr(d.date); if (fe) return fe; }
      const amt = Number(d.amount); if (!isFinite(amt) || amt === 0) return fail('أدخل مبلغ التسوية (موجب للزيادة، سالب للنقص).');
      if (amt < 0) { const err = checkCash(s, d.accountId, -amt, d.date); if (err) return fail(err); }
      // العجز يُثبت مصروف «عجز وفروقات نقدية» والزيادة «إيرادات أخرى»، فيتوازن القيد ويظهر الأثر في الربح
      const a = { id: uid('ADJ'), no: nextNo(s, 'ADJ', s.adjustments), date: d.date, accountId: d.accountId, amount: r2(amt), reason: d.reason };
      const g = lockGate(s, a.date, d, ctx, a); if (isLockFail(g)) return g;
      if (a.lateAdj) log(s, ctx, 'تسوية', 'تسوية على فترة موزعة (' + a.lateAdj.dist + '): ' + d.reason + ' — ' + a.lateAdj.reason, a.amount, 'تسوية على فترة موزعة');
      s.adjustments.push(a); log(s, ctx, 'تسوية', 'تسوية نقدية ' + a.no + ': ' + d.reason, a.amount);
      return { ok: true, msg: 'سُجّلت التسوية ' + a.no + '. ' + (a.amount < 0 ? 'العجز (' + (-a.amount).toFixed(2) + ') أُثبت مصروفاً ضمن «عجز وفروقات نقدية» ويخفض الربح.' : 'الزيادة (' + a.amount.toFixed(2) + ') أُثبتت ضمن «إيرادات أخرى».') };
    },

    /* --- الشركاء --- */
    addContribution(s, d, ctx) {
      const p = s.partners.find((x) => x.id === d.partnerId);
      if (!p) return fail('اختر الشريك.');
      if (!CONTRIB_TYPES[d.type] || d.type === 'expense_paid') return fail(d.type === 'expense_paid' ? 'المصروف المدفوع من الشريك يُسجَّل من شاشة المصروفات (مصدر التمويل: شريك) حتى يرتبط بالمصروف الأصلي ولا يُسجَّل مرتين.' : 'اختر نوع المساهمة.');
      if (!pos(d.amount)) return fail('أدخل مبلغ المساهمة (أكبر من صفر).', 'amount');
      if (!d.date) return fail('أدخل تاريخ العملية.', 'date');
      { const fe = futureErr(d.date); if (fe) return fe; }
      if ((d.currency || 'SAR') !== 'SAR') return fail('النموذج يدعم الريال السعودي فقط حالياً.');
      const cashType = d.type !== 'in_kind';
      if (cashType && !d.accountId) return fail('اختر الحساب الذي استلم المبلغ.', 'accountId');
      if (d.type === 'loan') {
        if (!d.dueDate) return fail('أدخل تاريخ استحقاق القرض.', 'dueDate');
        if (d.dueDate <= d.date) return fail('تاريخ الاستحقاق يجب أن يكون بعد تاريخ القرض.', 'dueDate');
      }
      if (d.type === 'in_kind' && !d.valuation && d.status === 'approved') return fail('اذكر طريقة تقييم المساهمة العينية.', 'valuation');
      { const du = dupRef(s.contributions, d.ref, 'مساهمة الشريك', (r) => r.status === 'cancelled'); if (du) return du; }
      if (cashType) { const nd = needDoc(s, d.amount, d.ref, d.attachment, 'رقم الحوالة أو الإيداع'); if (nd) return nd; }
      if (!d.purpose) return fail('اذكر الغرض من المساهمة.', 'purpose');
      const k = { id: uid('CTR'), no: nextNo(s, 'PC', s.contributions), partnerId: d.partnerId, date: d.date, amount: r2(d.amount), currency: 'SAR', type: d.type,
        purpose: d.purpose, original: d.type === 'capital' && !!d.original, method: cashType ? (d.method || 'تحويل بنكي') : 'عيني', accountId: cashType ? d.accountId : null, ref: d.ref || '', notes: d.notes || '',
        status: d.status === 'approved' ? 'approved' : 'draft', dueDate: d.type === 'loan' ? d.dueDate : (d.type === 'advance' ? d.dueDate || null : null),
        interest: d.type === 'loan' ? (d.interest || 'بدون فوائد') : null, schedule: d.schedule || '', valuation: d.valuation || '', assetDesc: d.type === 'in_kind' ? (d.assetDesc || '') : '', attachment: d.attachment || null };
      if (k.type === 'in_kind' && k.status === 'approved') { const m = inKindMissing(k); if (m.length) return fail(IN_KIND_MSG + ' الناقص: ' + m.join('، ') + '.', 'assetDesc'); }
      s.contributions.push(k);
      log(s, ctx, 'شريك', CONTRIB_TYPES[k.type] + ' ' + k.no + ' — ' + p.name, k.amount, k.status === 'approved' ? 'معتمد' : 'مسودة');
      return { ok: true, msg: 'سُجّلت العملية ' + k.no + ' بحالة «' + (k.status === 'approved' ? 'معتمد' : 'مسودة — بانتظار الاعتماد') + '».' + (k.type === 'capital' ? ' تسجيل المبلغ لا يغيّر نسب الملكية.' : ''), id: k.id };
    },
    approveContribution(s, d, ctx) {
      const k = s.contributions.find((x) => x.id === d.id);
      if (!k || k.status !== 'draft') return fail('العملية ليست بانتظار الاعتماد.');
      if (k.type === 'in_kind') { const m = inKindMissing(k); if (m.length) return fail(IN_KIND_MSG + ' الناقص: ' + m.join('، ') + '.'); }
      k.status = 'approved'; k.approvedDate = d.date || todayISO();
      log(s, ctx, 'اعتماد', 'اعتماد ' + k.no + ' — ' + CONTRIB_TYPES[k.type], k.amount);
      return { ok: true, msg: 'اعتُمدت ' + k.no + '.' + (k.accountId ? ' أُضيف المبلغ إلى رصيد الحساب.' : ' مساهمة غير نقدية: لا أثر على النقدية.') };
    },
    cancelContribution(s, d, ctx) {
      const k = s.contributions.find((x) => x.id === d.id);
      if (!k || k.status !== 'draft') return fail('يمكن إلغاء العمليات غير المعتمدة فقط.');
      k.status = 'cancelled'; log(s, ctx, 'شريك', 'إلغاء ' + k.no, k.amount, 'ملغى');
      return { ok: true, msg: 'أُلغيت ' + k.no + '.' };
    },
    settlePartner(s, d, ctx) {
      const p = s.partners.find((x) => x.id === d.partnerId);
      if (!p) return fail('اختر الشريك.');
      if (!SETTLE_KINDS[d.kind]) return fail('اختر نوع العملية.');
      if (!pos(d.amount)) return fail('أدخل المبلغ (أكبر من صفر).', 'amount');
      if (!d.date) return fail('أدخل تاريخ السداد.', 'date');
      { const fe = futureErr(d.date); if (fe) return fe; }
      let outstanding, sourceId = d.sourceId || null, srcDate = null;
      if (SETTLE_SOURCE[d.kind]) {
        const k = s.contributions.find((x) => x.id === sourceId && x.partnerId === p.id && x.type === SETTLE_SOURCE[d.kind] && x.status === 'approved');
        if (!k) return fail('اختر الالتزام المستحق للشريك من النوع المناسب.');
        outstanding = partnerObligations(s).find((o) => o.id === k.id).remaining; srcDate = k.date;
      } else if (d.kind === 'dividend_pay') {
        const o = partnerObligations(s).find((x) => x.distId === sourceId && x.partnerId === p.id);
        if (!o) return fail('اختر التوزيع المعتمد.');
        outstanding = o.remaining; srcDate = o.date;
      } else {
        outstanding = partnerSummary(s, p.id).bal.capital || 0;
        if (!d.confirmCapital) return fail('إعادة رأس المال تتطلب قراراً أو اتفاقاً موثقاً بين الشركاء. أكّد وجود القرار.');
      }
      if (srcDate && d.date < srcDate) return fail('تاريخ السداد قبل تاريخ نشوء الالتزام.');
      const amt = r2(d.amount);
      let applied = amt, excess = 0;
      if (C(amt) > C(outstanding)) {
        if (!d.allowExcess || d.kind === 'capital_return' || d.kind === 'dividend_pay') return fail('المبلغ (' + amt.toFixed(2) + ') يتجاوز الرصيد المستحق (' + outstanding.toFixed(2) + ').' + (d.kind === 'capital_return' || d.kind === 'dividend_pay' ? '' : ' فعّل خيار تسجيل الزيادة كمبلغ مدين على الشريك إن كانت مقصودة.'));
        applied = outstanding; excess = r2(amt - outstanding);
      }
      if (outstanding <= 0 && !excess) return fail('لا يوجد رصيد مستحق.');
      // خيار «مبلغ مدين على الشريك» (قرار المالك 2026-10-26): غير مفعّل افتراضياً، ويتطلب سبباً مكتوباً، ويُسجَّل في سجل التدقيق
      const excessReason = String(d.excessReason || '').trim();
      if (excess > 0 && excessReason.length < 3) return fail('اذكر سبب تسجيل المبلغ الزائد كمبلغ مدين على الشريك.', 'excessReason');
      { const du = dupRef(s.settlements, d.ref, 'سداد الشريك', (r) => !!r.cancelledDate); if (du) return du; }
      { const nd = needDoc(s, d.amount, d.ref, d.attachment, 'رقم الحوالة أو الشيك'); if (nd) return nd; }
      const err = checkCash(s, d.accountId, amt, d.date); if (err) return fail(err);
      const t = { id: uid('ST'), no: nextNo(s, 'PS', s.settlements), partnerId: p.id, kind: d.kind, sourceId, date: d.date, amount: amt, applied, excess, accountId: d.accountId, method: d.method || 'تحويل بنكي', ref: d.ref || '', notes: d.notes || '', attachment: d.attachment || null, before: outstanding, excessReason: excess > 0 ? excessReason : '' };
      s.settlements.push(t);
      log(s, ctx, 'شريك', SETTLE_KINDS[d.kind] + ' ' + t.no + ' — ' + p.name, amt);
      if (excess > 0) {
        const recBefore = partnerSummary(s, p.id).bal.receivable || 0;
        log(s, ctx, 'مبلغ مدين على شريك', 'تفعيل «مبلغ مدين على الشريك» في ' + t.no + ' — ' + p.name + ' | المبلغ الزائد ' + excess.toFixed(2) + ' | السبب: ' + excessReason
          + ' | رصيد الالتزام قبل ' + r2(outstanding).toFixed(2) + ' بعد 0.00 | المبالغ المدينة على الشريك قبل ' + r2(recBefore - excess).toFixed(2) + ' بعد ' + r2(recBefore).toFixed(2), excess);
      }
      return { ok: true, msg: SETTLE_KINDS[d.kind] + ': ' + t.no + '. الرصيد المتبقي ' + r2(outstanding - applied).toFixed(2) + ' ر.س.', id: t.id };
    },

    savePartner(s, d, ctx) {
      const name = (d.name || '').trim();
      if (!name) return fail('أدخل اسم الشريك.');
      if (!['operating', 'capital'].includes(d.role)) return fail('اختر دور الشريك: تشغيلي أو رأسمالي.');
      if (s.partners.some((p) => p.name.trim() === name && p.id !== d.id)) return fail('يوجد شريك بالاسم نفسه.');
      if (d.role === 'operating' && s.partners.some((p) => p.role === 'operating' && p.id !== d.id)) return fail('يوجد شريك تشغيلي مسجل؛ النظام يدعم شريكاً تشغيلياً واحداً.');
      const split = d.split === '' || d.split == null ? null : Number(d.split);
      if (d.role === 'capital' && !(split >= 0 && split <= 100)) return fail('نسبة الشريك الرأسمالي من حصة الرأسماليين يجب أن تكون بين 0 و100.');
      let p = d.id ? s.partners.find((x) => x.id === d.id) : null;
      if (d.id && !p) return fail('الشريك غير موجود.');
      if (p && p.role !== d.role && (s.contributions.some((k) => k.partnerId === p.id) || s.distributions.length)) return fail('لا يمكن تغيير دور شريك له عمليات مسجلة.');
      if (!p) { p = { id: uid('P'), name, role: d.role, title: d.role === 'operating' ? 'الشريك التشغيلي' : 'شريك رأسمالي' }; s.partners.push(p); }
      else { p.name = name; p.role = d.role; }
      s.settings.capitalSplit = Object.assign({}, s.settings.capitalSplit);
      if (d.role === 'capital') s.settings.capitalSplit[p.id] = split; else delete s.settings.capitalSplit[p.id];
      log(s, ctx, 'شريك', (d.id ? 'تعديل الشريك ' : 'إضافة الشريك ') + name);
      return { ok: true, msg: (d.id ? 'حُفظ الشريك ' : 'أُضيف الشريك ') + name + '.' + (d.role === 'capital' ? ' راجع مجموع نسب الرأسماليين في الإعدادات.' : ''), id: p.id };
    },

    /* --- التوزيعات والمخصصات --- */
    approveDistribution(s, d, ctx) {
      const asOf = d.asOf || todayISO();
      { const fe = futureErr(asOf, 'asOf'); if (fe) return fe; }
      if (d.to && d.to > asOf) return fail('نهاية فترة التوزيع (' + d.to + ') بعد تاريخ الاعتماد؛ لا تُوزّع أرباح فترة لم تنتهِ.', 'to');
      const pv = distributionPreview(s, { from: d.from, to: d.to, amount: d.amount, asOf });
      if (!pv.ok) return fail(pv.errors[0]);
      if (!d.confirm) return fail('أكّد اعتماد التوزيع.');
      const dist = { id: uid('DST'), no: nextNo(s, 'DS', s.distributions), label: d.label || ('تصفية ' + d.from + ' — ' + d.to), from: d.from, to: d.to, approvedDate: asOf,
        payDue: d.payDue || addDays(asOf, 30), amount: pv.amount, snapshot: pv, settingsSnapshot: clone({ operatingPct: s.settings.operatingPct, capitalSplit: s.settings.capitalSplit, reserveRules: s.settings.reserveRules, reservesBackedByCash: s.settings.reservesBackedByCash }) };
      s.distributions.push(dist);
      pv.reserves.forEach((r) => { if (r.amount > 0) s.reserveMoves.push({ id: uid('RM'), no: nextNo(s, 'RM', s.reserveMoves), reserve: r.key, date: asOf, type: 'add', amount: r.amount, note: 'تكوين من ' + dist.no, distributionId: dist.id }); });
      log(s, ctx, 'توزيع', 'اعتماد توزيع ' + dist.no + ' — ' + dist.label, pv.amount, 'معتمد — غير مصروف');
      return { ok: true, msg: 'اعتُمد التوزيع ' + dist.no + ' بمبلغ ' + pv.amount.toFixed(2) + ' ر.س. الأرباح أصبحت مستحقة للشركاء ولم تُصرف بعد.', id: dist.id };
    },
    addReserveMove(s, d, ctx) {
      if (!RESERVES[d.reserve]) return fail('اختر المخصص.');
      if (!pos(d.amount)) return fail('أدخل المبلغ.');
      if (!d.note || d.note.trim().length < 4) return fail('اذكر المبرر.');
      if (d.type === 'use') {
        const b = reserveBalances(s).find((r) => r.key === d.reserve).balance;
        if (C(d.amount) > C(b)) return fail('المبلغ يتجاوز رصيد ' + RESERVES[d.reserve] + ' (' + b.toFixed(2) + '). لا يمكن استخدام مبلغ المخصص مرتين.');
      }
      { const fe = futureErr(d.date); if (fe) return fe; }
      const m = { id: uid('RM'), no: nextNo(s, 'RM', s.reserveMoves), reserve: d.reserve, date: d.date || todayISO(), type: d.type === 'use' ? 'use' : 'add', amount: r2(d.amount), note: d.note };
      s.reserveMoves.push(m);
      log(s, ctx, 'مخصص', (m.type === 'use' ? 'استخدام ' : 'إضافة ') + RESERVES[d.reserve] + ': ' + d.note, m.amount);
      return { ok: true, msg: (m.type === 'use' ? 'سُجّل استخدام المخصص. ' : 'سُجّلت الإضافة. ') + 'حركة المخصص قيد داخلي ولا تغيّر النقدية.' };
    },
    settleVat(s, d, ctx) {
      const v = vatPosition(s);
      if (!pos(d.amount)) return fail('أدخل المبلغ.');
      if (C(d.amount) > C(v.payable)) return fail('المبلغ يتجاوز صافي الضريبة المستحقة (' + v.payable.toFixed(2) + ').');
      if (!d.date) return fail('أدخل تاريخ السداد.', 'date');
      { const fe = futureErr(d.date); if (fe) return fe; }
      const err = checkCash(s, d.accountId, d.amount, d.date); if (err) return fail(err);
      // سداد الضريبة حركة نقدية مستقلة (ليست مصروفاً تشغيلياً)
      const vid = uid('VAT'), aid = uid('ADJ');
      s.vatSettlements.push({ id: vid, date: d.date, amount: r2(d.amount), accountId: d.accountId, ref: d.ref || '', adjId: aid });
      s.adjustments.push({ id: aid, no: nextNo(s, 'ADJ', s.adjustments), date: d.date, accountId: d.accountId, amount: -r2(d.amount), reason: 'سداد ضريبة القيمة المضافة للهيئة', vat: true, vatId: vid });
      log(s, ctx, 'ضريبة', 'سداد ضريبة القيمة المضافة', d.amount);
      return { ok: true, msg: 'سُجّل سداد الضريبة.' };
    },

    /* --- المشاريع والمهام --- */
    saveProject(s, d, ctx) {
      if (!d.name) return fail('أدخل اسم المشروع.');
      if (d.start && d.end && d.start > d.end) return fail('تاريخ البداية بعد تاريخ النهاية.');
      if (!nonneg(d.contractValue) || !nonneg(d.budget)) return fail('القيم المالية لا تكون سالبة.');
      const val = (x) => (x === '' || x == null ? null : r2(x));
      if (d.id) { const p = s.projects.find((x) => x.id === d.id); if (!p) return fail('المشروع غير موجود.'); Object.assign(p, { name: d.name, client: d.client, location: d.location, manager: d.manager, start: d.start, end: d.end, contractValue: val(d.contractValue), budget: val(d.budget), status: d.status, notes: d.notes }); log(s, ctx, 'مشروع', 'تعديل ' + p.code); return { ok: true, msg: 'حُفظ المشروع.', id: p.id }; }
      let code = d.code ? String(d.code).trim() : '';
      if (code && s.projects.some((x) => x.code.toUpperCase() === code.toUpperCase())) return fail('رمز المشروع ' + code + ' مستخدم مسبقاً.');
      if (!code) { let i = s.projects.length + 1; do { code = 'PRJ-' + String(i).padStart(2, '0'); i++; } while (s.projects.some((x) => x.code === code)); }
      const p = { id: uid('PR'), code, name: d.name, client: d.client || 'الشركة السعودية للطاقة', location: d.location || '', manager: d.manager || '', start: d.start || todayISO(), end: d.end || null, contractValue: val(d.contractValue), budget: val(d.budget), status: d.status || 'active', notes: d.notes || '' };

    saveTask(s, d, ctx) {

    /* --- الإعدادات --- */
    // ربط مستند بسجل قائم (تطوير 2026-10-27): بيانات وصفية فقط (الاسم والنوع والحجم والبصمة ومعرّف الملف في التخزين المحلي)،
    // بلا أي أثر على القيود أو الأرصدة. المرفق الأول يصبح المستند الرئيسي، والإضافي يُحفظ في قائمة docs ولا يُستبدل شيء.
    attachDoc(s, d, ctx) {
      const FLD = { expenses: 'receipt', contributions: 'attachment', settlements: 'attachment' };

      const all = [rec[fld]].concat(rec.docs || []).filter(Boolean);
      if (a.sha && all.some((x) => x.sha === a.sha)) return fail('الملف نفسه مرتبط بالسجل ' + (rec.no || '') + ' مسبقاً.', 'dupAttachment');

    saveSettings(s, d, ctx) {

      const capIds = s.partners.filter((p) => p.role === 'capital').map((p) => p.id);

          const H = H0.length ? H0 : [{ from: '0000-01-01', registered: lastReg, note: 'الحالة قبل أول تغيير' }];
          H.push({ from: d.vatEffectiveDate, registered: !!d.vatRegistered, by: (ctx && ctx.role) || '', ts: new Date().toISOString(), reason: String(d.vatChangeReason || '').trim() });
          st.vatHistory = H;
          log(s, ctx, 'إعدادات', (d.vatRegistered ? 'تسجيل في ضريبة القيمة المضافة' : 'إلغاء التسجيل في ضريبة القيمة المضافة') + ' بتاريخ سريان ' + d.vatEffectiveDate + ' — ' + String(d.vatChangeReason || '').trim());
        }
        st.vatRegistered = st.vatHistory.length ? vatRegAt({ settings: st }, todayISO()) : lastReg; }

      if (!nonneg(st.docRequiredAbove)) return fail('حد إلزامية المستند لا يكون سالباً.', 'docRequiredAbove');

    },
    addCategory(s, d, ctx) {

  };

  // فحص موحد لحقول المبالغ في كل العمليات: رقم صالح بلا حروف أو مسافات، وبمنزلتين عشريتين كحد أقصى
  const MONEY_FIELDS = { amount: 'المبلغ', vat: 'ضريبة القيمة المضافة', workValue: 'قيمة الأعمال', discounts: 'الخصومات', retentions: 'الاستبقاء', deductions: 'الاستقطاعات',
    approvedTaxable: 'المبلغ المعتمد', opening: 'الرصيد الافتتاحي', target: 'الهدف', contractValue: 'قيمة العقد', budget: 'الميزانية', cashSafetyAmount: 'حد الأمان النقدي', docRequiredAbove: 'حد المستند' };
  function moneyErr(d) {
    for (const k of Object.keys(MONEY_FIELDS)) {
      const v = d[k];
      if (v === undefined || v === null || v === '') continue;
      if (typeof v === 'string' && !/^-?\d+(\.\d+)?$/.test(v.trim())) return fail('«' + MONEY_FIELDS[k] + '» يجب أن يكون رقماً فقط (بدون حروف أو مسافات أو رموز).', k);
      if (typeof v === 'string' && v !== v.trim()) return fail('«' + MONEY_FIELDS[k] + '» يحتوي على مسافات. أدخل الرقم فقط.', k);
      const n = Number(v);
      if (!isFinite(n)) return fail('«' + MONEY_FIELDS[k] + '» يجب أن يكون رقماً صالحاً.', k);
      if (Math.abs(n * 100 - Math.round(n * 100)) > 1e-6) return fail('«' + MONEY_FIELDS[k] + '» يقبل منزلتين عشريتين كحد أقصى (' + v + ').', k);
    }
    return null;
  }
  /* ============================================================
     فحص سلامة المنصة — 12 فحصاً؛ لكل فحص: سليم / تحذير / خطأ، مع السجلات المتأثرة وروابطها
     ============================================================ */
  function healthCheck(s) {
    const R = [];
    const add = (n, title, items, warnItems, okText) => {
      const st = items.length ? 'err' : (warnItems && warnItems.length ? 'warn' : 'ok');
      R.push({ n, title, status: st, items: items.concat(warnItems || []), count: items.length + ((warnItems || []).length), okText: okText || '' });
    };
    const it = (ref, desc, page, focus) => ({ ref, desc, page, focus: focus || null });
    const J = journal(s); const tb = trialBalance(s); const lc = ledgerCheck(s);
    // 1 التوازن
    add(1, 'هل جميع العمليات متوازنة داخلياً؟', lc.bad.map((j) => it(j.src.no || j.no, 'قيد غير متوازن: مدين ' + j.dr.toFixed(2) + ' / دائن ' + j.cr.toFixed(2), 'reports'))
      .concat(C(lc.tdr) !== C(lc.tcr) ? [it('الإجمالي', 'إجمالي المدين ' + lc.tdr.toFixed(2) + ' ≠ الدائن ' + lc.tcr.toFixed(2), 'reports')] : []), [],
      lc.count + ' قيداً داخلياً متوازناً؛ إجمالي المدين = إجمالي الدائن = ' + lc.tdr.toFixed(2));
    // 2 التحصيل أكبر من المستخلص
    const ex = s.extracts.map((x) => ({ x, c: extractCalc(s, x) }));
    add(2, 'هل يوجد تحصيل أكبر من المستخلص؟', ex.filter((o) => C(o.c.collected) > C(o.c.totalDue)).map((o) => it(o.x.no, 'المحصّل ' + o.c.collected.toFixed(2) + ' > إجمالي المستحق ' + o.c.totalDue.toFixed(2), 'extracts', o.x.id)),
      ex.filter((o) => (s.collections || []).some((k) => k.extractId === o.x.id && k.excess > 0)).map((o) => it(o.x.no, 'دفعة زائدة مسجلة سابقاً كدفعة مقدمة من العميل (قبل منع الزيادة)', 'extracts', o.x.id)), ex.filter((o) => o.c.isApproved).length + ' مستخلصاً معتمداً؛ لا تجاوز');
    // 3 السداد أكبر من المستحق
    const exps = s.expenses.map((e) => ({ e, c: expenseCalc(s, e) }));
    const po = partnerObligations(s);
    add(3, 'هل يوجد سداد أكبر من المستحق؟', exps.filter((o) => C(o.c.paid) > C(o.c.total)).map((o) => it(o.e.no, 'المدفوع ' + o.c.paid.toFixed(2) + ' > الفاتورة ' + o.c.total.toFixed(2), 'expenses', o.e.id))
      .concat(po.filter((o) => C(o.remaining) < 0).map((o) => it(o.label, 'المسدد للشريك يتجاوز الالتزام بـ ' + (-o.remaining).toFixed(2), 'partners'))),
      (s.settlements || []).filter((t) => t.excess > 0).map((t) => it(t.no, 'زيادة ' + t.excess.toFixed(2) + ' سُجّلت صراحةً مبلغاً مديناً على الشريك', 'partners')), 'لا يوجد سداد يتجاوز المستحق');
    // 4 المصروف المحسوب مرتين
    const dupInv = []; const seen = {};
    s.expenses.filter((e) => !['cancelled', 'rejected'].includes(e.status) && realRef(e.docRef)).forEach((e) => { const k = normRef(e.vendor) + '|' + normRef(e.docRef); if (seen[k]) dupInv.push(it(e.no, 'نفس فاتورة ' + seen[k] + ' (المورد ' + e.vendor + '، رقم ' + e.docRef + ')', 'expenses', e.id)); else seen[k] = e.no; });
    const postCount = {}; J.filter((j) => j.kind === 'expense').forEach((j) => { postCount[j.src.id] = (postCount[j.src.id] || 0) + 1; });
    add(4, 'هل يوجد مصروف محسوب مرتين؟', exps.filter((o) => o.e.funding === 'partner' && o.c.payments.length).map((o) => it(o.e.no, 'مصروف دفعه شريك وسُدّد أيضاً كفاتورة مورد', 'expenses', o.e.id))
      .concat(Object.keys(postCount).filter((k) => postCount[k] > 1).map((k) => it(k, 'المصروف مسجل أكثر من مرة في القيود', 'expenses', k))), dupInv, 'كل مصروف مسجل مرة واحدة');
    // 5 قرض محسوب كإيراد
    const revBad = J.filter((j) => j.lines.some((l) => ['4100', '4190'].includes(l.acc)) && j.kind !== 'extract');
    const loanBad = (s.contributions || []).filter((k) => k.status === 'approved' && ['loan', 'advance'].includes(k.type)).filter((k) => { const j = J.find((x) => x.src.id === k.id); return !j || !j.lines.some((l) => l.acc === P_ACC[k.type] && C(l.cr) > 0) || j.lines.some((l) => l.acc[0] === '4'); });
    add(5, 'هل يوجد قرض محسوب كإيراد؟', revBad.map((j) => it(j.src.no || j.no, 'عملية غير المستخلص أثّرت في الإيرادات', 'reports')).concat(loanBad.map((k) => it(k.no, 'قرض/سلفة لم يُسجَّل التزاماً على المؤسسة', 'partners'))), [],
      (s.contributions || []).filter((k) => k.status === 'approved' && k.type === 'loan').length + ' قرضاً مسجلاً كالتزام؛ الإيرادات من المستخلصات فقط');
    // 6 سداد قرض محسوب كمصروف
    const expBad = J.filter((j) => j.lines.some((l) => ['5100', '5900'].includes(l.acc)) && !['expense', 'reversal', 'adjustment'].includes(j.kind));
    add(6, 'هل يوجد سداد قرض محسوب كمصروف؟', expBad.map((j) => it(j.src.no || j.no, 'عملية ' + j.desc + ' أثّرت في المصروفات', 'partners')), [],
      (s.settlements || []).filter((t) => t.kind === 'loan_repay').length + ' عملية سداد قرض؛ لا يوجد منها في المصروفات');
    // 7 توزيع أكبر من المسموح + التسويات على الفترات الموزعة
    const late = [].concat(s.expenses.filter((e) => e.lateAdj).map((e) => it(e.no, 'تسوية على فترة موزعة (' + e.lateAdj.dist + '): ' + e.lateAdj.reason, 'expenses', e.id)),
      s.extracts.filter((x) => x.lateAdj).map((x) => it(x.no, 'تسوية على فترة موزعة (' + x.lateAdj.dist + '): ' + x.lateAdj.reason, 'extracts', x.id)),
      (s.adjustments || []).filter((a) => a.lateAdj).map((a) => it(a.no, 'تسوية على فترة موزعة (' + a.lateAdj.dist + '): ' + a.lateAdj.reason, 'accounts')));
    add(7, 'هل يوجد توزيع أرباح أكبر من المسموح؟', (s.distributions || []).filter((d) => C(d.amount) > C(d.snapshot.maxDist) || C(sum(d.snapshot.shares, (x) => x.amount)) !== C(d.amount)).map((d) => it(d.no, 'المبلغ ' + d.amount.toFixed(2) + ' والحد المؤهل وقت الاعتماد ' + d.snapshot.maxDist.toFixed(2), 'distributions')),
      late, (s.distributions || []).length + ' توزيعاً ضمن الحد المؤهل وقت اعتماده');
    // 8 توزيع بدون نقد كافٍ
    const divUnpaid = sum(po.filter((o) => o.type === 'dividend'), (o) => o.remaining); const cashNow = totalCash(s);
    add(8, 'هل يوجد توزيع بدون نقد كافٍ؟', (s.distributions || []).filter((d) => C(d.amount) > C(d.snapshot.liquidityCap)).map((d) => it(d.no, 'المبلغ يتجاوز السيولة المتاحة وقت الاعتماد (' + d.snapshot.liquidityCap.toFixed(2) + ')', 'distributions')),
      C(divUnpaid) > C(cashNow) ? [it('الأرباح غير المصروفة', 'الأرباح المعتمدة غير المصروفة ' + divUnpaid.toFixed(2) + ' أكبر من النقد الحالي ' + cashNow.toFixed(2), 'distributions')] : [], 'كل توزيع كان مغطى بالسيولة وقت اعتماده');
    // 9 فروق أرصدة الشركاء (القيود مقابل كشوف الحساب)
    const pd = [];
    s.partners.forEach((p) => {
      const b = partnerSummary(s, p.id).bal;
      const pairs = [['loan', '2310', -1], ['advance', '2320', -1], ['expense', '2330', -1], ['dividend', '2340', -1], ['receivable', '1390', 1]];
      pairs.forEach(([cat, acc, sg]) => { const gl = r2(sg * accBal(tb, acc, p.id)); if (C(gl) !== C(b[cat] || 0)) pd.push(it(p.name, PARTNER_CATS[cat] + ': الكشف ' + (b[cat] || 0).toFixed(2) + ' / القيود ' + gl.toFixed(2), 'partners')); });
      const capGl = r2(-accBal(tb, '3100', p.id)); if (C(capGl) !== C(b.capital || 0)) pd.push(it(p.name, 'رأس المال: الكشف ' + (b.capital || 0).toFixed(2) + ' / القيود ' + capGl.toFixed(2), 'partners'));
    });
    add(9, 'هل توجد فروق في أرصدة الشركاء؟', pd, [], s.partners.length + ' شركاء؛ كشوف الحساب مطابقة للقيود في كل الفئات');
    // 10 فروق البنك والصندوق
    const ab = accountBalances(s);
    add(10, 'هل توجد فروق في أرصدة البنك والصندوق؟', lc.cashDiff.map((c) => it(c.name, 'الحركات ' + c.book.toFixed(2) + ' / القيود ' + c.gl.toFixed(2), 'accounts'))

  // كل ورقة عمليات تبدأ بعمود «معرّف العملية»: يمنع استيراد السطر نفسه مرتين ويكشف تعديله بعد استيراده

  const REF = () => ['opRef', 'معرّف العملية', 'ref', { hint: 'معرّف فريد مُعبأ مسبقاً؛ لا تغيّره ولا تنسخه إلى سطر آخر. السطر الذي لا يحمل غير المعرّف يُعدّ فارغاً.' }];

  // الفني: الوقود والمصروفات الميدانية فقط (البلاغات الميدانية مستبعدة بقرار المالك 2026-10-27)؛ كل سطر يدخل «بانتظار الاعتماد» ولا يُرحَّل إلى الحسابات حتى يعتمده المخوّل (نفس سلوك بوابة الفني)
  const TECH_CATS = ['مستلزمات التشغيل', 'الأدوات والمعدات', 'صيانة المركبات', 'مصروفات أخرى'];
  const TECH_CAT_E = E(Object.fromEntries(TECH_CATS.map((c) => [c, c])));
  const PRIO = E({ 'عادية': 'normal', 'عالية': 'high' });
  const TASK_T = E({ 'صيانة': 'maintenance', 'عطل / طوارئ': 'fault', 'عطل': 'fault', 'تركيب': 'install', 'فحص': 'inspection' });

  const KINDS = {

  /* ---------- هوية القالب: ورقة مخفية _GRIDX ---------- */
  const META = '_GRIDX';
  const metaChk = (m) => X.sha256('GRIDX|' + m.kind + '|' + m.tid + '|' + (m.techId || '') + '|' + (m.partnerId || '')).slice(0, 12);
  function metaRows(m) { const o = Object.assign({}, m); o.chk = metaChk(o); return Object.keys(o).map((k) => [k, o[k] == null ? '' : String(o[k])]); }
  function readMeta(wb) {
    const n = Object.keys(wb || {}).find((x) => normH(x) === META);
    if (!n) return { kind: 'accountant', legacy: true };
    const m = {}; (wb[n] || []).forEach((r) => { if (r && r[0] != null && String(r[0]).trim()) m[String(r[0]).trim()] = r[1] == null ? '' : String(r[1]).trim(); });
    if (!m.kind || !m.tid || m.chk !== metaChk(m)) return { kind: m.kind || '', bad: true, raw: m };
    return m;
  }
  const normH = (h) => String(h == null ? '' : h).replace(/\*/g, '').replace(/\s+/g, ' ').trim();

  /* ---------- تحويل القيم ---------- */
  const AR_DIG = '٠١٢٣٤٥٦٧٨٩', FA_DIG = '۰۱۲۳۴۵۶۷۸۹';
  function latin(s) { return String(s).replace(/[٠-٩]/g, (c) => AR_DIG.indexOf(c)).replace(/[۰-۹]/g, (c) => FA_DIG.indexOf(c)).replace(/٫/g, '.').replace(/٬/g, ','); }
  const isEmpty = (v) => v == null || (typeof v === 'string' && v.trim() === '');
  function toNum(v) {
    if (typeof v === 'number') return isFinite(v) ? v : NaN;
    const s = latin(v).replace(/ر\.?س|SAR|ريال|%/gi, '').replace(/[,\s]/g, '').replace(/[−–]/g, '-');
    if (!/^-?\d*\.?\d+$/.test(s)) return NaN;
    return Number(s);
  }
  const pad = (n) => String(n).padStart(2, '0');
  function validYMD(y, m, d) { const dt = new Date(Date.UTC(y, m - 1, d)); return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d && y >= 1990 && y <= 2100; }
  function toDate(v) {
    if (v instanceof Date && !isNaN(v)) return v.getFullYear() + '-' + pad(v.getMonth() + 1) + '-' + pad(v.getDate());
    if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
    const s = latin(v).trim();
    let m = /^(\d{4})[-/.\\](\d{1,2})[-/.\\](\d{1,2})$/.exec(s); // يقبل الشرطة المائلة العكسية \ الشائعة في لوحة المفاتيح العربية
    if (m && validYMD(+m[1], +m[2], +m[3])) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
    m = /^(\d{1,2})[-/.\\](\d{1,2})[-/.\\](\d{4})$/.exec(s);
    if (m && validYMD(+m[3], +m[2], +m[1])) return m[3] + '-' + pad(m[2]) + '-' + pad(m[1]);

  function toBool(v) { const s = latin(v).trim().toLowerCase(); if (['نعم', 'yes', 'true', '1', 'y'].includes(s)) return true; if (['لا', 'no', 'false', '0', 'n'].includes(s)) return false; return null; }
  function toEnum(v, map) { const s = String(v).trim(); if (map[s] !== undefined) return map[s]; const vals = Object.values(map); return vals.includes(s) ? s : undefined; }

  /* ---------- قراءة الأوراق ---------- */
  // wb: { 'اسم الورقة': [[الصف الأول = العناوين], [صف], ...] }
  function parse(wb, defs) {
    defs = defs || SHEETS;
    const out = { sheets: {}, unknownSheets: [] };
    const names = Object.keys(wb || {});
    names.forEach((n) => { if (!defs.some((d) => d.name === normH(n)) && !['تعليمات', 'القوائم', META].includes(normH(n))) out.unknownSheets.push(n); });
    defs.forEach((def) => {
      const sheetName = names.find((n) => normH(n) === def.name);

      if (!sheetName) return;
      const aoa = wb[sheetName] || [];
      let hi = aoa.findIndex((r) => (r || []).some((c) => !isEmpty(c)));

  /* ---------- البحث عن المراجع ---------- */
  const findAcc = (s, name) => s.accounts.find((a) => a.name.trim() === String(name || '').trim());

  const custodyAcc = (s) => { const a = s.accounts.filter((x) => x.active !== false); const m = a.find((x) => x.type === 'custody') || a[0]; return m ? m.id : ''; };
  function applyRow(s, key, rec, ctx, ex) {

          pendingPayment: cu ? { accountId: cu } : null, docRef: rec.docRef || '', notes: [rec.notes, 'مستورد من قالب الفني ' + (ex.tid || '')].filter(Boolean).join(' — ') };
        if (fuel) { p.odometer = rec.odometer; p.liters = rec.liters; }

      }
      /* ----- الإدارة: أوامر عمل (تشغيلية، بلا أثر مالي) ----- */
      case 'mtasks': {
        const pr = findProject(s, rec.project); if (!pr) return fail('المشروع غير موجود: ' + rec.project);
        let assignee = null;
        if (rec.assignee) { const tk = s.technicians.find((x) => x.name.trim() === rec.assignee.trim()); if (!tk) return fail('الفني غير موجود: ' + rec.assignee); assignee = tk.id; }
        const d0 = rec.date || G.todayISO();
        if (rec.due && rec.due < d0) return fail('تاريخ الإنجاز المطلوب قبل تاريخ الإنشاء');
        if (s.tasks.some((x) => x.projectId === pr.id && x.title === rec.title && x.date === d0 && x.status !== 'done')) return fail('أمر عمل مطابق مسجل مسبقاً (تكرار)');
        const before = s.tasks.length;
        const r = run(s, 'saveTask', { projectId: pr.id, title: rec.title, type: rec.type || 'maintenance', assignee, due: rec.due || null, priority: rec.priority || 'normal', location: rec.location || '', date: d0 });
        if (r.ok) r.id = (r.state.tasks[before] || {}).id || null;
        return r;
      }
      case 'accounts': {
        if (findAcc(s, rec.name)) return fail('يوجد حساب بالاسم نفسه');

      case 'vehicle': {
        const p = { plate: rec.plate };
        ['model', 'year', 'insuranceExpiry', 'inspectionExpiry', 'registrationExpiry', 'oilInterval'].forEach((k) => { if (rec[k] != null && rec[k] !== '') p[k] = rec[k]; });
        if (rec.odometer != null) { p.baseOdo = rec.odometer; }
        if (rec.lastOilOdo != null) p.lastOilOdo = rec.lastOilOdo; else if (rec.odometer != null) p.lastOilOdo = rec.odometer;
        return run(s, 'saveVehicle', p);
      }
      case 'technicians': {
        if (s.technicians.some((t) => t.name.trim() === rec.name)) return fail('يوجد فني بالاسم نفسه');
        const docs = [1, 2, 3].filter((i) => rec['doc' + i]).map((i) => ({ name: rec['doc' + i], expiry: rec['exp' + i] || null }));
        const p = { name: rec.name, title: rec.title || 'فني كهرباء', docs, status: 'active' };
        if (rec.empNo) p.empNo = rec.empNo;
        return run(s, 'saveTechnician', p);
      }
      case 'projects': {
        if (findProject(s, rec.code)) return fail('رمز المشروع مستخدم مسبقاً: ' + rec.code);
        return run(s, 'saveProject', { code: rec.code, name: rec.name, client: rec.client, location: rec.location || '', manager: rec.manager || '', start: rec.start || '', end: rec.end || '', contractValue: rec.contractValue == null ? '' : rec.contractValue, budget: rec.budget == null ? '' : rec.budget, status: rec.status || 'active' });
      }
      case 'contributions': {
        const p = findPartner(s, rec.partner); if (!p) return fail('الشريك غير موجود: ' + rec.partner);
        const original = rec.type === 'original';
        const type = original ? 'capital' : rec.type;
        let accountId = null;
        if (type !== 'in_kind') { const a = findAcc(s, rec.account); if (!a) return fail(rec.account ? 'الحساب غير موجود: ' + rec.account : 'حدد الحساب المستلِم'); accountId = a.id; }
        if (s.contributions.some((k) => k.partnerId === p.id && k.date === rec.date && k.type === type && G.C(k.amount) === G.C(rec.amount) && (k.ref || '') === (rec.ref || '') && k.status !== 'cancelled')) return fail('مساهمة مطابقة مسجلة مسبقاً (تكرار)');
        const purpose = rec.purpose || ({ capital: original ? 'رأس المال التأسيسي' : 'زيادة رأس المال', loan: 'قرض للمؤسسة', advance: 'سلفة مؤقتة', in_kind: 'مساهمة عينية' })[type];
        return run(s, 'addContribution', { partnerId: p.id, date: rec.date, amount: rec.amount, type, purpose, accountId, ref: rec.ref || '', dueDate: rec.dueDate || '', valuation: rec.valuation || '', assetDesc: rec.assetDesc || '', status: ctx.role === 'manager' ? 'approved' : 'draft', original, method: type === 'in_kind' ? 'عيني' : 'تحويل بنكي' });
      }
      case 'extracts': {
        if (findExtract(s, rec.ref)) return fail('رقم المستخلص مسجل مسبقاً: ' + rec.ref);
        const pr = findProject(s, rec.project); if (!pr) return fail('المشروع غير موجود: ' + rec.project);
        const st = rec.status;
        if (st !== 'draft' && !rec.submitDate) return fail('أدخل تاريخ الرفع للمستخلص المرفوع أو المعتمد');
        if ((st === 'approved' || st === 'partial') && !rec.approvalDate) return fail('أدخل تاريخ الاعتماد');
        if (st === 'partial' && rec.approvedTaxable == null) return fail('أدخل المبلغ المعتمد قبل الضريبة للاعتماد الجزئي');
        let r = run(s, 'saveExtract', { projectId: pr.id, periodFrom: rec.periodFrom || '', periodTo: rec.periodTo || '', workValue: rec.workValue, discounts: rec.discounts || 0, deductions: rec.deductions || 0, retentions: rec.retentions || 0, retentionRelease: rec.retentionRelease || '', vatRate: rec.vatRate == null ? 15 : rec.vatRate, vatReason: rec.vatReason || '', dueDate: rec.dueDate || '', extRef: rec.ref, date: rec.submitDate || rec.periodTo || G.todayISO(), notes: 'مستورد — مرجع ' + rec.ref });
        if (!r.ok) return r;
        const id = r.id; let t = r.state;
        if (st !== 'draft') { r = run(t, 'setExtractStatus', { id, status: 'submitted', date: rec.submitDate }); if (!r.ok) return r; t = r.state; }
        if (st === 'approved' || st === 'partial') { r = run(t, 'setExtractStatus', { id, status: st, date: rec.approvalDate, approvedTaxable: rec.approvedTaxable, dueDate: rec.dueDate || '' }); if (!r.ok) return r; t = r.state; }
        return { ok: true, state: t, id };
      }
      case 'collections': {
        const x = findExtract(s, rec.extract); if (!x) return fail('المستخلص غير موجود: ' + rec.extract);
        const a = findAcc(s, rec.account); if (!a) return fail('الحساب غير موجود: ' + rec.account);
        if (s.collections.some((c) => c.extractId === x.id && c.date === rec.date && G.C(c.amount) === G.C(rec.amount) && (c.ref || '') === (rec.ref || ''))) return fail('تحصيل مطابق مسجل مسبقاً (تكرار)');
        return run(s, 'addCollection', { extractId: x.id, date: rec.date, amount: rec.amount, accountId: a.id, method: rec.method || 'تحويل بنكي', ref: rec.ref || '' });
      }
      case 'expenses': {
        if (!s.settings.categories.includes(rec.category)) return fail('التصنيف غير معروف: ' + rec.category + ' — راجع ورقة القوائم');
        let projectId = null;
        if (rec.project) { const pr = findProject(s, rec.project); if (!pr) return fail('المشروع غير موجود: ' + rec.project); projectId = pr.id; }
        const total = G.r2((rec.amount || 0) + (rec.vat || 0));
        const funding = rec.funding || 'company';
        let partnerId = null;
        if (funding === 'partner') {
          const p = findPartner(s, rec.partner); if (!p) return fail(rec.partner ? 'الشريك غير موجود: ' + rec.partner : 'حدد اسم الشريك الذي دفع المصروف');
          partnerId = p.id;
          if (rec.paid > 0) return fail('المصروف الذي دفعه شريك لا يُسجَّل له مبلغ مدفوع من المؤسسة؛ يُرد للشريك من مركز الشركاء');
        }
        if (G.C(rec.paid || 0) > G.C(total)) return fail('المبلغ المدفوع (' + rec.paid + ') أكبر من إجمالي الفاتورة (' + total + ')');
        if (rec.docRef && s.expenses.some((e) => e.docRef === rec.docRef && (e.vendor || '') === (rec.vendor || '') && G.C(e.amount) === G.C(rec.amount) && e.status !== 'cancelled')) return fail('فاتورة مطابقة مسجلة مسبقاً (تكرار): ' + rec.docRef);
        let payAcc = null;
        if (rec.paid > 0) { payAcc = findAcc(s, rec.payAccount); if (!payAcc) return fail(rec.payAccount ? 'حساب الدفع غير موجود: ' + rec.payAccount : 'حدد الحساب الذي دُفع منه'); }
        let r = run(s, 'saveExpense', { date: rec.date, category: rec.category, desc: rec.desc, vendor: rec.vendor || '', projectId, amount: rec.amount, vat: rec.vat || 0, vatReason: rec.vatReason || '', docRef: rec.docRef || '', dueDate: rec.dueDate || '', capex: !!rec.capex, funding, partnerId });
        if (!r.ok) return r;
        if (rec.paid > 0) { const id = r.id; r = run(r.state, 'payExpense', { expenseId: id, amount: rec.paid, date: rec.payDate || rec.date, accountId: payAcc.id, method: 'تحويل بنكي', ref: rec.payRef || '' }); if (!r.ok) return r; }
        return r;
      }
      case 'scheduled': {
        if (s.scheduled.some((o) => o.status === 'open' && o.name === rec.name && o.dueDate === rec.dueDate && G.C(o.amount) === G.C(rec.amount))) return fail('التزام مطابق مسجل مسبقاً (تكرار)');
        const cat = rec.category && s.settings.categories.includes(rec.category) ? rec.category : 'مصروفات أخرى';
        return run(s, 'saveScheduled', { name: rec.name, kind: rec.kind || 'other', party: rec.party || '', amount: rec.amount, dueDate: rec.dueDate, category: cat });
      }
    }
    return fail('ورقة غير معروفة');
  }
  const label = (key, rec) => ({
    accounts: rec.name, partners: rec.name, vehicle: rec.plate, technicians: rec.name, projects: (rec.code || '') + ' — ' + (rec.name || ''),
    contributions: (rec.partner || '') + ' · ' + (rec.amount == null ? '' : rec.amount), extracts: (rec.ref || '') + ' · ' + (rec.project || ''),
    collections: (rec.extract || '') + ' · ' + (rec.amount == null ? '' : rec.amount), expenses: (rec.desc || '') + ' · ' + (rec.amount == null ? '' : rec.amount),
    scheduled: rec.name, tfuel: 'وقود · ' + (rec.total == null ? '' : rec.total) + (rec.liters ? ' · ' + rec.liters + ' لتر' : ''), texp: (rec.desc || '') + ' · ' + (rec.total == null ? '' : rec.total),
    mtasks: (rec.project || '') + ' — ' + (rec.title || '')
  })[key] || '';
  const eventDate = (key, rec) => key === 'extracts' ? (rec.approvalDate || rec.submitDate || rec.periodTo || '9999') : key === 'expenses' ? ((rec.paid > 0 && rec.payDate) || rec.date || '9999') : key === 'scheduled' ? '9999' : (rec.date || '9999');

  /* ---------- تجربة الاستيراد على نسخة (لا تمس البيانات) ----------
     ctx: { role, batchId, file, ts } — كل سطر عمليات يُصنَّف قبل تنفيذه:
     ok = جاهز؛ dup = سبق استيراده بالمحتوى نفسه (يُتخطى بأمان)؛ conflict = المعرّف نفسه ببيانات مختلفة (يُرفض)؛ err = خطأ تحقق */
  function dryRun(state, wb, ctx) {
    ctx = Object.assign({ role: 'manager', batchId: 'PREVIEW', file: '', ts: new Date().toISOString() }, ctx || {});
    const runCtx = { role: ctx.role };
    const meta = readMeta(wb);
    // ملف البيانات للتبادل (تطوير 2026-10-27): معاينة ودمج بالمقارنة مع المنصة ونسخة التصدير
    if (meta.kind === 'data') { const DX = typeof module !== 'undefined' && module.exports ? require('./dataex.js') : root.GXDataEx; return DX.dryRun(state, wb, ctx); }
    const stop = (msg) => ({ state: G.clone(state), results: [], summary: [], warnings: [], fatal: msg, okCount: 0, errCount: 0, dupCount: 0, conflictCount: 0, onlyErr: 0, kind: meta.kind, meta });
    if (meta.bad) return stop('بيانات تعريف القالب (الورقة المخفية «' + META + '») عُدّلت أو تلفت، فلا يمكن التأكد من نوع القالب أو صاحبه. نزّل قالباً جديداً من المنصة.');
    if (meta.kind === 'partner') return stop('هذا ملف كشف حساب شريك للقراءة فقط؛ لا يُستورد منه أي تعديل مالي.');
    const K = KINDS[meta.kind];
    if (!K || K.exportOnly) return stop('نوع قالب غير معروف: ' + meta.kind);
    const ex = { batchId: ctx.batchId, file: ctx.file, ts: ctx.ts, tid: meta.tid || '' };
    if (meta.kind === 'technician') { ex.tech = state.technicians.find((x) => x.id === meta.techId); if (!ex.tech) return stop('الفني صاحب القالب (' + (meta.techName || meta.techId) + ') غير موجود في المنصة.'); }
    const DEFS = K.defs;
    const parsed = parse(wb, DEFS);
    let s = G.clone(state);
    const results = [];
    const push = (key, row, r, kind) => results.push({ sheet: key, sheetName: BY_KEY[key].name, n: row.n, label: label(key, row.rec), ref: row.rec.opRef || '', kind: kind || (r.ok ? 'ok' : 'err'), ok: !!r.ok && (!kind || kind === 'ok'), error: r.ok && (!kind || kind === 'ok') ? '' : r.error });
    DEFS.filter((d) => d.phase === 'setup').forEach((def) => {
      const P = parsed.sheets[def.key];
      if (P.missing.length) { P.rows.forEach((row) => push(def.key, row, { ok: false, error: 'أعمدة مطلوبة غير موجودة في الورقة: ' + P.missing.join('، ') })); return; }
      if (def.key === 'vehicle' && P.rows.length > 1) P.rows.slice(1).forEach((row) => { row.errors.push('النظام يدعم مركبة واحدة حالياً؛ يُستورد السطر الأول فقط'); });
      P.rows.forEach((row) => {
        if (row.errors.length) return push(def.key, row, { ok: false, error: row.errors.join('؛ ') });
        const r = applyRow(s, def.key, row.rec, runCtx, ex); if (r.ok) s = r.state; push(def.key, row, r);
      });
    });
    const events = [];
    const noRefSheets = [];
    DEFS.filter((d) => d.phase === 'event').forEach((def) => {
      const P = parsed.sheets[def.key];
      if (P.rows.length && !P.hasRef && !P.missing.length) noRefSheets.push(def.name);
      P.rows.forEach((row) => {
        if (P.missing.length) return push(def.key, row, { ok: false, error: 'أعمدة مطلوبة غير موجودة في الورقة: ' + P.missing.join('، ') });
        if (row.errors.length) return push(def.key, row, { ok: false, error: row.errors.join('؛ ') });
        if (P.hasRef && !row.rec.opRef) return push(def.key, row, { ok: false, error: '«معرّف العملية» فارغ: أدخل السطر في صف من القالب يحمل معرّفاً، ولا تحذف المعرّف.' });
        events.push({ def, row, hasRef: P.hasRef, date: eventDate(def.key, row.rec) });
      });
    });
    // المعرّف المتكرر داخل الملف: أول ظهور (بترتيب الأوراق والصفوف) هو المعتمد
    const inFile = {};
    const refBlocked = new Set();
    DEFS.forEach((d) => events.filter((ev) => ev.def === d && ev.hasRef).sort((a, b) => a.row.n - b.row.n).forEach((ev) => {
      const ref = ev.row.rec.opRef; const h = X.rowHash(ev.def.key, ev.row.rec); ev.hash = h;
      const f = inFile[ref];
      if (f) { refBlocked.add(ev); ev.kind = f.h === h ? 'dup' : 'conflict'; ev.msg = f.h === h ? 'سطر مكرر داخل الملف: المعرّف ' + ref + ' ورد بالبيانات نفسها في «' + f.sheetName + '» صف ' + f.n + '. يُستورد مرة واحدة.' : 'تعارض داخل الملف: المعرّف ' + ref + ' مستخدم في «' + f.sheetName + '» صف ' + f.n + ' ببيانات مختلفة. صحّح الملف (لا تنسخ المعرّفات بين الصفوف).'; return; }
      inFile[ref] = { h, n: ev.row.n, sheetName: ev.def.name };
    }));
    events.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.def.pri - b.def.pri || a.row.n - b.row.n));
    events.forEach((ev) => {
      if (refBlocked.has(ev)) return push(ev.def.key, ev.row, { ok: false, error: ev.msg }, ev.kind);
      if (ev.hasRef) {
        const ref = ev.row.rec.opRef; const p = (s.importRefs || {})[ref];
        if (p) {
          const same = p.h === ev.hash && p.sheet === ev.def.key;
          return push(ev.def.key, ev.row, { ok: false, error: same
            ? 'سبق استيراده في ' + (p.file ? '«' + p.file + '» ' : '') + 'بتاريخ ' + String(p.ts || '').slice(0, 10) + ' (الدفعة ' + p.batch + '). يُتخطى دون تكرار.'
            : 'تعارض: المعرّف ' + ref + ' استُورد سابقاً (' + String(p.ts || '').slice(0, 10) + ') ببيانات مختلفة. لا يُعدَّل السجل المستورد بإعادة الاستيراد؛ صحّحه من صفحته في المنصة (إلغاء بقيد عكسي ثم تسجيل صحيح).' }, same ? 'dup' : 'conflict');
        }
      }
      const r = applyRow(s, ev.def.key, ev.row.rec, runCtx, ex);
      if (r.ok) {
        s = r.state;
        if (ev.hasRef) s.importRefs = Object.assign({}, s.importRefs || {}, { [ev.row.rec.opRef]: { h: ev.hash, sheet: ev.def.key, n: ev.row.n, batch: ctx.batchId, file: ctx.file, ts: ctx.ts, id: r.id || null } });
      }
      push(ev.def.key, ev.row, r);
    });
    // ترتيب النتائج حسب الورقة ثم رقم الصف
    const order = {}; DEFS.forEach((d, i) => { order[d.key] = i; });
    results.sort((a, b) => order[a.sheet] - order[b.sheet] || a.n - b.n);
    const cnt = (key, k) => results.filter((r) => r.sheet === key && r.kind === k).length;
    const summary = DEFS.map((d) => ({ key: d.key, name: d.name, present: parsed.sheets[d.key].present, ok: cnt(d.key, 'ok'), err: cnt(d.key, 'err') + cnt(d.key, 'conflict'), dup: cnt(d.key, 'dup'), conflict: cnt(d.key, 'conflict'), unknown: parsed.sheets[d.key].unknown, missing: parsed.sheets[d.key].missing }));
    const warnings = [];
    if (parsed.unknownSheets.length) warnings.push('أوراق غير معروفة تم تجاهلها: ' + parsed.unknownSheets.join('، '));
    summary.forEach((x) => { if (x.unknown.length) warnings.push('أعمدة غير معروفة في «' + x.name + '» تم تجاهلها: ' + x.unknown.join('، ')); });
    if (noRefSheets.length) warnings.push('أوراق من قالب قديم بلا عمود «معرّف العملية» (' + noRefSheets.join('، ') + '): منع التكرار فيها يعتمد على مطابقة الحقول فقط. نزّل القالب الجديد للاستيراد القادم.');
    const caps = s.partners.filter((p) => p.role === 'capital');
    if (caps.length) { const tot = caps.reduce((a, p) => a + Number(s.settings.capitalSplit[p.id] || 0), 0); if (Math.abs(tot - 100) > 0.001) warnings.push('مجموع نسب الشركاء الرأسماليين ' + tot + '% وليس 100%؛ لن يُعتمد أي توزيع أرباح حتى يُصحح من الإعدادات.'); }
    if (!results.length) warnings.push('لم يُعثر على أي سطر بيانات في الملف. تأكد من استخدام قالب GRIDX وأن البيانات تبدأ تحت صف العناوين.');
    const k = (x) => results.filter((r) => r.kind === x).length;
    const dupCount = k('dup'), conflictCount = k('conflict');
    if (results.length && dupCount === results.length) warnings.push('كل سطور الملف سبق استيرادها؛ لا يوجد جديد.');
    if (meta.kind === 'technician') warnings.unshift('قالب الفني «' + ex.tech.name + '» (الرمز ' + meta.tid + '): كل السطور تدخل «بانتظار الاعتماد» ولا تؤثر في الحسابات أو العهدة حتى يعتمدها المخوّل.');
    if (meta.kind === 'management') warnings.unshift('قالب الإدارة (الرمز ' + meta.tid + '): مشاريع وأوامر عمل فقط، بلا أي أثر مالي.');
    return { state: s, results, summary, warnings, okCount: k('ok'), errCount: k('err') + conflictCount, dupCount, conflictCount, onlyErr: k('err'), kind: meta.kind, meta, kindLabel: K.label, techName: ex.tech ? ex.tech.name : '' };
  }

  /* ---------- قالب Excel ---------- */
  // kind: accountant | technician | management. opts: { techId } للفني. الناتج يُبنى في الواجهة ملفاً حقيقياً (SheetJS)
  function templateSpec(state, tid, kind, opts) {
    const s = state;
    tid = tid || X.templateId();
    kind = kind || 'accountant'; opts = opts || {};
    const K = KINDS[kind];
    if (!K || K.exportOnly) throw new Error('نوع قالب غير صالح للاستيراد: ' + kind);
    const tech = kind === 'technician' ? s.technicians.find((x) => x.id === opts.techId) : null;
    if (kind === 'technician' && !tech) throw new Error('اختر الفني صاحب القالب.');
    const DEFS = K.defs;
    const allRefs = X.refsFor(tid, REF_ROWS * DEFS.filter((d) => d.phase === 'event').length);
    let refAt = 0;
    const accIns = () => [
      ['قالب استيراد بيانات GRIDX'],
      [''],
      ['طريقة الاستخدام'],
      ['1', 'عبّئ الأوراق التي تحتاجها فقط، واترك الباقي فارغاً. لا تغيّر أسماء الأوراق ولا صف العناوين.'],
      ['2', 'الأعمدة المعلّمة بنجمة * مطلوبة. التواريخ بصيغة 2026-10-25 أو 25/10/2026. المبالغ بالريال السعودي بدون رموز.'],
      ['3', 'القيم المسموحة للأعمدة ذات الخيارات موجودة في ورقة «القوائم». اكتبها كما هي حرفياً.'],
      ['4', 'الربط بين الأوراق بالأسماء والرموز: اسم الحساب، اسم الشريك، رمز المشروع، رقم المستخلص. اكتبها متطابقة في كل الأوراق.'],
      ['5', 'ارفع الملف من صفحة «استيراد البيانات». سيعرض النظام معاينة لكل سطر قبل الحفظ، ويحدد الأخطاء والتكرارات.'],
      ['6', 'أوراق العمليات تبدأ بعمود «معرّف العملية» معبأ مسبقاً (رمز هذا القالب: ' + tid + '). اكتب كل عملية في صف يحمل معرّفاً، ولا تغيّر المعرّف ولا تنسخه إلى صف آخر. إعادة رفع الملف نفسه لا تكرر أي عملية، وتعديل سطر بعد استيراده يظهر «تعارضاً» ولا يُطبَّق.'],
      [''],
      ['ترتيب التنفيذ'],

  if (!file) return cb(null);
  if (!/^image\//.test(file.type)) { cb({ name: file.name, type: file.type, data: null }); return; }

  rd.onload = () => {

    img.onload = () => {
      const k = Math.min(1, 720 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);

function ReviewExpense({ onClose, e }) {
  const { state: s, act, can } = useApp();
  const c = G.expenseCalc(s, e);
  const [reason, setReason] = useState('');
  const [rej, setRej] = useState(false);
  const [vRs, setVRs] = useState(e.vatReason || '');
  const sim = G.similarExpense(s, e, e.id); const [dc, setDc] = useState(false); const [dr, setDr] = useState('');
  const rvR = s.settings.vatRate == null || s.settings.vatRate === '' ? 15 : Number(s.settings.vatRate);
  const rvExp = G.r2(e.amount * rvR / 100), rvLow = e.vat > 0 && e.vat < rvExp - Math.max(0.10, G.r2(rvExp * 0.002)), rvHigh = e.vat > rvExp + Math.max(0.10, G.r2(rvExp * 0.002));
  return html`<${Modal} title=${'مراجعة طلب ' + e.no} sub=${'مرسل من ' + techName(s, e.submittedBy)} onClose=${onClose} footer=${can('approveExpense') ? html`<button className="btn primary" onClick=${() => { if (act('approveExpense', { id: e.id, vatReason: vRs, dupConfirm: dc, dupReason: dr }).ok) onClose(); }}>اعتماد وخصم من العهدة</button>${rej ? html`<button className="btn danger" onClick=${() => { if (act('rejectExpense', { id: e.id, reason }).ok) onClose(); }}>تأكيد رفض ${e.no}</button><button className="btn" onClick=${() => setRej(false)}>تراجع عن الرفض</button>` : html`<button className="btn danger" onClick=${() => setRej(true)}>رفض الطلب</button>`}<button className="btn" onClick=${onClose}>إغلاق</button>` : html`<button className="btn" onClick=${onClose}>إغلاق</button>`}>
    <div className="grid g2">
      <div className="calc-box">
        <div className="kv"><span>التاريخ</span><span>${fdate(e.date)}</span></div>
        <div className="kv"><span>التصنيف</span><span>${e.category}</span></div>
        <div className="kv"><span>المشروع</span><span>${prName(s, e.projectId)}</span></div>
        ${e.odometer ? html`<div className="kv"><span>قراءة العداد</span><span className="num">${nf0.format(e.odometer)} كم</span></div>` : null}
        ${e.liters ? html`<div className="kv"><span>الكمية</span><span className="num">${e.liters} لتر</span></div>` : null}
        <div className="kv"><span>قبل الضريبة</span><${M} v=${e.amount} /></div>
        <div className="kv"><span>الضريبة</span><${M} v=${e.vat} /></div>
        <div className="kv tot"><span>الإجمالي</span><${M} v=${c.total} /></div>
        <div className="kv"><span>يُخصم من</span><span>${e.pendingPayment ? accName(s, e.pendingPayment.accountId) : '—'}</span></div>
      </div>
      <div>${e.receipt ? html`<${AttList} rec=${e} />` : html`<div className="note">لم يُرفق مستند. رقم المرجع: ${e.docRef || 'غير مُدخل'}</div>`}</div>
    </div>
    ${e.notes ? html`<div className="note">${e.notes}</div>` : null}
    ${rej ? html`<${Callout} kind="err">سيُرفض الطلب ${e.no} (${money(c.total)} ر.س) ولن يُخصم من العهدة. اكتب السبب ليظهر للفني، ثم اضغط «تأكيد رفض ${e.no}».<//>` : null}
    ${sim ? html`<${Callout} kind="warn">يوجد مصروف مشابه مسجل: ${sim.no} بتاريخ ${fdate(sim.date)} بمبلغ ${money(G.r2(sim.amount + sim.vat))} ر.س. تحقّق أنه ليس الطلب نفسه قبل الاعتماد.<//>
      ${can('approveExpense') ? html`<div><label className="check"><input id="rv-dc" type="checkbox" checked=${dc} onChange=${(ev) => setDc(ev.target.checked)} /><span>أؤكد أنه ليس تكراراً لـ ${sim.no}</span></label></div>${dc ? html`<${Field} label="سبب التأكيد" id="rv-dr" f="dupReason"><input id="rv-dr" value=${dr} onInput=${(ev) => setDr(ev.target.value)} /><//>` : null}` : null}` : null}
    ${rvHigh ? html`<${Callout} kind="err">الضريبة في هذا الطلب أكبر من ${rvR}% من المبلغ قبل الضريبة (المتوقع ${money(rvExp)}). لا يمكن اعتماده؛ ارفضه واطلب إعادة إرساله بالمبلغ الصحيح.<//>` : null}
    ${rvLow && can('approveExpense') ? html`<${Field} label="سبب اختلاف الضريبة (مطلوب للاعتماد)" id="rv-vr" f="vatReason"><input id="rv-vr" value=${vRs} onInput=${(ev) => setVRs(ev.target.value)} /><//>` : null}

/* الالتزامات القائمة بأصلها والمسدد منها — للعرض فقط؛ الأرقام من المحرك (G.obligations / expenseCalc / partnerObligations / vatPosition) */
const OBL_SRC_L = { bill: 'فاتورة مورد', scheduled: 'التزام مجدول', partner: 'مستحق شريك', dividend: 'أرباح معتمدة', vat: 'ضريبة القيمة المضافة' };
const OBL_T = { loan: 'قرض شريك', advance: 'سلفة شريك', expense_paid: 'مصروف دفعه شريك', dividend: 'أرباح معتمدة' };
const isSalary = (t) => /رواتب|أجور/.test(t || '');
function oblRows(s) {
  const po = G.partnerObligations(s); const v = G.vatPosition(s);
  return G.obligations(s).map((o) => {
    let principal = o.amount, paid = 0, type = OBL_SRC_L[o.src], cat = '', skind = '';
    if (o.src === 'bill') { const e = s.expenses.find((x) => x.id === o.id); const c = G.expenseCalc(s, e); principal = c.total; paid = c.paid; cat = e.category; }
    else if (o.src === 'scheduled') { const x = s.scheduled.find((y) => y.id === o.id) || {}; cat = x.category || ''; skind = x.kind || ''; }
    else if (o.src === 'partner' || o.src === 'dividend') { const p = po.find((x) => x.id === o.id); if (p) { principal = p.principal; paid = p.paid; type = OBL_T[p.type] || type; } }

    <svg width=${size} height=${size} viewBox=${'0 0 ' + size + ' ' + size} aria-hidden="true">

      ${arc > 0.001 ? html`<circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" style=${{ stroke: color }} strokeWidth=${stroke} strokeLinecap=${arc >= 0.999 ? 'butt' : 'round'} strokeDasharray=${(c * arc) + ' ' + c} transform=${'rotate(-90 ' + size / 2 + ' ' + size / 2 + ')'} />` : null}

/* مؤشر «مباشر»: البطاقات تُحسب من البيانات لحظياً، ويظهر وقت آخر عملية مسجلة */
function LiveStamp({ s }) {

  return html`<div className="rk-stamp" role="status"><span className="rk-dot" aria-hidden="true"></span><span>مباشر — تتحدث البطاقات فور تسجيل أي عملية${t && !isNaN(t) ? html` · آخر تحديث للبيانات <span className="num">${t.getFullYear() + '-' + p2(t.getMonth() + 1) + '-' + p2(t.getDate()) + ' ' + p2(t.getHours()) + ':' + p2(t.getMinutes())}</span>` : null}</span></div>`;
