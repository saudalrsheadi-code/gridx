const PR_ST = { active: ['teal', 'نشط'], planned: ['blue', 'مخطط'], onhold: ['warn', 'متوقف'], done: ['gray', 'منتهٍ'] };
function Projects({ focus }) {
  return focus === 'tab:faults' ? html`<${FaultsView} />` : html`<${ProjectsMain} />`;
}
function ProjectsMain() {
  const { state: s, openModal, can } = useApp();
  const [tab, setTab] = useState('projects');
  const [detail, setDetail] = useState(null);
  const [pst, setPst] = useState('');
  const [fp, setFp] = useState(''); const [fs, setFs] = useState(''); const [ft, setFt] = useState(''); const [fa, setFa] = useState('');
  const t = today();
  const stats = s.projects.map((p) => Object.assign({ p }, G.projectStats(s, p)));
  const statsF = stats.filter((x) => !pst || x.p.status === pst);
  const tasks = s.tasks.filter((k) => (!fp || k.projectId === fp) && (!fs || (fs === 'late' ? k.status !== 'done' && k.due && k.due < t : fs === 'notdone' ? k.status !== 'done' : k.status === fs)) && (!ft || k.type === ft) && (!fa || k.assignee === fa));
  const open = s.tasks.filter((k) => k.status !== 'done');
  const late = open.filter((k) => k.due && k.due < t);
  const faults = open.filter((k) => k.type === 'fault');
  const clearT = () => { setFp(''); setFs(''); setFt(''); setFa(''); };
  // كل رقم يعرض القائمة المصفّاة المرتبطة به
  const showT = (o) => { setTab('tasks'); clearT(); if (o.fs) setFs(o.fs); if (o.ft) setFt(o.ft); };
  const which = tab === 'projects' ? (pst === 'active' ? 'active' : '') : !fp && !fa && fs === 'notdone' && !ft ? 'open' : fs === 'late' && !ft ? 'late' : ft === 'fault' && fs === 'notdone' ? 'faults' : '';
  return html`<${Fragment}>
    <${PageIntro} text="متابعة المشاريع وأوامر العمل الميدانية: ما المفتوح، وما المتأخر، وأين وصل كل مشروع مالياً.">${can('edit') ? html`
      <button className="btn primary sm" onClick=${() => openModal('project', {})}><${Icon} n="plus" s=${15} />إضافة مشروع</button>
      <button className="btn sm" onClick=${() => openModal('task', {})}><${Icon} n="plus" s=${15} />إضافة مهمة</button>
      <button className="btn sm" onClick=${() => openModal('task', { type: 'fault' })}><${Icon} n="zap" s=${15} />الإبلاغ عن عطل</button>` : null}<//>
    <div className="kpis">
      <${Kpi} label="المشاريع النشطة" raw=${s.projects.filter((p) => p.status === 'active').length} unit=${false} active=${which === 'active'} onGo=${() => { setTab('projects'); setPst('active'); }} />
      <${Kpi} label="المهام المفتوحة" raw=${open.length} unit=${false} active=${which === 'open'} onGo=${() => showT({ fs: 'notdone' })} />
      <${Kpi} label="المهام المتأخرة" raw=${late.length} unit=${false} tone=${late.length ? 'err' : ''} active=${which === 'late'} onGo=${() => showT({ fs: 'late' })} />
      <${Kpi} label="الأعطال والطوارئ المفتوحة" raw=${faults.length} unit=${false} tone=${faults.length ? 'warn' : ''} active=${which === 'faults'} onGo=${() => showT({ fs: 'notdone', ft: 'fault' })} />
    </div>
    <div className="panel">
      <div className="panel-h" style=${{ paddingBlock: 0 }}><${Tabs} value=${tab} onChange=${setTab} tabs=${[['projects', 'المشاريع', s.projects.length], ['tasks', 'أوامر العمل والمهام', s.tasks.length]]} /></div>
      ${tab === 'projects' ? html`
        <${FilterBar} count=${stats.length} active=${!!pst} onClear=${() => setPst('')}><${Sel} value=${pst} onChange=${setPst} placeholder="كل الحالات" options=${Object.entries(PR_ST).map(([k, v]) => [k, v[1]])} /><//>
        <${Table} rows=${statsF} rowKey="code" onRow=${(r) => setDetail(r.p.id)} empty=${html`<${FilteredEmpty} onClear=${() => setPst('')} />`} cols=${[
        { key: 'code', label: 'رقم المشروع', sort: (r) => r.p.code, render: (r) => html`<span className="num strong">${r.p.code}</span>` },
        { key: 'name', label: 'اسم المشروع', sort: (r) => r.p.name, render: (r) => html`<div className="strong">${r.p.name}</div>` },
        { key: 'client', label: 'العميل', sort: (r) => r.p.client, render: (r) => html`<span className="small">${r.p.client}</span>` },
        { key: 'st', label: 'الحالة', sort: (r) => r.p.status, render: (r) => html`<${Badge} c=${PR_ST[r.p.status][0]}>${PR_ST[r.p.status][1]}<//>` },
        { key: 'tasks', label: 'المهام المنجزة', c: true, sort: (r) => r.tasks ? r.done / r.tasks : 0, render: (r) => html`<span><span className="num">${r.done}</span> من <span className="num">${r.tasks}</span></span>${r.late ? html` <${Badge} c="err" plain>${r.late} متأخرة<//>` : null}` },
        { key: 'approvedTotal', label: 'إجمالي المستخلصات المعتمدة', n: true, render: (r) => html`<${M} v=${r.approvedTotal} />` },
        { key: 'collected', label: 'إجمالي التحصيلات', n: true, render: (r) => html`<${M} v=${r.collected} />` },
        { key: 'cost', label: 'إجمالي المصروفات', n: true, render: (r) => html`<${M} v=${r.spend} />` }]} />
        <div className="panel-b"><div className="note">اضغط على المشروع لعرض تفاصيله: البيانات، المهام، المستخلصات، التحصيلات، المصروفات، والربحية التقديرية.</div></div>` : html`
        <${FilterBar} count=${s.tasks.length} active=${!!(fp || fs || ft || fa)} onClear=${clearT}>
          <${Sel} value=${fp} onChange=${setFp} placeholder="كل المشاريع" options=${s.projects.map((p) => [p.id, p.code])} />

          <${Sel} value=${fa} onChange=${setFa} placeholder="كل الفنيين" options=${s.technicians.map((x) => [x.id, x.name])} />
        <//>
        ${tasks.length || !(fp || fs || ft || fa) ? html`<${TaskTable} tasks=${tasks} />` : html`<${FilteredEmpty} onClear=${clearT} />`}`}
    </div>
    ${detail ? html`<${ProjectDetail} id=${detail} onClose=${() => setDetail(null)} />` : null}

/* الأعطال والطوارئ: عرض مصفّى من أوامر العمل من نوع «عطل / طوارئ» (ليست وحدة مستقلة) */
function FaultsView() {

      <${Kpi} label="متأخرة عن موعدها" raw=${groups.late.length} unit=${false} tone=${groups.late.length ? 'err' : ''} active=${view === 'late'} onGo=${() => setView('late')} />
      <${Kpi} label="منجزة" raw=${groups.done.length} unit=${false} tone="ok" active=${view === 'done'} onGo=${() => setView('done')} />
      <${Kpi} label="كل البلاغات" raw=${all.length} unit=${false} active=${view === ''} onGo=${() => setView('')} />
    </div>
    <div className="panel">
      <${FilterBar} count=${all.length} active=${!!(fp || fa)} onClear=${() => { setFp(''); setFa(''); }}>

        <${Sel} value=${fa} onChange=${setFa} placeholder="كل الفنيين" options=${s.technicians.map((x) => [x.id, x.name])} />
      <//>
      <${Table} rows=${rows} initialSort=${{ key: 'date', dir: -1 }} empty=${html`<${Empty} icon="check" title=${view === 'open' ? 'لا أعطال مفتوحة' : view === 'late' ? 'لا أعطال متأخرة' : 'لا توجد بلاغات'} />`} cols=${[
        { key: 'title', label: 'العطل أو الطارئ', render: (r) => html`<div className="strong">${r.title}</div>${r.location ? html`<div className="sub">${r.location}</div>` : null}${r.priority === 'high' ? html` <${Badge} c="err" plain>عاجل<//>` : null}` },

// تفصيل كشف حساب الشريك حسب نوع الحركة — من حركات المحرك نفسها (partnerStatement)
function stmtBreakdown(st) {
  const E = st.entries;
  const S = (f) => G.sum(E.filter(f), (e) => e.amount);
  const cat = (c) => st.cats.find((x) => x.cat === c) || { closing: 0 };
  const isSet = (e) => e.src === 'settlement';
  return [
    ['capital', 'المساهمات الأصلية في رأس المال', S((e) => e.cat === 'capital' && e.original && e.amount > 0)],
    ['capital', 'زيادات رأس المال', S((e) => e.cat === 'capital' && !e.original && e.amount > 0)],
    ['capital', 'إعادة رأس المال', -S((e) => e.cat === 'capital' && e.amount < 0)],
    ['loan', 'القروض المقدمة', S((e) => e.cat === 'loan' && e.amount > 0)],
    ['loan', 'دفعات سداد القروض', -S((e) => e.cat === 'loan' && e.amount < 0)],
    ['advance', 'السلف المقدمة', S((e) => e.cat === 'advance' && e.amount > 0)],
    ['advance', 'المبالغ المستردة من السلف', -S((e) => e.cat === 'advance' && e.amount < 0)],
    ['expense', 'المصروفات التي دفعها الشريك', S((e) => e.cat === 'expense' && e.amount > 0)],
    ['expense', 'المبالغ المسددة له عن المصروفات', -S((e) => e.cat === 'expense' && e.amount < 0 && isSet(e))],
    ['expense', 'عكس مصروفات أُلغيت', -S((e) => e.cat === 'expense' && e.amount < 0 && !isSet(e))],
    ['dividend', 'الأرباح المستحقة (المعتمدة)', S((e) => e.cat === 'dividend' && e.amount > 0)],
    ['dividend', 'الأرباح المدفوعة', -S((e) => e.cat === 'dividend' && e.amount < 0)],
    ['dividend', 'التوزيعات المعتمدة وغير المدفوعة (الرصيد الختامي)', cat('dividend').closing],
    ['receivable', 'مبالغ مدينة على الشريك (زيادات مسجلة عليه — ليست سداداً)', S((e) => e.cat === 'receivable')],
    ['all', 'إجمالي المبالغ المسددة للشريك في الفترة', -S((e) => isSet(e) && e.amount < 0)]
  ];
}
function StatementModal({ pid, onClose }) {
  const { state: s, openDoc } = useApp();
  const [p, setP] = useState(pid);
  const [from, setFrom] = useState(s.settings.fiscalYearStart); const [to, setTo] = useState(today());
  const [cf, setCf] = useState('');
  const st = G.partnerStatement(s, p, from, to);
  const sum = G.partnerSummary(s, p);
  // رصيد الفئة بعد كل حركة
  const run = {}; st.cats.forEach((c) => { run[c.cat] = c.opening; });
  const ent = st.entries.map((e) => { run[e.cat] = G.r2((run[e.cat] || 0) + e.amount); return Object.assign({}, e, { after: run[e.cat] }); }).filter((e) => !cf || e.cat === cf);
  const bd = stmtBreakdown(st);
  // المطابقة: الرصيد الختامي لكل فئة = الافتتاحي + الحركات = رصيد الشريك في المحرك (إذا كانت نهاية الفترة اليوم)
  const recon = st.cats.every((c) => Math.abs(c.opening + G.sum(c.moves, (m) => m.amount) - c.closing) < 0.01) && (to < today() || st.cats.every((c) => Math.abs((sum.bal[c.cat] || 0) - c.closing) < 0.01));
  return html`<${Modal} title="كشف حساب شريك" size="xl" onClose=${onClose} footer=${html`<button className="btn primary" onClick=${() => openDoc(Docs.statement(s, p, from, to))}><${Icon} n="doc" s=${15} />معاينة للطباعة</button><button className="btn" onClick=${onClose}>إغلاق</button>`}>

    <h3 className="sec-t">الأرصدة حسب الفئة</h3>
    <div className="panel"><${Table} rowKey="cat" rows=${st.cats} onRow=${(r) => setCf(cf === r.cat ? '' : r.cat)} cols=${[
      { key: 'label', label: 'الفئة', render: (r) => html`<span className=${cf === r.cat ? 'strong' : ''}>${r.label}</span>` },
      { key: 'opening', label: 'رصيد افتتاحي', n: true, render: (r) => html`<${M} v=${r.opening} />` },
      { key: 'inc', label: 'زيادة', n: true, render: (r) => html`<${M} v=${r.inc} />` },

      { key: 'closing', label: 'رصيد ختامي', n: true, render: (r) => html`<span className="strong"><${M} v=${r.closing} /></span>` }]} /></div>
    <h3 className="sec-t">تفصيل الحركات في الفترة</h3>
    <div className="calc-box stmt-bd">${bd.map(([c, l, v], i) => html`<div key=${i} className=${'kv small' + (c === 'all' ? ' tot' : '')}><span>${l}</span><${M} v=${v} /></div>`)}</div>
    <h3 className="sec-t">الحركات${cf ? ' — ' + G.PARTNER_CATS[cf] : ''}${cf ? html` <button className="btn ghost sm" onClick=${() => setCf('')}>كل الفئات</button>` : null}</h3>
    <div className="panel"><${Table} rows=${ent} empty=${html`<${Empty} title="لا حركات في الفترة" />`} cols=${[
      { key: 'date', label: 'التاريخ', render: (r) => html`<span className="num">${sd(r.date)}</span>` },
      { key: 'desc', label: 'البيان' },
      { key: 'cat', label: 'الفئة', render: (r) => html`<span className="small">${G.PARTNER_CATS[r.cat]}</span>` },
      { key: 'ref', label: 'المرجع', render: (r) => html`<span className="num small">${r.ref || '—'}</span>` },
      { key: 'amount', label: 'المبلغ', n: true, render: (r) => html`<${M} v=${r.amount} cls=${r.amount < 0 ? 'neg' : ''} />` },
      { key: 'after', label: 'رصيد الفئة بعد الحركة', n: true, render: (r) => html`<${M} v=${r.after} />` }]} /></div>

}

      <button className="btn sm" onClick=${() => openModal('contribution', { type: 'advance' })}><${Icon} n="plus" s=${15} />تسجيل سلفة شريك</button>` : null}<//>
    <div className="kpis">

      <${Kpi} label="إجمالي أرصدة القروض" value=${G.sum(L, (o) => o.remaining)} tone="warn" active=${kf === 'loanBal'} onGo=${() => go('loanBal')} />
      <${Kpi} label="عدد السلف غير المسواة" raw=${A.length} unit=${false} active=${kf === 'advs'} onGo=${() => go('advs')} />
      <${Kpi} label="إجمالي أرصدة السلف" value=${G.sum(A, (o) => o.remaining)} active=${kf === 'advBal'} onGo=${() => go('advBal')} />
      <${Kpi} label=${'قروض قريبة من الاستحقاق (' + H + ' يوماً)'} raw=${all.filter(near).length} unit=${false} tone=${all.filter(near).length ? 'warn' : ''} sub=${money0(G.sum(all.filter(near), (o) => o.remaining)) + ' ر.س'} active=${kf === 'near'} onGo=${() => go('near')} />
      <${Kpi} label="السلف المتأخرة" raw=${all.filter(lateAdv).length} unit=${false} tone=${all.filter(lateAdv).length ? 'err' : ''} sub=${all.filter(lateAdv).length ? money0(G.sum(all.filter(lateAdv), (o) => o.remaining)) + ' ر.س' : 'لا توجد'} active=${kf === 'late'} onGo=${() => go('late')} />

      <${FilterBar} count=${all.length} active=${!!(fp || fs)} onClear=${() => { setFp(''); setFs(''); }}>

        { key: 'p', label: 'الشريك', sort: (r) => pName(s, r.partnerId), render: (r) => pName(s, r.partnerId) },
        { key: 'principal', label: 'أصل القرض', n: true, render: (r) => html`<${M} v=${r.principal} />` },
        { key: 'date', label: 'تاريخ التقديم', render: (r) => html`<span className="num">${sd(r.date)}</span>` },
        { key: 'due', label: 'تاريخ الاستحقاق', sort: (r) => r.due || '9999', render: (r) => r.due ? html`<div className="num">${sd(r.due)}</div><div className="sub">${r.remaining > 0 ? daysLabel(days(r)) : ''}</div>` : html`<span className="sub">غير محدد</span>` },
        { key: 'paid', label: 'المسدد', n: true, render: (r) => html`<${M} v=${r.paid} />` },
        { key: 'remaining', label: 'الرصيد المتبقي', n: true, render: (r) => html`<span className="strong"><${M} v=${r.remaining} /></span>` },
        { key: 'status', label: 'الحالة', render: st },

      ${showAdvs ? html`<div className="panel-b"><h3 className="sec-t">السلف</h3></div>
      <${Table} rows=${advs} empty=${html`<${Empty} icon="check" title="لا توجد سلف مطابقة" />`} cols=${[

function Distributions() {
  const { state: s, can, go, openModal } = useApp();
  const [tab, setTab] = useState('sim');
  const [src, setSrc] = useState(null);
  const dn = G.distributableNow(s);
  const pv = dn.pv || G.distributionPreview(s, { from: today(), to: today() });
  const obl = G.partnerObligations(s);
  const divUnpaidRows = obl.filter((o) => o.type === 'dividend' && o.remaining > 0);
  const divPaidRows = s.settlements.filter((t) => t.kind === 'dividend_pay' && !t.cancelledDate);
  const divUnpaid = G.sum(divUnpaidRows, (o) => o.remaining);
  const divPaid = G.sum(divPaidRows, (t) => t.applied != null ? t.applied : t.amount);
  const divApproved = G.sum(s.distributions, (d) => d.amount);
  const resBal = G.sum(G.reserveBalances(s), (r) => r.balance);
  const sug = G.suggestedSafety(s);
  const per = sd(dn.from) + ' — ' + sd(dn.to);
  const afterLoss = G.r2(pv.opProfit - pv.carriedLoss);
  // هل يمكن التوزيع الآن؟ — من نتيجة المحرك نفسها
  const blocking = pv.errors.filter((e) => !/مبلغ التوزيع صفر/.test(e));
  const canNow = dn.ok && pv.maxDist > 0;
  const reason = !dn.ok ? dn.reason : blocking.length ? blocking[0]
    : pv.profitAfterReserves <= 0 ? 'لا توجد أرباح بعد إطفاء الخسائر وتكوين المخصصات.'
    : pv.liquidityCap <= 0 ? 'النقد المتاح لا يكفي: بعد خصم الالتزامات القريبة' + (pv.reservesCash ? ' والمخصصات المغطاة نقداً' : '') + ' وحد الأمان النقدي لا يبقى نقد للتوزيع.' : '';
  const shareRows = pv.shares.map((x) => Object.assign({ id: x.partnerId }, x));
  const D = {
    op: { t: 'الربح التشغيلي للفترة', v: pv.opProfit, def: 'الإيرادات المعتمدة − المصروفات التشغيلية للفترة المفتوحة منذ آخر توزيع (' + per + '). ليس نقداً.', f: 'إيرادات المستخلصات المعتمدة − الاستقطاعات + إيرادات أخرى − المصروفات التشغيلية', rows: pv.stages.filter((x) => ['revenue', 'opex', 'op'].includes(x.key)).map((x) => [x.label, x.value]), more: ['opProfit', dn.from, dn.to] },
    loss: { t: 'الخسائر المرحلة', v: pv.carriedLoss, def: 'نتيجة سالبة لفترة سابقة لم يغطها توزيع؛ تُطفأ قبل أي توزيع.', f: 'الأكبر بين صفر و(− نتيجة الفترة السابقة)', rows: [['نتيجة الفترة السابقة غير المغطاة', pv.priorResult], ['الخسارة المرحلة المطفأة', pv.carriedLoss]] },
    res: { t: 'المخصصات المطلوبة للفترة', v: pv.reservesSum, def: 'المخصصات التي يجب تكوينها من ربح هذه الفترة قبل التوزيع، بالنسب المعتمدة في الإعدادات.', f: 'لكل مخصص: النسبة × أساس الاحتساب', rows: pv.reserves.map((r) => [r.label + ' — ' + (r.pctSet ? r.pct + '%' : 'غير محددة') + ' من ' + r.baseLabel, r.amount]).concat([['رصيد المخصصات المكوّنة سابقاً (للعلم)', resBal]]) },
    cash: { t: 'النقد المتاح', v: pv.cash, def: 'المبالغ الموجودة فعلياً في البنك والصندوق والعهد الآن.', f: 'رصيد كل حساب = الافتتاحي + المقبوضات − المدفوعات', rows: G.accountBalances(s).map((a) => [a.name, a.balance]), more: ['cash'] },
    obl: { t: 'الالتزامات المستحقة قريباً', v: pv.oblTotal, def: 'التزامات يجب أن تُسدَّد قبل أي توزيع: الفواتير غير المسددة، الضريبة، الأرباح المعتمدة غير المصروفة، مستحقات الشركاء، وما يستحق خلال ' + (s.settings.liabilityHorizon || 30) + ' يوماً.', f: 'مجموع الالتزامات أدناه', rows: pv.obligations.map((o) => [o.label + (o.party ? ' — ' + o.party : ''), o.amount]) },
    safety: { t: 'حد الأمان النقدي', v: pv.safety, def: 'مبلغ يبقى في الحسابات دائماً ولا يُوزَّع. يُعدَّل من الإعدادات فقط.', f: 'القيمة المعتمدة في الإعدادات', rows: [['الحد المعتمد في الإعدادات', pv.safety]].concat(sug.ok ? [['الحد المقترح للاسترشاد (متوسط المصروفات النقدية الشهرية ÷ 2)', sug.value]] : []) },

function DistSim() {

    ${pv.errors.map((e, i) => html`<${Callout} key=${'e' + i} kind="err">${e}${e.indexOf('غير محددة') > -1 && can('settings') ? html` <button className="link" onClick=${() => go('settings')}>فتح الإعدادات</button>` : null}<//>`)}
    ${pv.warnings.map((w, i) => html`<${Callout} key=${'w' + i} kind="warn">${w}<//>`)}
    <div className="grid g-main">
      <div className="panel"><div className="panel-h"><h3>الشلال المالي</h3><span className="sub">انقر أي مرحلة لعرض تفاصيل الحساب</span></div><div className="panel-b"><${Waterfall} stages=${pv.stages} selected=${sel} onSelect=${setSel} /></div></div>
      <div className="panel"><div className="panel-h"><h3>${stage ? stage.label : ''}</h3></div><div className="panel-b stack">
        <div className="big"><span className="num">${stage ? money(stage.value) : ''}</span>${SAR}</div>
        <div className="small" style=${{ lineHeight: 1.8 }}>${stage ? stage.detail : ''}</div>
        ${sel === 'liq' ? html`<div className="hr"></div><div className="small strong">الالتزامات المخصومة (${pv.obligations.length})</div>${pv.obligations.map((o) => html`<div key=${o.id} className="kv small"><span>${o.label}${o.party ? ' — ' + o.party : ''}</span><${M} v=${o.amount} /></div>`)}` : null}
        ${sel === 'res' ? pv.reserves.map((r) => html`<div key=${r.key} className="kv small"><span>${r.label} (${r.pctSet ? r.pct + '%' : 'غير محددة'})</span><${M} v=${r.amount} /></div>`) : null}

      <${Table} rowKey="partnerId" rows=${pv.shares} foot=${html`<td colSpan="3">الإجمالي</td><td className="n"><${M} v=${G.sum(pv.shares, (x) => x.amount)} /></td>`} cols=${[
        { key: 'p', label: 'الشريك', render: (r) => pName(s, r.partnerId) },
        { key: 'pct', label: 'النسبة المعتمدة', render: (r) => r.role === 'operating' ? r.pct + '% من الأرباح القابلة للتوزيع' : r.pct + '% من حصة الشركاء الرأسماليين' },

    </div></div>` : html`<div className="note">اعتماد التوزيع من صلاحية المدير العام. هذه محاكاة للاطلاع فقط.</div>`}
  </div>`;
}

/* ======================= الالتزامات والمستحقات ======================= */
const SRC_L = { bill: 'فواتير موردين', scheduled: 'التزامات مجدولة', partner: 'مستحقات شركاء', dividend: 'أرباح معتمدة', vat: 'ضريبة القيمة المضافة' };
const LIAB_ST = { late: ['err', 'متأخر'], partial: ['warn', 'مسدد جزئياً'], open: ['blue', 'قائم'] };
const LIAB_KF = {
  all: ['كل الالتزامات القائمة', () => true],
  d7: ['تستحق خلال 7 أيام', (o) => o.days != null && o.days >= 0 && o.days <= 7],
  d30: ['تستحق خلال 30 يوماً', (o) => o.days != null && o.days >= 0 && o.days <= 30],
  late: ['متأخرة', (o) => o.days != null && o.days < 0],
  sup: ['مستحقات الموردين', (o) => (o.src === 'bill' || o.src === 'scheduled') && !o.salary],
  prt: ['مستحقات الشركاء', (o) => o.src === 'partner' || o.src === 'dividend'],
  sal: ['الرواتب المستحقة', (o) => o.salary]
};
function Liabilities() {
  const { state: s, openModal, can, confirm, act } = useApp();
  const [src, setSrc] = useState(''); const [win, setWin] = useState(''); const [kf, setKf] = useState(''); const [q, setQ] = useState('');
  const all = oblRows(s);
  const rows = all.filter((o) => (!kf || LIAB_KF[kf][1](o)) && (!src || o.src === src) && (!q || (o.label + ' ' + (o.party || '') + ' ' + (o.ref || '')).includes(q)) && (!win || (win === 'late' ? o.days != null && o.days < 0 : o.days != null && o.days <= Number(win))));
  const sched = s.scheduled.filter((o) => o.status === 'open');
  const by = (k) => all.filter(LIAB_KF[k][1]);
  const go = (k) => { setSrc(''); setWin(''); setQ(''); setKf(kf === k ? '' : k); };
  const K = (k, label, tone, sub) => { const l = by(k); return html`<${Kpi} label=${label} value=${G.sum(l, (o) => o.remaining)} tone=${l.length ? tone : ''} sub=${sub || l.length + ' بند'} active=${kf === k} onGo=${() => go(k)} />`; };
  const vat = all.find((o) => o.src === 'vat');
  const pay = (o) => openOblPay(s, o, openModal);
  return html`<${Fragment}>
    <${PageIntro} text="كل ما على المؤسسة دفعه ومتى: فواتير الموردين، الرواتب، مستحقات الشركاء، الأرباح المعتمدة، والضريبة. كل بند يُحتسب مرة واحدة.">${can('edit') ? html`
      <button className="btn primary sm" onClick=${() => openModal('payObl', {})}><${Icon} n="wallet" s=${15} />تسجيل سداد التزام</button>
      <button className="btn sm" onClick=${() => openModal('scheduled', {})}><${Icon} n="plus" s=${15} />التزام مجدول</button>` : null}<//>
    <div className="kpis">
      ${K('all', 'إجمالي الالتزامات المستحقة', '', all.length + ' بند' + (vat ? ' — منها ضريبة ' + money0(vat.remaining) : ''))}
      ${K('d7', 'المستحقة خلال 7 أيام', 'warn')}
      ${K('d30', 'المستحقة خلال 30 يوماً', '')}
      ${K('late', 'الالتزامات المتأخرة', 'err')}
      ${K('sup', 'مستحقات الموردين', '')}
      ${K('prt', 'مستحقات الشركاء', '', by('prt').length + ' بند — قروض وسلف ومصروفات وأرباح')}
      ${K('sal', 'الرواتب المستحقة', 'warn')}
    </div>
    <div className="panel">
      <div className="panel-h"><h2>سجل الالتزامات والمستحقات</h2></div>

function Vehicles() {
  const { state: s, openModal, can, go } = useApp();
  const v = s.vehicle, vs = G.vehicleState(s);
  const t = today();
  const [tab, setTab] = useState('maint');
  const last = vs.fuel.length ? vs.fuel[vs.fuel.length - 1] : null;
  const [c, setC] = useState({ a: last ? (vs.fuel[vs.fuel.length - 2] || {}).odometer || '' : '', b: last ? last.odometer : '', l: last ? last.liters : '', t: last ? last.total : '' });
  const res = G.fuelCalc(c.a, c.b, c.l, c.t);
  const days = (d) => (d ? G.daysBetween(t, d) : null);
  const dd = (d) => { if (!d) return html`<div className="num strong">—</div><div className="small muted">غير مُدخل</div>`; const n = days(d); return html`<div className="num strong">${fdate(d)}</div><div className="small" style=${{ color: n < 0 ? 'var(--err)' : n <= 30 ? 'var(--warn)' : 'var(--ok)' }}>${daysLabel(n)}</div>`; };
  const fuelTot = G.sum(s.expenses.filter((e) => e.category === 'الوقود' && e.status === 'approved'), (e) => e.amount + e.vat);
  // حالة المركبة من وثائقها وموعد الزيت
  const issues = [], soon = [];
  [['التأمين', v.insuranceExpiry], ['الفحص الدوري', v.inspectionExpiry], ['الاستمارة', v.registrationExpiry]].forEach(([l, d]) => { const n = days(d); if (n == null) return; if (n < 0) issues.push(l + ' منتهٍ'); else if (n <= 30) soon.push(l + ' خلال ' + n + ' يوماً'); });
  if (vs.kmToOil < 0) issues.push('تغيير الزيت متجاوز'); else if (vs.kmToOil <= (s.settings.alerts.oilWarnKm || 1000)) soon.push('الزيت بعد ' + nf0.format(vs.kmToOil) + ' كم');
  const stat = issues.length ? ['err', 'تحتاج إجراءً', issues.join('، ')] : soon.length ? ['warn', 'تنبيه قريب', soon.join('، ')] : ['ok', 'جاهزة للعمل', 'الوثائق سارية والصيانة في موعدها'];
  const K = ({ label, tone, on, k, children }) => html`<div className=${'kpi' + (tone ? ' t-' + tone : '') + (tab === k ? ' kpi-on' : '')}><div className="kpi-l">${label}</div><button className="kpi-v kpi-link" style=${{ fontSize: 'inherit', fontWeight: 'inherit' }} onClick=${on} aria-label=${'عرض السجل: ' + label}>${children}</button></div>`;

      <button className="btn primary sm" onClick=${() => openModal('maintenance', {})}><${Icon} n="wrench" s=${15} />تسجيل صيانة</button>
      <button className="btn sm" onClick=${() => go('expenses', 'new:fuel')}><${Icon} n="fuel" s=${15} />تسجيل وقود</button>
      ${can('settings') ? html`<button className="btn sm" onClick=${() => openModal('vehicle', {})}><${Icon} n="edit" s=${15} />بيانات المركبة</button>` : null}` : null}<//>
    <div className="kpis">
      <${K} label="حالة المركبة" tone=${stat[0]} k="data" on=${() => setTab('data')}><div className="veh-status">${stat[1]}</div><div className="kpi-s">${stat[2]}</div><//>
      <${K} label="قراءة العداد الحالية" k="maint" on=${() => setTab('maint')}><span className="num">${nf0.format(vs.odometer)}</span><small>كم</small><div className="kpi-s">آخر صيانة ${fdate(v.lastServiceDate)}</div><//>
      <${K} label="تغيير الزيت القادم" tone=${vs.kmToOil < 0 ? 'err' : vs.kmToOil <= 1000 ? 'warn' : ''} k="maint" on=${() => setTab('maint')}><span className="num">${nf0.format(vs.nextOil)}</span><small>كم</small><div className="kpi-s">${vs.kmToOil < 0 ? 'متجاوز بـ ' + nf0.format(-vs.kmToOil) + ' كم' : 'متبقٍ ' + nf0.format(vs.kmToOil) + ' كم'}</div><//>
      <${K} label=${'التأمين (' + (v.insuranceStatus || '—') + ')'} k="data" on=${() => setTab('data')}>${dd(v.insuranceExpiry)}<//>
      <${K} label="الفحص الدوري" k="data" on=${() => setTab('data')}>${dd(v.inspectionExpiry)}<//>
      <${K} label="متوسط استهلاك الوقود" k="fuel" on=${() => setTab('fuel')}><span className="num">${vs.avgKmPerL ? vs.avgKmPerL.toFixed(2) : 'غير متاح'}</span>${vs.avgKmPerL ? html`<small>كم/لتر</small>` : null}<div className="kpi-s">${vs.avgCostPerKm ? vs.avgCostPerKm.toFixed(3) + ' ر.س لكل كم' : 'يلزم تعبئتان على الأقل بقراءات عداد'}</div><//>
    </div>
    <div className="panel">
      <div className="panel-h" style=${{ paddingBlock: 0 }}><${Tabs} value=${tab} onChange=${setTab} tabs=${[['maint', 'سجل الصيانة', s.maintenance.length], ['fuel', 'الوقود والاستهلاك', vs.fuel.length], ['data', 'بيانات المركبة والوثائق', null]]} /></div>
      ${tab === 'maint' ? html`<${Table} rows=${s.maintenance.slice().reverse()} empty=${html`<${Empty} title="لا صيانة مسجلة" />`} cols=${[
            { key: 'date', label: 'التاريخ', render: (r) => html`<span className="num">${sd(r.date)}</span>` },
            { key: 'odometer', label: 'العداد', n: true, render: (r) => html`<span className="num">${nf0.format(r.odometer)}</span>` },
            { key: 'desc', label: 'الوصف', render: (r) => html`${r.desc}${r.oil ? html` <${Badge} c="teal" plain>زيت<//>` : null}` }]} />` : null}
      ${tab === 'fuel' ? html`<div className="panel-b stack" style=${{ gap: 16 }}>
        <div><div className="row" style=${{ marginBottom: 8 }}><h3 style=${{ margin: 0, fontSize: 14 }}>سجل الوقود</h3><span className="small muted">إجمالي الوقود المعتمد ${money(fuelTot)} ر.س شاملاً الضريبة</span></div>
        <div className="panel"><${Table} rows=${vs.fuel.slice().reverse()} maxH=${420} empty=${html`<${Empty} title="لا تعبئات مسجلة" />`} cols=${[
          { key: 'date', label: 'التاريخ', render: (r) => html`<span className="num">${sd(r.date)}</span>` },
          { key: 'odometer', label: 'العداد', n: true, render: (r) => html`<span className="num">${nf0.format(r.odometer)}</span>` },
          { key: 'liters', label: 'لتر', n: true, render: (r) => html`<span className="num">${r.liters}</span>` },
          { key: 'total', label: 'القيمة', n: true, render: (r) => html`<${M} v=${r.total} />` },
          { key: 'distance', label: 'المسافة', n: true, render: (r) => r.distance == null ? '—' : html`<span className="num">${nf0.format(r.distance)}</span>` },
          { key: 'kmPerL', label: 'كم/لتر', n: true, render: (r) => r.kmPerL ? html`<span className="num">${r.kmPerL.toFixed(2)}</span>` : html`<span className="sub">غير متاح</span>` },
          { key: 'costPerKm', label: 'ر.س/كم', n: true, render: (r) => r.costPerKm ? html`<span className="num">${r.costPerKm.toFixed(3)}</span>` : '—' },
          { key: 'status', label: 'الحالة', render: (r) => html`<${Badge} c=${r.status === 'approved' ? 'ok' : 'warn'} plain>${r.status === 'approved' ? 'معتمد' : 'قيد المراجعة'}<//>` }]} /></div></div>
        <div><h3 style=${{ margin: '0 0 8px', fontSize: 14 }}>حاسبة استهلاك الوقود</h3>
          <div className="form">
            <${Field} label="قراءة العداد السابقة" id="fc-a"><input id="fc-a" type="number" value=${c.a} onInput=${(e) => setC(Object.assign({}, c, { a: e.target.value }))} /><//>

            <div className="kv"><span>متوسط الاستهلاك</span><span className="num strong">${res.kmPerL.toFixed(2)} كم/لتر</span></div>
            <div className="kv"><span>لكل 100 كم</span><span className="num">${res.lPer100.toFixed(2)} لتر</span></div>

      ${tab === 'data' ? html`<div className="panel-b"><div className="grid g3 small">

/* ======================= الفنيون ======================= */
function Technicians() {
  const { state: s, openModal, can } = useApp();
  const t = today();
  const [view, setView] = useState('');
  const openT = (tc) => s.tasks.filter((k) => k.assignee === tc.id && k.status !== 'done');
  const docsSoon = (tc) => (tc.docs || []).filter((d) => d.expiry && G.daysBetween(t, d.expiry) <= 60);
  const active = s.technicians.filter((x) => x.status === 'active');
  const allDocs = [].concat(...s.technicians.map(docsSoon));
  const openAll = s.tasks.filter((k) => k.assignee && k.status !== 'done');
  const list = s.technicians.filter((tc) => !view || (view === 'active' ? tc.status === 'active' : view === 'docs' ? docsSoon(tc).length : openT(tc).length));
  return html`<${Fragment}>
    <${PageIntro} text="الفنيون الميدانيون: من على رأس العمل، والوثائق والرخص التي تقترب من الانتهاء، والمهام والمصروفات الميدانية لكل فني.">${can('settings') ? html`<button className="btn primary sm" onClick=${() => openModal('tech', {})}><${Icon} n="plus" s=${15} />إضافة فني</button>` : null}<//>
    <div className="kpis">
      <${Kpi} label="عدد الفنيين" raw=${s.technicians.length} unit=${false} active=${view === ''} onGo=${() => setView('')} />
      <${Kpi} label="المتاحون (على رأس العمل)" raw=${active.length} unit=${false} tone="ok" active=${view === 'active'} onGo=${() => setView('active')} />
      <${Kpi} label="وثائق أو رخص تنتهي خلال 60 يوماً" raw=${allDocs.length} unit=${false} tone=${allDocs.some((d) => G.daysBetween(t, d.expiry) < 0) ? 'err' : allDocs.length ? 'warn' : ''} active=${view === 'docs'} onGo=${() => setView('docs')} />
      <${Kpi} label="مهام مفتوحة مسندة للفنيين" raw=${openAll.length} unit=${false} active=${view === 'tasks'} onGo=${() => setView('tasks')} />

    ${view ? html`<div className="row" style=${{ marginBottom: 10 }}><span className="small muted">${list.length} من ${s.technicians.length} فني حسب التصفية</span><button className="btn ghost sm" onClick=${() => setView('')}>عرض الكل</button></div>` : null}
    ${list.length ? html`<div className="grid g2">${list.map((tc) => {
      const tasks = s.tasks.filter((k) => k.assignee === tc.id);
      const open = openT(tc);
      const exp = s.expenses.filter((e) => e.submittedBy === tc.id);
      const pend = exp.filter((e) => e.status === 'pending');

      return html`<section key=${tc.id} className="panel">
        <div className="panel-h"><div className="avatar">${tc.name.slice(0, 1)}</div><div><h3>${tc.name}</h3><div className="sub">${tc.title}</div></div><span className="sp"></span><${Badge} c=${tc.status === 'active' ? 'ok' : 'gray'}>${tc.status === 'active' ? 'على رأس العمل' : tc.status === 'leave' ? 'إجازة' : 'منتهي الخدمة'}<//>${can('settings') ? html`<button className="btn ghost sm" onClick=${() => openModal('tech', { t: tc })}>تعديل</button>` : null}</div>
        <div className="panel-b stack">
          <div className="small strong">الوثائق والرخص (تاريخ الانتهاء)</div>
          ${docs.length ? docs.map((d, i) => { const n = G.daysBetween(t, d.expiry); return html`<div key=${i} className="kv small"><span>${d.name}</span><span><span className="num">${sd(d.expiry)}</span> <${Badge} c=${n < 0 ? 'err' : n <= 30 ? 'warn' : n <= 60 ? 'blue' : 'ok'} plain>${daysLabel(n)}<//></span></div>`; }) : html`<div className="small muted">لا وثائق مسجلة</div>`}
          <div className="hr"></div>
          <div className="small strong">المهام الحالية (${open.length} مفتوحة من ${tasks.length})</div>
          ${open.length ? open.map((k) => html`<div key=${k.id} className="kv small"><span>${k.title}</span><${Badge} c=${TASK_ST[k.status][0]} plain>${TASK_ST[k.status][1]}<//></div>`) : html`<div className="small muted">لا مهام مفتوحة</div>`}
          <div className="hr"></div>
          <div className="kv small"><span>مصروفات ميدانية مرسلة</span><span><span className="num">${exp.length}</span> — معلّق <span className="num">${pend.length}</span></span></div>
          <div className="kv small"><span>قيمة المصروفات الميدانية المعتمدة</span><${M} v=${G.sum(exp.filter((e) => e.status === 'approved'), (e) => e.amount + e.vat)} /></div>
          <details className="adv"><summary>تفاصيل الموظف</summary>
            <div className="kv small"><span>الرقم الوظيفي</span><span className="num">${tc.empNo || 'غير مسجل'}</span></div>

    <div className="note">لا تُعرض أرقام هويات أو إقامات أو أرقام هواتف في هذه الصفحة. بيانات الفنيين التجريبية افتراضية.</div>
  <//>`;
}

/* ======================= التقارير ======================= */
function buildReport(s, key, from, to, pid) {
  const inR = (d) => G.inRange(d, from, to);
  const N = (x) => G.r2(x);

const UNDO_KEY = 'gridx.undo.import';
function readUndo() { try { const raw = localStorage.getItem(UNDO_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }

// يُبنى ملف Excel حقيقي من مواصفة القالب: أوراق الدور + «القوائم» + ورقة مخفية _GRIDX تحدد نوع القالب وصاحبه
function addMetaSheet(X, wb, meta) {
  const ms = X.utils.aoa_to_sheet(meta); X.utils.book_append_sheet(wb, ms, window.GXImport.META);
  wb.Workbook.Sheets = wb.SheetNames.map((n) => ({ name: n, Hidden: n === window.GXImport.META ? 1 : 0 }));
}
function buildTemplate(s, tid, kind, opts) {
  const spec = window.GXImport.templateSpec(s, tid, kind || 'accountant', opts);
  const X = window.XLSX;
  const wb = X.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  const ins = X.utils.aoa_to_sheet(spec.instructions);
  ins['!cols'] = [{ wch: 8 }, { wch: 110 }];
  X.utils.book_append_sheet(wb, ins, 'تعليمات');
  spec.sheets.forEach((sh) => {
    const ws = X.utils.aoa_to_sheet([sh.headers].concat(sh.rows || []));
    ws['!cols'] = sh.widths.map((w) => ({ wch: w }));
    (sh.rows || []).forEach((r, i) => { const a = X.utils.encode_cell({ r: i + 1, c: 0 }); if (ws[a]) { ws[a].t = 's'; ws[a].z = '@'; } }); // المعرّف نص دائماً
    sh.hints.forEach((h, i) => { if (!h) return; const a = X.utils.encode_cell({ r: 0, c: i }); if (ws[a]) { ws[a].c = [{ a: 'GRIDX', t: h }]; ws[a].c.hidden = true; } });
    X.utils.book_append_sheet(wb, ws, sh.name);
  });
  const maxLen = Math.max(...spec.lists.map((l) => l[1].length));
  const rows = [spec.lists.map((l) => l[0])];
  for (let i = 0; i < maxLen; i++) rows.push(spec.lists.map((l) => (l[1][i] == null ? '' : l[1][i])));
  const lw = X.utils.aoa_to_sheet(rows);
  lw['!cols'] = spec.lists.map(() => ({ wch: 24 }));
  X.utils.book_append_sheet(wb, lw, 'القوائم');
  addMetaSheet(X, wb, spec.meta);
  return X.write(wb, { bookType: 'xlsx', type: 'array' });
}
function buildPartnerExport(s, pid, from, to) {
  const spec = window.GXImport.partnerExport(s, pid, from, to);
  const X = window.XLSX;
  const wb = X.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
  spec.sheets.forEach((sh) => { const ws = X.utils.aoa_to_sheet(sh.aoa); ws['!cols'] = sh.widths.map((w) => ({ wch: w })); ws['!protect'] = { selectLockedCells: true, selectUnlockedCells: true }; X.utils.book_append_sheet(wb, ws, sh.name); });
  addMetaSheet(X, wb, spec.meta);
  return { buf: X.write(wb, { bookType: 'xlsx', type: 'array' }), spec };
}

function glSettleCheck(s, t, f) {
  const P = [];
  if (!f.date) P.push('حدد تاريخ كشف البنك.');
  else if (f.date < t.start) P.push('تاريخ الكشف لا يكون قبل تاريخ بدء التشغيل.');
  else if (f.date > G.todayISO()) P.push('تاريخ الكشف لا يكون في المستقبل.');
  if (!String(f.ref || '').trim()) P.push('أدخل رقم كشف البنك أو المرجع.');
  const bals = f.date ? G.accountBalances(s, f.date) : [];
  const rows = t.rows.map((r) => { const a = bals.find((x) => x.id === r.accountId); const sys = a ? a.balance : NaN; const raw = (f.stmt || {})[r.accountId]; const stmt = raw === '' || raw == null ? NaN : Number(raw); const diff = G.r2(sys - stmt); return { r, sys, stmt, diff, ok: !isNaN(diff) && Math.abs(diff) <= 0.01 }; });
  rows.forEach((x) => { if (isNaN(x.stmt)) P.push('أدخل رصيد ' + x.r.name + ' حسب الكشف.'); else if (!x.ok) P.push(x.r.name + ': ما زال الفرق ' + money(x.diff) + ' ر.س؛ لا يمكن الإغلاق كتسوية.'); });
  return { rows, problems: P };
}

const STORE_KEY = 'gridx.state.v3';

const REPLACE_RULES = {
  importCommit: { roles: ['manager', 'accountant'], label: 'اعتماد الاستيراد' },
  undoImport: { roles: ['manager', 'accountant'], label: 'التراجع عن الاستيراد' },

};
function replaceAllowed(kind, role, state) {
  const r = REPLACE_RULES[kind];
  if (!r) return 'مسار غير معروف لاستبدال البيانات.';
  if (!r.roles.includes(role)) return '«' + r.label + '» ليس من صلاحية ' + ({ manager: 'المدير العام', accountant: 'المحاسب', technician: 'الفني', partner: 'الشريك' }[role] || 'هذا الدور') + '. لم يتغير شيء.';

const PRE_FIX_BACKUP = 'gridx.backup.pre-fixes';
// التدقيق النهائي 2026-10-27: البيانات المحفوظة التي تتعذر قراءتها لا يُكتب فوقها بالبيانات التجريبية بصمت.
// تُنسخ كما هي إلى مفتاح مستقل، وإن تعذّر النسخ يُمنع الحفظ كلياً حتى ينزّلها المستخدم ويقرر.
const DAMAGED_PREFIX = 'gridx.state.v3.damaged-';
// النسخة العامة (2026-10-28): تبدأ ببيانات تشغيلية فارغة — دون بيانات عرض — مع الإعدادات ودليل الحسابات والقيم الافتراضية اللازمة للمحرك.
// تُفعَّل بالعلامة window.GX_CLEAN_START في ملف النشر العام فقط؛ النسخة المحلية للاختبار تبقى بالبيانات التجريبية.
function cleanStart() {
  let s = window.GXImport.emptyState(window.GXSeed.buildSeed());
  s = G.migrate(s);
  const y = G.todayISO().slice(0, 4);
  Object.assign(s.settings, { orgName: 'GRID X | جريد اكس', fiscalYearStart: y + '-01-01', fiscalYearEnd: y + '-12-31', vatRegistered: false, vatHistory: [], operatingPct: 0, cashSafetyAmount: 0, capitalSplit: {} });

  try {

          // نسخة احتياطية داخلية من البيانات والإعدادات قبل تطبيق التعديلات (تُستعاد من صفحة «استيراد ونسخ احتياطي»)
          try { if (!localStorage.getItem(PRE_FIX_BACKUP)) localStorage.setItem(PRE_FIX_BACKUP, JSON.stringify({ ts: new Date().toISOString(), state: s, level: s.meta.fixLevel || 0 })); } catch (e) {}

          try { if (!localStorage.getItem(PRE_FIX_BACKUP + '-7')) localStorage.setItem(PRE_FIX_BACKUP + '-7', JSON.stringify({ ts: new Date().toISOString(), state: s, level: s.meta.fixLevel || 0 })); } catch (e) {}
          return { s: G.migrate(s), restored: true, migrated: true, raw };

        ${saveErr ? html`<${SaveAlert} e=${saveErr} toast=${toast} onClose=${saveErr.info ? () => setSaveErr(null) : null} />` : null}
        <div className="demo-bar" role="note"><${Icon} n="info" s=${15} /><span>${state.meta && state.meta.demo === false ? html`<b>بيانات فعلية — نموذج أولي:</b> البيانات محفوظة في هذا المتصفح فقط؛ صدّر نسخة احتياطية بانتظام من صفحة «استيراد ونسخ احتياطي». تبديل الأدوار محاكاة للواجهات وليس حماية حقيقية.` : html`<b>نموذج أولي تجريبي:</b> جميع الأسماء والمبالغ والمشاريع افتراضية. البيانات محفوظة في هذا المتصفح فقط، وتبديل الأدوار محاكاة للواجهات وليس نظام صلاحيات آمناً.`}${role === 'partner' ? ' واجهة الشركاء للاطلاع فقط.' : ''}</span></div>
        <main className="content" id="main" tabIndex="-1">
          ${groupPages.length > 1 ? html`<nav className="subnav" aria-label=${'صفحات ' + curGroup[1]}>${groupPages.map(([k, l]) => html`<button key=${k} className=${page === k ? 'on' : ''} aria-current=${page === k ? 'page' : undefined} onClick=${() => go(k)}>${l}</button>`)}</nav>` : null}
          ${quick && quick.page === page ? html`<${QuickBanner} q=${quick} onAgain=${() => { const q = quick; setQuick(null); const ag = QUICK_REOPEN[q.p.quick]; if (ag) openModal(ag[0], ag[1]); else openModal(q.k, q.p); }} onLog=${() => { const q = quick; setQuick(null); go(q.p.quick === 'pay' ? 'expenses' : page, QUICK_LOG[q.p.quick] || null); }} onClose=${() => setQuick(null)} />` : null}
          <${Page} key=${page + nav.n} ...${pageProps} /></main>
        <${SiteFoot} />
      </div>
    </div>
    ${overlays}
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
// design-taste (app §13 ragged-row): عدد المؤشرات في الصف يُحسب من عددها وعرض الحاوية فتتساوى الصفوف (6 ← 3+3 أو 6 في صف) بدل 5+1
(function balanceRows() {
  const MIN = { kpis: 180, queue: 150, pcards: 250 };
  const run = () => { document.querySelectorAll('.kpis:not(.rk-grid), .queue, .pcards').forEach((el) => { const kind = el.classList.contains('queue') ? 'queue' : el.classList.contains('pcards') ? 'pcards' : 'kpis'; const items = Array.from(el.children).filter((x) => x.nodeType === 1 && getComputedStyle(x).display !== 'none'); const n = items.length; const w = el.clientWidth; if (!n || !w) return; const k = Math.max(1, Math.min(n, Math.floor((w + 1) / MIN[kind]))); const per = Math.ceil(n / Math.ceil(n / k)); if (el.style.getPropertyValue('--per') !== String(per)) el.style.setProperty('--per', String(per)); el.setAttribute('data-bal', ''); }); };
  let q = 0; const sched = () => { if (q) return; q = requestAnimationFrame(() => { q = 0; run(); }); };
  try { new MutationObserver(sched).observe(document.getElementById('root'), { childList: true, subtree: true }); window.addEventListener('resize', sched); sched(); } catch (e) {}
})();
</script>
